# Hand-written messy phrasings of KPI workbook questions — 20 per scheme.
#
# Each variant points at the workbook case it paraphrases (`of:` is a case id
# in cases.yaml) and inherits that case's expected figures, so it is scored
# exactly like the clean original. build_cases.py merges these into
# cases.yaml; edit here, not there.
#
# style tags: typo | no_scheme | hinglish | word_order | fragment | alias | abbrev
# `no_scheme` variants rely on scheme-specific vocabulary (person-days →
# MGNREGA, tranche → Focus Plus, houses completed → PMAY-G, applications →
# CM Elevate). If the bot asks which scheme instead, the harness taps the
# right scheme chip and the case is still scored — but it counts toward the
# clarification rate.

mgnrega:
  - {of: mgnrega-K1-01, say: "total manrega expenditur in meghalaya", style: [typo, alias]}
  - {of: mgnrega-K1-01, say: "how much money spent under nrega in meghalya", style: [alias, typo]}
  - {of: mgnrega-K1-01, say: "total expenditure kitna hai MGNREGA ka", style: [hinglish]}
  - {of: mgnrega-K1-02, say: "mgnrega expenditure category wise breakup", style: [word_order]}
  - {of: mgnrega-K1-03, say: "top 5 district expenditure mnrega", style: [fragment, typo]}
