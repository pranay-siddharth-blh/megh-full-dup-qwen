  - {of: mgnrega-K2-01, say: "households got employment nrega meghalaya total", style: [word_order, alias]}
  - {of: mgnrega-K2-01, say: "kitne households ko kaam mila mgnrega me", style: [hinglish]}
  - {of: mgnrega-K2-02, say: "households employed year wise trend", style: [no_scheme]}
  - {of: mgnrega-K2-04, say: "persondays trend all years", style: [no_scheme, typo]}
  - {of: mgnrega-K2-05, say: "100 days completed households per year", style: [no_scheme]}
