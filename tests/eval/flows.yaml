# Scripted multi-turn flows — clicking clarification / correction chips like a
# user in web/ai_query.html does (the harness sends the chip's {slot, value}
# with its text). A turn is either a typed message (a string) or
# {click: "<label prefix>"}, which taps the matching option of the previous
# reply (clarification options first, then "Change area" correction chips).
#
# expect.kind "resolved": pass when the final turn is a data answer with rows
# and every listed resolved entity / scheme matches. These flows exercise the
# FRAME_GATES_ENABLED slot-filling resume (Step 5); without it the "District"
# chip does not exist and the flow is expected to fail.
flows:
  - id: flow-expenditure-mgnrega-westgaro
    scheme: MGNREGA
    turns: ["what is the expenditure", {click: "MGNREGA"}, {click: "District"}, "westgaro hils"]
    expect: {kind: resolved, schemes: [MGNREGA], district: WEST GARO HILLS}

  - id: flow-houses-ekh
    scheme: PMAY-G
    turns: ["how many houses completed", {click: "District"}, "ekh"]
    expect: {kind: resolved, schemes: [PMAY-G], district: EAST KHASI HILLS}

  - id: flow-disbursement-focus-selsella
    scheme: Focus Plus
    turns: ["total disbursement", {click: "Focus Plus"}, {click: "Block"}, "selsella"]
    expect: {kind: resolved, schemes: [Focus Plus], block: SELSELLA}

  - id: flow-persondays-rigbhoi
    scheme: MGNREGA
    turns: ["persondays in 2023-24", {click: "District"}, "rigbhoi"]
    expect: {kind: resolved, schemes: [MGNREGA], district: RI BHOI}

  # ── follow-ups (Step 6): the frame decides the continuation and merges the
  #    previous turn's slots; the new message's slots win.
  - id: flow-followup-block-wise
    scheme: MGNREGA
    turns: ["total MGNREGA expenditure in EKH", "and block wise?"]
    expect: {kind: resolved, schemes: [MGNREGA], district: EAST KHASI HILLS}

  - id: flow-followup-same-year
    scheme: MGNREGA
    turns: ["total MGNREGA person-days in West Garo Hills in 2023-24", "same for 2022-23"]
    expect: {kind: resolved, schemes: [MGNREGA], district: WEST GARO HILLS, year_key: 2022}

  - id: flow-followup-what-about-pmay
    scheme: PMAY-G
    turns: ["total MGNREGA expenditure in West Garo Hills", "what about PMAY"]
    expect: {kind: resolved, schemes: [PMAY-G], district: WEST GARO HILLS}

  - id: flow-followup-compare-egh
    scheme: PMAY-G
    turns: ["PMAY-G houses completed in East Khasi Hills", "compare with EGH"]
    expect: {kind: resolved, schemes: [PMAY-G], district_list: [EAST GARO HILLS, EAST KHASI HILLS]}
