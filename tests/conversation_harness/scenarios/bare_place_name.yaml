# User report 2026-10-21: after "How much PMAY-G amount was released in East Garo
# Hills in FY 2023-24?", the bare "in ambare ading" got "I don't have information
# about that"; only "in ambare ading village" was answered. A place name alone —
# village, block or assembly constituency — must be recognised without the
# "village" / "block" / "constituency" word, in a follow-up and in a new question.

- name: P1_bare_village_followup
  doc: "PMAY-G EGH FY 2023-24 -> 'in ambare ading' answers for the village, scheme and year kept"
  tags: [user_reported, bare_place, context]
  account: superadmin
  turns:
    - say: "How much PMAY-G amount was released in East Garo Hills in FY 2023-24?"
      expect: {route: data, scheme: PMAY-G, year: FY 2023-24}
    - say: "in ambare ading"
      expect: {route: data, scheme: PMAY-G, year: FY 2023-24, numbers_any: [3880000]}

- name: P2_bare_village_every_scheme_mgnrega
  doc: "MGNREGA district answer -> a bare village name"
  tags: [user_reported, bare_place, context]
  account: superadmin
  turns:
    - say: "How many households were employed under MGNREGA in East Khasi Hills in FY 2023-24?"
      expect: {route: data, scheme: MGNREGA, year: FY 2023-24}
    - say: "in dangar dombah"
      expect: {route: data, scheme: MGNREGA, year: FY 2023-24, answer_contains: ["Dangar Dombah"]}

