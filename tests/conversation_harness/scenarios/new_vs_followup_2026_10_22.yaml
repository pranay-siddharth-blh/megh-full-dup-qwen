# D-061 — "Context Memory: New Question = New Answer" (user addendum, 2026-10-22).
# Every row of the addendum's section 5, plus the same rules in other words.
# Context for every scenario: turn 1 is "MGNREGA person-days in East Khasi Hills in 2022-23".
#   standalone (own scheme + own measure, no reference cue) -> inherits NOTHING: statewide
#     unless it names a place; its own year, else the year chips (D-065; never the old
#     year, never a silent latest FY); banner "(new question)".
#   follow-up (reference cue or fragment) -> inherits only what it leaves out; the level it
#     asks about and below are cleared.
#   vague ("how many beneficiaries?") -> one topic: that topic; two or more: chips.
# place_not / year_not keep the checks true whatever the latest FY is on the day of the run.

# ── Standalone = new question ────────────────────────────────────────────────
- name: NQ01_which_district_highest_same_scheme
  doc: "The reported bug: 'Which district has the highest beneficiaries in MGNREGA?' is all districts, not EKH, not 2022-23; the old question stays restorable"
  tags: [new_vs_followup, standalone, context]
  account: superadmin
  turns:
    - say: "MGNREGA person-days in East Khasi Hills in 2022-23"
      expect: {route: data, scheme: MGNREGA, place: East Khasi Hills, year: FY 2022-23, new_question: false}
    - say: "Which district has the highest beneficiaries in MGNREGA?"
      expect: {route: pause, pause_rule: year-not-specified}   # D-065: a new question with no year is asked
    - say: "2024-25"
      expect: {route: data, scheme: MGNREGA, place: all, year: FY 2024-25, new_question: true}
    - say: "Go back to the East Khasi Hills one"
      expect: {route: data, scheme: MGNREGA, place: East Khasi Hills, year: FY 2022-23, from_earlier: true}

