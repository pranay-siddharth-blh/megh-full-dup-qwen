  app/edge.py::_RESPONSES: "\"Hello! I answer questions about Meghalaya's MGNREGA, PMAY-G, Focus Plus, \"\r\n        \"CM Elevate, Focus Legacy, CM Elevate Legacy and CMSS data — person-days, expenditure, \"\r\n        \"houses sanctioned and completed, Focus Plus disbursements, CM Elevate applications \"\r\n        \"by scheme, Focus Legacy producer-group payments, CM Elevate Legacy subsidy and \"\r\n        \"loans disbursed, CMSS scholarship applications and payments, district and block \"\r\n        \"breakdowns — and general questions about how the schemes work.\""
  app/edge.py::_RESPONSES#3: "\"Yes — that's exactly what I'm here for. I can answer questions about \"\r\n        \"Meghalaya's MGNREGA, PMAY-G, Focus Plus, CM Elevate, Focus Legacy, CM \"\r\n        \"Elevate Legacy and CMSS schemes, in two ways: the actual data (person-days, expenditure, houses \"\r\n        \"sanctioned and completed, Focus Plus disbursements, CM Elevate applications, \"\r\n        \"Focus Legacy producer-group payments, CM Elevate Legacy disbursements, CMSS scholarships — by \"\r\n        \"district, block, village or \"\r\n        \"financial year), and how the schemes work (eligibility, benefits, documents, \"\r\n        \"how to apply). Ask in plain language and I'll take it from there.\""
  app/edge.py::_SCHEME_STARTERS: "\"CMSS\": [\n        \"How many CMSS scholarship applications are there?\",\n        \"CMSS students paid by district\",\n        \"Total CMSS amount disbursed in 2025-26\",\n        \"Which block has the most CMSS applications?\",\n        \"Who is eligible for CMSS?\",\n    ]"
  app/entity_resolver.py::_AC_CONTENTS_SQL: "\"CMSS\": (\"SELECT DISTINCT lgd_district, lgd_block, village_code FROM curated.v_cmss \"\n             \"WHERE UPPER(ac_name) = UPPER($1) AND entity_type <> 'Unresolved'\")"
  app/pipeline/common/c05_clarifications.py::_BANK_NOT_HELD_TEXT: "\"CMSS\": (\n        \"Bank details — account numbers, IFSC codes, bank names and transfer status — aren't \"\n        \"held for CMSS; only whether each scholarship was paid and the amount are. Shall I \"\n        \"answer with the students paid or the amount disbursed instead?\")"
  app/pipeline/common/c14_turn_stages.py::_knowledge_not_covered_answer: "\"That isn't something I hold. I cover seven Meghalaya schemes — MGNREGA \"\n        \"(rural employment), PMAY-G (rural housing), Focus Plus (farmer cash \"\n        \"benefit), CM Elevate (livelihood and enterprise support — its applications), \"\n        \"CM Elevate Legacy (CM Elevate's sanctions and disbursements) Focus Legacy \"\n        \"(producer group payments) and CMSS (the Chief Minister's Scholarship Scheme) — both how \"\n        \"each one works and its actual data. If your question is about one of \"\n        \"those, name it and I'll answer; if it's about another scheme or another \"\n        \"state, that's outside what I can see.\""
  app/schema_context.py::_SHARED_RULES: "\"\"\"\r\n  * Count villages by village_code or geography_key, never by name (duplicate names exist).\r\n  * The ENTIRE dataset is Meghalaya state — every row is already in Meghalaya. \"in Meghalaya\",\r\n    \"across Meghalaya\", \"state-wide\", \"overall\", or naming no place at all means NO geographic\r\n    filter whatsoever. Never emit lgd_district / lgd_block / lgd_village_name = 'Meghalaya'\r\n    (or ILIKE '%meghalaya%'), and never add a dim_geography sub-select on entity_type = 'State'\r\n    or lgd_village_name = 'MEGHALAYA' — no fact row's lgd_district matches that, so the filter\r\n    silently returns 0 rows. Add a district/block filter ONLY when the question names a\r\n    specific district or block.\r\n  * NEVER put DISTINCT — or a nested aggregate — inside a window function\r\n    (COUNT(DISTINCT x) OVER (...), SUM(DISTINCT x) OVER (...)). PostgreSQL rejects it\r\n    (\"DISTINCT is not implemented for window functions\"). Do the distinct\
    \ count in its own\r\n    CTE first, then apply the window function to that.\r\n  * \"What share / % of <metric> is concentrated in the top N% (or top decile / quartile) of\r\n    <districts | blocks | villages>\" — a concentration / Pareto question. Aggregate per unit,\r\n    rank, then divide — do NOT try to do it in one windowed expression:\r\n      WITH per_unit AS (\r\n        SELECT <unit>, SUM(<metric>) AS m FROM <curated object> [WHERE ...] GROUP BY <unit>\r\n      ), ranked AS (\r\n        SELECT m, NTILE(<100 / N>) OVER (ORDER BY m DESC) AS bucket FROM per_unit\r\n      )\r\n      SELECT ROUND(100.0 * SUM(m) FILTER (WHERE bucket = 1) / NULLIF(SUM(m), 0), 1)\r\n             AS pct_in_top_slice\r\n      FROM ranked\r\n      LIMIT 1;\r\n    top 10% -> NTILE(10); top 25% / quartile -> NTILE(4); top 5% -> NTILE(20). For \"top N\r\n    <units>\" (a count, not a percentage) rank with ROW_NUMBER() OVER (ORDER BY m DESC) and\r\n    divide the sum of rows <= N by the grand total instead.\r\
    \n  * COUNTING PEOPLE / HOUSEHOLDS ACROSS YEARS (business definition — a wrong sum here\r\n    looks perfectly plausible). A count of distinct people or households for one year\r\n    CANNOT be added to another year's: the same person appears in both. So:\r\n      - A question with no year (\"how many beneficiaries\", \"in total\", \"all years\",\r\n        \"overall\", \"till date\") about PEOPLE: if the scheme has a person identifier, count\r\n        it ONCE over all rows — COUNT(DISTINCT <person id>) with no year GROUP BY. Never\r\n        GROUP BY year and then sum the rows (Focus Plus: [[fp_benef_2223]] + [[fp_benef_2526]] = [[fp_benef_yearsum]] is\r\n        WRONG; the true all-years figure is [[fp_benef]]).\r\n      - A per-year breakdown (\"by year\", \"year-wise\", \"each year\") returns one row per\r\n        year AND, when an all-years total is also wanted, the cross-year distinct count\r\n        in its own column — never a sum of the yearly rows.\r\n      - If the scheme\
    \ has NO person / household identifier (MGNREGA: households_employed\r\n        and persons_employed are per-year tallies), no all-years unique count exists.\r\n        \"All years\" is still answered as ONE combined figure (the user's standing\r\n        instruction), but a multi-year SUM is aliased household_years / person_years and\r\n        called \"household-years\" / \"person-years\" — never households, persons or\r\n        beneficiaries. Split by year only when a year-wise breakdown is asked for.\r\n      - Money (amounts, expenditure) and events (payments, houses, person-days) DO add up\r\n        across years — the rule is only for counts of distinct people / households.\r\n  * GENDER (business definition): use only the gender data a scheme actually records —\r\n    MGNREGA: women_employment_provided only (men = persons_employed -\r\n    women_employment_provided; MGNREGA rule 6); Focus Plus: gender, 12.5K cohort only;\r\n    PMAY-G, Focus Legacy, CM Elevate Legacy and CMSS\
    \ record NO gender, and CM Elevate's\r\n    (scheme_specific ->> 'gender_id') is locked from the chatbot — answer \"not available\". Never label a total of all persons as \"men\" or \"women\".\r\n\"\"\""
  app/pipeline/schemes/cm_elevate.py::_{X}_ONLY_TERMS: "_CMSS_ONLY_TERMS = Matcher(Alt(\n    # the Chief Minister's Scholarship Scheme: no other scheme mentions a scholarship\n    \"cmss\", W(\"scholarship\", \"scholarships\"), \"post matric\",\n))"
  app/schema_context.py::_{X}_TABLES: "_CMSS_TABLES = \"\"\"\nCMSS TABLES\n  curated.v_cmss  -- THE query surface (Chief Minister's Scholarship Scheme). One row = one student\n      APPLICATION, paid or not; each student (member_key) appears once in 2025-26.\n      Columns: cmss_fact_id, member_key, year_key, financial_year, financial_year_short, geography_key,\n        village_code, lgd_village_name, lgd_block, lgd_district, entity_type, ac_number, ac_name,\n        district_lgd_code, block_lgd_code, amount_disbursed, is_disbursed, has_name_code_conflict, region\n      dim_year and dim_geography are PRE-JOINED: no join is needed for any statewide, district, block,\n      village, constituency or region figure. Money is RUPEES. No scheme_key column: the view is CMSS only.\n      Not on the row (not recorded at all): gender, age, institution, course / class, marks, student\n      names, application status or reason, any date — see CMSS RULES.\n\"\"\".strip()"
  app/schema_context.py::_{X}_RULES: "_CMSS_RULES = \"\"\"\nCMSS RULES (breaking these produces a wrong number, not just an ugly query):\n  1. Query curated.v_cmss. It is pre-joined; emit no join for an ordinary question. NEVER join v_cmss or\n     fact_cmss_application row-to-row to another scheme's fact or view, and never match students across\n     schemes through member_key. No cross-scheme view includes CMSS: aggregate each scheme SEPARATELY\n     (to village_code or district) and combine the aggregates.\n  2. THERE IS NO MANDATORY PREDICATE (unlike PMAY's NOT is_placeholder). Every row counts.\n  3. One row = one student APPLICATION, paid or not.\n       applications / applicants / records       -> COUNT(*)\n       beneficiaries / students paid / received  -> COUNT(*) FILTER (WHERE is_disbursed)  — state the\n                                                    application total alongside it\n       unpaid applications                       -> COUNT(*) FILTER (WHERE NOT is_disbursed)\n\
    \       unique / distinct students                -> COUNT(DISTINCT member_key)\n     member_key is masked: COUNT(DISTINCT member_key) is its ONLY permitted use — never SELECT, GROUP BY,\n     ORDER BY or show it. No list of individual students is ever returned (no names exist): answer a\n     \"list the beneficiaries in <place>\" with counts by the next level down and say why.\n  4. MONEY: amount_disbursed is RUPEES and is NULL on unpaid rows (SUM ignores them). Divide by 1e7 for\n     crore, 1e5 for lakh, and state the unit. Never put a CMSS rupee figure beside MGNREGA's LAKH\n     unconverted. Every paid application received exactly Rs 6,000: AVG, MIN and MAX per paid student are\n     Rs 6,000 everywhere — never present a table of identical averages as if they varied, never rank by\n     amount. \"Per application\" = ROUND(SUM(amount_disbursed) / COUNT(*), 2), labelled \"per application\n     (paid and unpaid)\". Every money answer says the rate is a flat Rs 6,000 per paid student.\n\
    \  5. is_disbursed is NOT NULL, so NOT is_disbursed is the true complement. Unpaid carries no reason, status\n     or date: never call it rejected, pending, defective or failed — say \"not paid\".\n  6. GEOGRAPHY is the STUDENT'S HOME address, not the institution: say \"students from <place>\", never\n     \"studying in <place>\". Filter on the codes (district_lgd_code, block_lgd_code, village_code,\n     ac_number) and group on code and name together (GROUP BY district_lgd_code, lgd_district). Municipal\n     boards and town committees are reported as blocks; wards take the place of villages in towns.\n  7. entity_type = 'Unresolved' marks 1,218 applications with no village (all paid). INCLUDE them in State,\n     district and block counts and sums; EXCLUDE them (entity_type <> 'Unresolved') from village counts,\n     village lists and rankings and from constituency figures. Villages = COUNT(DISTINCT village_code)\n     FILTER (WHERE entity_type <> 'Unresolved').\n  8. CONSTITUENCY (ac_number,\
    \ ac_name) is NULL on the Unresolved rows, so constituency totals reach\n     103,609, not the State total — say so. region groups districts.\n  9. TIME: only FY 2025-26 is loaded (financial_year_short = '2025-26'). No year or \"this year\" -> 2025-26.\n     Any other year -> \"no CMSS data is loaded for <year>\", never 0. Trend / year-on-year -> the single year\n     and \"a trend needs more years\". No application, payment or other date exists; the academic year is\n     not the financial year.\n 10. NOT HELD — gender, age, institution type / name / location, course or class, marks, fresh / renewal,\n     application status or reason, payment date, income / caste / community, student names: answer \"not\n     recorded in the CMSS data\" and offer district, block, constituency, village or paid / unpaid. Never\n     approximate one dimension with another.\n 11. RANKING: rank on counts (applications or students paid); default top 5 for a plural \"top\", LIMIT 1\n     for \"highest / lowest\"\
    . Village and constituency rankings exclude Unresolved rows. Show ties in full.\n\"\"\".strip()"
  app/schema_context.py::_{X}_VOCAB: "_CMSS_VOCAB = \"\"\"\nCMSS BUSINESS VOCABULARY (source: data/cmss/cmss_schema_partitions.yaml)\n    \"applications\" / \"applicants\" / \"students applied\" / \"records\" -> COUNT(*)\n    \"beneficiaries\" / \"students paid\" / \"students received\" -> COUNT(*) FILTER (WHERE is_disbursed)\n    \"not paid\" / \"unpaid\" / \"missing disbursement\" -> COUNT(*) FILTER (WHERE NOT is_disbursed)   (never \"rejected\" / \"pending\")\n    \"unique students\" / \"distinct students\" -> COUNT(DISTINCT member_key)\n    \"amount\" / \"disbursed\" / \"paid out\" / \"spent\" / \"money\" -> SUM(amount_disbursed)  (rupees)\n    \"per student\" / \"average per beneficiary\" -> Rs 6,000 (flat)   \"per application\" -> ROUND(SUM(amount_disbursed) / COUNT(*), 2)\n    \"paid share\" / \"% paid\" -> ROUND(100.0 * COUNT(*) FILTER (WHERE is_disbursed) / COUNT(*), 2)\n    \"villages\" -> COUNT(DISTINCT village_code) FILTER (WHERE entity_type <> 'Unresolved')   \"wards\" -> entity_type\
    \ = 'Ward'\n    \"towns\" / \"municipal boards\" / \"town committees\" -> blocks (block_lgd_code)   \"region\" -> region\n    \"constituency\" / \"AC\" -> ac_number, ac_name (Unresolved rows excluded)\n    \"year\" / \"this year\" / \"2025-26\" -> financial_year_short = '2025-26' (the only year loaded)\n\"\"\".strip()"
  app/routers/stats.py::_cards: "def _cards(r: dict, years: \"dict | None\" = None) -> dict:\n    m, p, f, c, fl, cl, cs = (r[k] for k in (\"mgnrega\", \"pmay_g\", \"focus_plus\", \"cm_elevate\", \"focus_legacy\",\n                                             \"cm_elevate_legacy\", \"cmss\"))\n    # \"(4 yr)\" is the number of financial years the MGNREGA views hold, counted\n    n_mg = len((years or {}).get(\"mgnrega\") or [])\n    span = f\" ({n_mg} yr)\" if n_mg else \"\"\n\n    def ind(v):\n        return _indian(v) if _has(v) else _NO_FIGURE\n\n    def cr(v, star=False):\n        return _crore(v, star) if _has(v) else _NO_FIGURE\n\n    # the \"*\" (figures provisional) comes from the one dataset registry the chat\n    # answers read too (scheme_registry.DATASETS, data-accuracy brief 2026-10-29)\n    def prov(name):\n        return scheme_registry.DATASETS[name].provisional\n\n    return {\n        \"mgnrega\": [[f\"{float(m['person_days']) / 1e7:.2f} Cr\" if _has(m[\"person_days\"]) else\
    \ _NO_FIGURE,\n                     f\"Person-days{span}\"],\n                    # total_exp is in lakh: / 100 -> crore\n                    [f\"₹{float(m['exp_lakh']) / 100:,.2f} Cr\" if _has(m[\"exp_lakh\"]) else _NO_FIGURE,\n                     f\"Expenditure{span}\"],\n                    [ind(m[\"villages\"]), \"Villages with activity\"]],\n        \"pmay_g\": [[ind(p[\"sanctioned\"]), \"Houses sanctioned\"], [ind(p[\"completed\"]), \"Houses completed\"],\n                   [cr(p[\"released\"]), \"Funds released\"]],\n        \"focus_plus\": [[ind(f[\"payments\"]), \"Disbursements\"], [cr(f[\"amount\"], prov(\"Focus Plus\")), \"Amount disbursed*\"],\n                       [ind(f[\"districts\"]), \"Districts covered\"]],\n        \"cm_elevate\": [[ind(c[\"applications\"]), \"Applications\"], [ind(c[\"schemes\"]), \"Schemes\"],\n                       [ind(c[\"districts\"]), \"Districts covered\"]],\n        \"focus_legacy\": [[ind(fl[\"groups\"]), \"Producer Groups\"], [ind(fl[\"\
    memberships\"]), \"Memberships paid\"],\n                         [cr(fl[\"amount\"], prov(\"Focus Legacy\")), \"Amount remitted*\"]],\n        \"cm_elevate_legacy\": [[ind(cl[\"records\"]), \"Sanction records\"], [ind(cl[\"schemes\"]), \"Schemes\"],\n                              [cr(cl[\"disbursed\"], prov(\"CM Elevate Legacy\")), \"Disbursed (subsidy + loan)*\"]],\n        # CMSS: applications (paid or not), students paid, rupees paid — a flat Rs 6,000 per paid student\n        \"cmss\": [[ind(cs[\"applications\"]), \"Applications\"], [ind(cs[\"students_paid\"]), \"Students paid\"],\n                 [cr(cs[\"amount_disbursed\"], prov(\"CMSS\")), \"Amount disbursed\"]],\n    }\n"
