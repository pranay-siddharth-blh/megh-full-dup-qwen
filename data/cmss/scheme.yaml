  has_dates: true   # SUGGESTED from the live schema: all 5 onboarded schemes with has_dates have column financial_year, the others do not; the new view has it — a column is evidence, not proof: check it
  sub_scheme_column: null   # PROPOSED: one flat scheme, no sub-scheme column in v_cmss — confirm
  owned_tables: [v_cmss]   # from Qdrant: the views tagged 'CMSS'
  not_held: "CMSS records no gender, age, institution, course, student names, payment dates or the reason an application was not paid; only FY 2025-26 is held"   # PROPOSED: view metadata do_not_use_for + schema partitions — confirm
