- question: Were the CMSS applications with no village paid?
  sql: |
    SELECT COUNT(*) FILTER (WHERE is_disbursed)     AS paid,
           COUNT(*) FILTER (WHERE NOT is_disbursed) AS not_paid
    FROM curated.v_cmss
    WHERE entity_type = 'Unresolved';
  tables:
  - curated.v_cmss
  note: All are paid - they are real students whose village could not be mapped.
  expected: {paid: 1218, not_paid: 0}
- question: How many CMSS applications have a district or block name that disagrees with the LGD code?
  sql: |
    SELECT COUNT(*) AS name_code_conflicts
    FROM curated.v_cmss
    WHERE has_name_code_conflict;
  tables:
  - curated.v_cmss
  note: The DB comment quotes 35 (19 Tangnub on Saipung codes + 16 Betasing on Demdema villages). The CSV alone shows only the 19 - the other 16 are visible only against the roster.
  expected: {csv_emulation: 19, db_comment: 35}
- question: Rongram CMSS applications with and without a village
  sql: |
    SELECT COUNT(*) FILTER (WHERE entity_type = 'Unresolved')  AS without_village,
           COUNT(*) FILTER (WHERE entity_type <> 'Unresolved') AS with_village
    FROM curated.v_cmss
    WHERE block_lgd_code = 1965;
  tables:
  - curated.v_cmss
  note: Rongram holds 825 of the 1,218 unmapped applications.
  expected: {without_village: 825, with_village: 2841}

# ---- cross-scheme - aggregate each side, then combine -----------------------------
- question: Compare CMSS beneficiaries with NRLM SHGs by district
  sql: |
    WITH c AS (
      SELECT district_lgd_code, COUNT(*) FILTER (WHERE is_disbursed) AS cmss_students_paid
      FROM curated.v_cmss
      GROUP BY district_lgd_code),
    n AS (
      SELECT district_lgd_code, COUNT(*) AS nrlm_shgs
      FROM curated.v_nrlm
      GROUP BY district_lgd_code)
    SELECT c.district_lgd_code, c.cmss_students_paid, n.nrlm_shgs
    FROM c
    LEFT JOIN n ON n.district_lgd_code = c.district_lgd_code
    ORDER BY c.district_lgd_code;
  tables:
  - curated.v_cmss
  - curated.v_nrlm
  note: Each scheme aggregated to district in its own subquery, then joined on the code - never a row-level join. Different units (students vs groups) - say so.
  expected: null   # cross-scheme - the other scheme's data is not in datasets/CMSS; CMSS side verified separately
- question: Villages with both CMSS students and PMAY houses
  sql: |
    WITH c AS (
      SELECT village_code, COUNT(*) AS cmss_applications
      FROM curated.v_cmss
      WHERE entity_type <> 'Unresolved'
      GROUP BY village_code),
    p AS (
      SELECT village_code, COUNT(*) AS pmay_houses
      FROM curated.v_pmay
      WHERE NOT is_placeholder
      GROUP BY village_code)
    SELECT COUNT(*) AS villages_with_both
    FROM c
    JOIN p ON p.village_code = c.village_code;
  tables:
  - curated.v_cmss
  - curated.v_pmay
  note: Aggregate-then-combine on village_code. PMAY's NOT is_placeholder stays on the PMAY side only.
  expected: null   # cross-scheme - the other scheme's data is not in datasets/CMSS; CMSS side verified separately
