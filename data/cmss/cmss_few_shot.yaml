# cmss_few_shot.yaml
#
# Validated question-to-SQL pairs for CMSS - node 5.10.
#
# ===========================================================================
# v1.0 - 2026-11-04 - FIRST VERSION, WRITTEN AGAINST THE CURATED STAR SCHEMA
#
# Every example runs against curated.v_cmss (19 columns, one row per student
# application, paid or not).
#
# House rules encoded in every example below:
#   FROM curated.v_cmss                    never fact_cmss_application
#   COUNT(*)                               is an APPLICATION count - paid and not paid
#   COUNT(*) FILTER (WHERE is_disbursed)   is students PAID - the 'beneficiary' count
#   NOT is_disbursed                       is not paid - is_disbursed is NOT NULL
#   COUNT(DISTINCT member_key)             the ONLY permitted use of member_key
#   SUM(amount_disbursed)                  rupees; Rs 6,000 on every paid row, NULL otherwise
#   / 1e7 crore, / 1e5 lakh                and say the unit
#   district_lgd_code / block_lgd_code /   CODES in every WHERE - never a name literal
#   ac_number / village_code
#   GROUP BY <code>, <name>                never the display name alone
#   entity_type <> 'Unresolved'            on village and constituency questions ONLY
#   financial_year_short = '2025-26'       the only year loaded
#   towns are blocks                       11 block_lgd_code values above 200000
#
# Questions CMSS must refuse (gender, institution type, student lists, highest-paid
# student, other years, trends, payment dates, rejection reasons, cross-scheme
# person matching) have no SQL and are NOT in this file - they are in
# cmss_schema_partitions.yaml few_shot_examples with sql: null, and the gate in
# cmss_classification_rules.yaml catches them first.
#
# NOT ONE OF THESE QUERIES HAS BEEN EXECUTED against megh_db. They are correct
# against the structure in SCHEMA_FOR_DEVELOPERS.md (2026-11-03). Every `expected`
# value was produced by executing the SQL against a SQLite emulation of v_cmss
# built from datasets/CMSS/CMSS - 2026-10-23.csv. Run them against megh_db before
# trusting a result. Counts and codes are exact; DISPLAY NAMES inside an expected
# value (lgd_district, lgd_block, ac_name) are the source file's spellings upper-cased
# - the roster's stored spellings, especially for the 11 towns, may differ.
# ===========================================================================

sql_generation_examples:

# ---- applications and beneficiaries ----------------------------------------
- question: How many beneficiaries are recorded under CMSS?
  sql: |
    SELECT COUNT(*) FILTER (WHERE is_disbursed) AS beneficiaries_paid,
           COUNT(*)                             AS applications
    FROM curated.v_cmss;
  tables:
  - curated.v_cmss
  note: Use case 1. A beneficiary is a paid student; the application total travels with it.
  expected: {beneficiaries_paid: 98751, applications: 104827}
- question: How many CMSS applications were received?
  sql: |
    SELECT COUNT(*) AS applications
    FROM curated.v_cmss;
  tables:
  - curated.v_cmss
  expected: 104827
- question: How many students received the CM scholarship?
  sql: |
    SELECT COUNT(*) AS students_paid
    FROM curated.v_cmss
    WHERE is_disbursed;
  tables:
  - curated.v_cmss
  expected: 98751
- question: How many unique students applied for CMSS?
  sql: |
    SELECT COUNT(DISTINCT member_key) AS distinct_students
    FROM curated.v_cmss;
  tables:
  - curated.v_cmss
  note: member_key only inside COUNT(DISTINCT). Equal to applications in 2025-26.
  expected: 104827
- question: How many CMSS applications were not paid?
  sql: |
    SELECT COUNT(*) AS not_paid
    FROM curated.v_cmss
    WHERE NOT is_disbursed;
  tables:
  - curated.v_cmss
  note: No reason is recorded - report as 'not paid', never 'rejected'.
  expected: 6076
- question: What share of CMSS applications were paid?
  sql: |
    SELECT ROUND(100.0 * COUNT(*) FILTER (WHERE is_disbursed) / COUNT(*), 2) AS paid_pct
    FROM curated.v_cmss;
  tables:
  - curated.v_cmss
  expected: 94.2
- question: Give me paid, not paid and total CMSS applications
  sql: |
    SELECT COUNT(*)                                 AS applications,
           COUNT(*) FILTER (WHERE is_disbursed)     AS paid,
           COUNT(*) FILTER (WHERE NOT is_disbursed) AS not_paid
    FROM curated.v_cmss;
  tables:
  - curated.v_cmss
  expected: {applications: 104827, paid: 98751, not_paid: 6076}
- question: Paid versus not paid CMSS applications
  sql: |
    SELECT CASE WHEN is_disbursed THEN 'Paid' ELSE 'Not paid' END AS payment_status,
           COUNT(*) AS applications
    FROM curated.v_cmss
    GROUP BY 1
    ORDER BY applications DESC;
  tables:
  - curated.v_cmss
  expected: {rows: 2, values: [{payment_status: "Paid", applications: 98751}, {payment_status: "Not paid", applications: 6076}]}

