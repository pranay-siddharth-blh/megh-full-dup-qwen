  constituency:
    number_column: ac_number
    name_column: ac_name
    stored_case: ac_name spelling and case in dim_geography UNVERIFIED - filter on ac_number only
    distinct: 60
    complete: true            # all 60 ECI numbers present
    nulls: 1218
    null_note: NULL on exactly the 1,218 applications with no village. A constituency total reaches 103,609, not 104,827.
    sql_predicate: "ac_number = <number>"
    source_columns_note: >
      The source's mapped_constituency_name (mixed case) and mapped_constituency_name_and_number
      ('<n> <NAME>') live on the fact as constituency_name_raw / constituency_number_raw and
      are NOT in the view. v_cmss.ac_number / ac_name come from the roster. Both are listed as
      aliases so either spelling resolves.
    not_lgd: >
      Assembly constituencies are an ELECTORAL hierarchy parallel to LGD. 11 span two districts.
      Never treat a constituency as a level between district and block.
