  financial_year:
    stored_column: financial_year_short on curated.v_cmss
    long_column: financial_year
    key_column: year_key
    source: curated.dim_year, pre-joined into curated.v_cmss
    definition: April 1 to March 31, labelled 'YYYY-YY'
    sql_predicate: "financial_year_short = '<canonical>'"
    values:
    - { canonical: '2025-26', long: '2025-2026', year_key: 2025, applications: 104827, paid: 98751, note: "the only year loaded; first CMSS cycle" }
    accepted_forms:
    - "2025-26"       # canonical
    - "2025-2026"     # long form -> financial_year
    - "FY 2025-26"
    - "FY25-26"
    - "FY26"          # read as 2025-26 only because no other year is loaded - state it
    - "2025"          # bare year - gate calendar_year_requested
    relative_terms:
      latest: '2025-26'
      current_data_year: '2025-26'
      previous: "not_available - CMSS began in 2025-26"
      earliest: '2025-26'
      this_academic_session: "not_available - academic year is not the financial year (CM-21)"
    not_loaded_rule:
      critical: true
      text: >
        dim_year holds 42 years for all schemes, so a filter on another year would run and
        return 0 rows. Resolve any other year to not_available ('CMSS data is loaded for
        2025-26 only'), never to a predicate. Check curated.v_data_coverage when a new
        extract may have added a year.

  payment_status:
    column: is_disbursed
    type: boolean
    nulls: 0
    values:
    - canonical: true
      label: Paid
      applications: 98751
      aliases: ["paid", "disbursed", "received", "credited", "got the scholarship", "beneficiary",
                "beneficiaries", "benefited", "awarded", "DBT done", "money received"]
      sql_predicate: "is_disbursed"
    - canonical: false
      label: Not paid
      applications: 6076
      aliases: ["not paid", "unpaid", "not disbursed", "did not receive", "no amount", "zero disbursement",
                "missing disbursement", "without payment", "yet to be paid"]
      sql_predicate: "NOT is_disbursed"
      note: >
        No reason, status or date. 'Rejected', 'pending', 'defective' are NOT aliases -
        they are recognised as overloaded_terms.rejected_pending_defective and sent to the gate.

  entity_type:
    column: entity_type
    values:
    - { canonical: Village, aliases: [village, rural village, gaon, census town] }
    - { canonical: Ward, aliases: [ward, urban ward, municipal ward] }
    - { canonical: Unresolved, applications: 1218,
        aliases: [no village, village not recorded, unmapped, unknown village, without village],
        sql_predicate: "entity_type = 'Unresolved'" }
    note: >
      Whether the 120 CMSS ward codes are stored as 'Ward' or 'Village' is unverified_in_db.
      Never filter entity_type = 'Ward' to answer a ward question - resolve the ward to its
      village_code instead. The only reliable filter is entity_type <> 'Unresolved'.

  region:
    column: region
    stored_values: [Garo, Khasi, Jaintia]
    sql_predicate: "district_lgd_code IN (<codes>)"
    note: >
      Prefer the district-code IN list over region = '<value>' - Ri Bhoi's stored region is
      unverified. See region_groupings.

  identifiers:
    member_key:
      column: member_key
      type: char(64)
      pii: true
      resolvable: false
      rule: >
        NEVER resolved from user text, never shown, never filtered. Permitted only inside
        COUNT(DISTINCT member_key). A typed Meghalaya One member id returns refused.
    cmss_fact_id:
      column: cmss_fact_id
      type: bigint
      unique: true
      role: surrogate primary key
      unstable: Regenerated on reload. Never quote it back to a user.
      rule: identifier only - never SUM or AVG.
    source_application_id:
      column: fact_cmss_application.source_application_id
      role: >
        The source file's `id`. Not in the view. It is NOT the Unique Application Number a
        student sees on the Meghalaya One portal - never offer it as an application lookup.
    application_number_from_portal:
      resolvable: false
      rule: Not held. Refer the student to the Meghalaya One portal or helpline 1971.

measure_vocabulary:
  applications:
    aggregate: COUNT(*)
    aliases: [applications, applicants, students applied, records, registrations, how many applied, total applications]
    unit: applications
  beneficiaries:
    aggregate: COUNT(*) FILTER (WHERE is_disbursed)
    aliases: [beneficiaries, students paid, recipients, scholars, awardees, students who received, students covered, beneficiary count]
    unit: students
  not_paid:
    aggregate: COUNT(*) FILTER (WHERE NOT is_disbursed)
    aliases: [not paid, unpaid, not disbursed, zero disbursement, missing disbursement, no amount]
    unit: applications
  distinct_students:
    aggregate: COUNT(DISTINCT member_key)
    aliases: [unique students, distinct students, individual students, unique beneficiaries]
    unit: students
    note: Equal to applications in 2025-26.
  amount_disbursed:
    column: amount_disbursed
    aggregate: SUM(amount_disbursed)
    aliases: [amount disbursed, amount, total amount, money, scholarship amount, disbursement, funds,
              grant, assistance, DBT amount, paid out, released, expenditure on CMSS, spending]
    unit: rupees
    flat_rate: 6000
    note: >
      Every paid row is Rs 6,000. A ranking by amount is a ranking by students paid. Total
      Rs 59,25,06,000 = Rs 59.25 crore.
  derived:
    paid_share_pct: "ROUND(100.0 * COUNT(*) FILTER (WHERE is_disbursed) / COUNT(*), 2)"
    average_per_paid_student: "AVG(amount_disbursed)                 -- always 6000"
    average_per_application: "ROUND(SUM(amount_disbursed) / COUNT(*), 2)"
    amount_crore: "ROUND(SUM(amount_disbursed) / 1e7, 2)"
    amount_lakh: "ROUND(SUM(amount_disbursed) / 1e5, 2)"
    villages_covered: "COUNT(DISTINCT village_code) FILTER (WHERE entity_type <> 'Unresolved')"
  not_held:
    - gender / male / female
    - institution type / institution name / inside or outside Meghalaya
    - course / class level / marks
    - Fresh vs Renewal
    - application status / rejection reason / defects / verification
    - payment date / month / DBT status
    - budget / allocation / target / eligible-student population
    - caste / tribe / income

region_groupings:
  note: >
    Users group districts by hill range. Expand into an IN list by district_lgd_code and
    state which districts were included. Counts are by LGD code. v_cmss also carries a
    region column from the LGD master (Garo / Khasi / Jaintia); the IN list is preferred
    because Ri Bhoi's stored value is unverified.
  groups:
    "Garo Hills":
      districts: [East Garo Hills, North Garo Hills, South Garo Hills,
                  South West Garo Hills, West Garo Hills]
      district_codes: [273, 656, 277, 663, 278]
      stored_region: Garo
      applications: 33483
      paid: 31066
      aliases: [Garo, Garo region, Garo Hills region, GH]
    "Khasi Hills":
      districts: [East Khasi Hills, Eastern West Khasi Hills, South West Khasi Hills,
                  West Khasi Hills]
      district_codes: [274, 740, 658, 279]
      stored_region: Khasi
      applications: 43438
      paid: 41179
      aliases: [Khasi, Khasi region, Khasi Hills region, KH]
      note: >
        Ri Bhoi is NOT included. Its region value in the LGD master is unverified; if it is
        stored as 'Khasi', region = 'Khasi' gives 52,667 applications (49,880 paid). The gate
        asks (region_ri_bhoi_unconfirmed).
    "Jaintia Hills":
      districts: [East Jaintia Hills, West Jaintia Hills]
      district_codes: [657, 275]
      stored_region: Jaintia
      applications: 18677
      paid: 17805
      aliases: [Jaintia, Jaintia region, Jaintia Hills region, JH, Pnar region]
    "Ri Bhoi":
      districts: [Ri Bhoi]
      district_codes: [276]
      stored_region: unverified_in_db
      applications: 9229
      paid: 8701
      aliases: [Ri Bhoi region, Bhoi]
  urban_rural:
    towns: { block_codes: [249806, 249807, 249808, 249809, 249810, 249811, 249812, 249814, 249820, 279714, 282009],
             applications: 10173, paid: 9524, aliases: [urban, towns, municipal areas, ULBs, urban local bodies] }
    rural: { rule: "block_lgd_code NOT IN (<the 11 town codes>)", applications: 94654, paid: 89227,
             aliases: [rural, rural blocks, C&RD blocks, villages only] }
  whole_state:
    aliases: [Meghalaya, state, statewide, whole state, all districts, overall]
    behaviour: no district filter at all.
    applications: 104827
    paid: 98751

# ---------------------------------------------------------------------------
# WORKED EXAMPLES
# ---------------------------------------------------------------------------
worked_examples:

- user: "how many CMSS beneficiaries in EGH"
  resolve:
  - { text: EGH, type: district, canonical: East Garo Hills, code: 273, matched_by: 4_acronym }
  - { text: beneficiaries, type: measure, canonical: "COUNT(*) FILTER (WHERE is_disbursed)" }
  sql: "SELECT COUNT(*) FILTER (WHERE is_disbursed) AS paid FROM curated.v_cmss WHERE district_lgd_code = 273;"
  expected: 4554

- user: "CMSS students from district 657"
  resolve:
  - { text: "657", type: district, canonical: East Jaintia Hills, code: 657, matched_by: 1_exact }
  sql: "SELECT COUNT(*) AS applications FROM curated.v_cmss WHERE district_lgd_code = 657;"
  expected: 5812
  note: >
    By code. A source-name count gives 5,793 - the 19 Tangnub students are named Eastern West
    Khasi Hills in the file but coded 657.

- user: "beneficiaries in west khasi"
  resolve:
  - { text: "west khasi", type: district, canonical: West Khasi Hills, code: 279, matched_by: 2_alias }
  sql: "SELECT COUNT(*) FILTER (WHERE is_disbursed) AS paid FROM curated.v_cmss WHERE district_lgd_code = 279;"
  expected: 6968
  note: Must NOT fuzzy-match Eastern West Khasi Hills (blocked pair). If the user meant 740 they will say "eastern".

- user: "students paid in SWGH"
  resolve:
  - { text: SWGH, type: district, canonical: South West Garo Hills, code: 663, matched_by: 4_acronym }
  sql: "SELECT COUNT(*) FILTER (WHERE is_disbursed) AS paid FROM curated.v_cmss WHERE district_lgd_code = 663;"
  expected: 5442
  note: Must not land on West Garo Hills (blocked pair) even though "west garo" is a substring.

- user: "Mairang district CMSS applications"
  resolve:
  - { text: "Mairang district", type: district, canonical: Eastern West Khasi Hills, code: 740, matched_by: 2_alias }
  sql: "SELECT COUNT(*) AS applications FROM curated.v_cmss WHERE district_lgd_code = 740;"
  expected: 4967
  note: '"Mairang" alone hits the rural block (1982), the town committee (249811) and the constituency (30). The word "district" decides.'

- user: "CMSS in Shillong MB"
  resolve:
  - { text: "Shillong MB", type: town, canonical: Shillong Municipal Board, code: 249814, matched_by: 2_alias }
  sql: "SELECT COUNT(*) FILTER (WHERE is_disbursed) AS paid FROM curated.v_cmss WHERE block_lgd_code = 249814;"
  expected: 2321
  note: The same 2,495 applications as constituencies 16-19 together.

- user: "How many CMSS beneficiaries in Shillong?"
  resolve:
  - { text: Shillong, type: [town, district_alias], status: ambiguous }
  response: "Shillong Municipal Board (2,495 applications, the same students as the four Shillong constituencies), or the whole of East Khasi Hills (26,326)?"
  note: Gate shillong_scope_unclear.

- user: "students in Tura"
  resolve:
  - { text: Tura, type: [town, constituency], status: ambiguous }
  response: "Tura Municipal Board (1,015 applications) or the North Tura and South Tura constituencies (2,283 together)?"
  note: No rural block is called Tura. 'Tura district' is the alias of West Garo Hills (278).

- user: "beneficiaries in Nongstoin"
  resolve:
  - { text: Nongstoin, type: [block, town, constituency], status: ambiguous }
  response: "Nongstoin C&RD block (2,146 applications), Nongstoin Town Committee (1,727), or Nongstoin constituency (3,336)?"

- user: "beneficiaries in Nongstoin block"
  resolve:
  - { text: "Nongstoin block", type: block, canonical: Nongstoin, code: 1980, matched_by: 1_exact }
  sql: "SELECT COUNT(*) FILTER (WHERE is_disbursed) AS paid FROM curated.v_cmss WHERE block_lgd_code = 1980;"
  expected: 2057

- user: "beneficiaries in Nongstoin TC"
  resolve:
  - { text: "Nongstoin TC", type: town, canonical: Nongstoin Town Committee, code: 249810, matched_by: 2_alias }
  sql: "SELECT COUNT(*) FILTER (WHERE is_disbursed) AS paid FROM curated.v_cmss WHERE block_lgd_code = 249810;"
  expected: 1620

- user: "CMSS in Mawlai"
  resolve:
  - { text: Mawlai, type: [block, constituency, village], status: same_area_pair }
  sql: "SELECT COUNT(*) FILTER (WHERE is_disbursed) AS paid FROM curated.v_cmss WHERE block_lgd_code = 6540;"
  expected: 3008
  note: >
    Mawlai block (6540) and Mawlai constituency (15) hold exactly the same 3,161
    applications, so the number does not depend on the reading. Mawlai the village holds 7.
    State that the block was used.

- user: "How many paid in Jowai?"
  resolve:
  - { text: Jowai, type: town, canonical: Jowai Municipal Board, code: 249820, matched_by: 1_exact,
      assumption: town_named_without_rural_namesake }
  sql: "SELECT COUNT(*) FILTER (WHERE is_disbursed) AS paid FROM curated.v_cmss WHERE block_lgd_code = 249820;"
  expected: 1441
  note: Jowai constituency (2) is the other reading - 3,064 paid. Offer it as a follow-up.

- user: "Sohing constituency CMSS"
  resolve:
  - { text: Sohing, type: constituency, canonical: Sohiong, code: 23, matched_by: 2_alias }
  sql: "SELECT COUNT(*) FILTER (WHERE is_disbursed) AS paid FROM curated.v_cmss WHERE ac_number = 23;"
  expected: 2296
  note: Must not land on Sohra (28) - blocked pair.

- user: "beneficiaries in AC 36"
  resolve:
  - { text: "AC 36", type: constituency, canonical: Mawkyrwat, code: 36, matched_by: 2_alias }
  sql: "SELECT COUNT(*) FILTER (WHERE is_disbursed) AS paid FROM curated.v_cmss WHERE ac_number = 36;"
  expected: 3341

- user: "Dadenggre CMSS students"
  resolve:
  - { text: Dadenggre, type: constituency, canonical: Dadenggre, code: 49, matched_by: 1_exact }
  sql: "SELECT COUNT(*) FILTER (WHERE is_disbursed) AS paid FROM curated.v_cmss WHERE ac_number = 49;"
  expected: 1670
  note: >
    Dadenggre is the CONSTITUENCY (49); the BLOCK is spelled Dadenggiri (1963, 1,002 paid).
    One letter apart, different areas - blocked pair.

- user: "North Tura beneficiaries"
  resolve:
  - { text: "North Tura", type: constituency, canonical: North Tura, code: 50, matched_by: 1_exact }
  sql: "SELECT COUNT(*) FILTER (WHERE is_disbursed) AS paid FROM curated.v_cmss WHERE ac_number = 50;"
  expected: 2079
  note: South Tura (51) holds only 65 applications. Blocked pair.

- user: "Saipung block applications"
  resolve:
  - { text: "Saipung block", type: block, canonical: Saipung, code: 2000, matched_by: 1_exact }
  sql: "SELECT COUNT(*) AS applications FROM curated.v_cmss WHERE block_lgd_code = 2000;"
  expected: 1474
  note: By code. 19 source rows call this block Mairang (has_name_code_conflict).

- user: "Purakhasia students"
  resolve:
  - { text: Purakhasia, type: block, canonical: Purakhasia, code: 7418, matched_by: 1_exact }
  sql: "SELECT COUNT(*) AS applications FROM curated.v_cmss WHERE block_lgd_code = 7418;"
  expected: 593
  note: CM-09 - the block code is now filled for every Purakhasia student.

- user: "unpaid applications in Rongara"
  resolve:
  - { text: Rongara, type: block, canonical: Rongara, code: 1978, matched_by: 1_exact }
  - { text: unpaid, type: payment_status, canonical: false, sql_predicate: "NOT is_disbursed" }
  sql: "SELECT COUNT(*) FILTER (WHERE NOT is_disbursed) AS not_paid FROM curated.v_cmss WHERE block_lgd_code = 1978;"
  expected: 104
  note: The highest share not paid of any block (14.4%). Must not land on Rongram (blocked pair).

- user: "Mihmyntdu village CMSS beneficiaries"
  resolve:
  - { text: Mihmyntdu, type: village, canonical: Mihmyntdu, code: 279185, matched_by: 1_exact }
  sql: "SELECT COUNT(*) FILTER (WHERE is_disbursed) AS paid FROM curated.v_cmss WHERE village_code = 279185;"
  expected: 428
  note: The village with the most CMSS applications (454).

- user: "students from Umsaw"
  resolve:
  - { text: Umsaw, type: village, status: ambiguous }
  response:
  - { code: 278130, district: East Khasi Hills, block: Sohiong, applications: 128 }
  - { code: 276758, district: West Khasi Hills, block: Nongstoin, applications: 22 }
  - { code: 276898, district: West Khasi Hills, block: Nongstoin, applications: 1 }
  - "... 5 more in East Khasi Hills, Ri Bhoi and South West Khasi Hills"
  note: >
    The most-shared village name in CMSS (8 codes). resolve_by: code - two copies sit in
    the SAME block (Nongstoin), so even district + block is not enough. Ask with codes.

- user: "Ward No. 8 Tura"
  resolve:
  - { text: "Ward No. 8 Tura", type: ward, canonical: "Ward No. 8", code: 2368, matched_by: 1_exact,
      scoped_by: Tura Municipal Board }
  sql: "SELECT COUNT(*) AS applications FROM curated.v_cmss WHERE village_code = 2368;"
  expected: 146
  note: "'Ward No. 8' without the town is ambiguous - several towns number their wards from 1."

- user: "Mawprem ward 19 students paid"
  resolve:
  - { text: "Mawprem ward 19", type: ward, canonical: "Mawprem - Ward No.19", code: 3355, matched_by: 3_squash }
  sql: "SELECT COUNT(*) FILTER (WHERE is_disbursed) AS paid FROM curated.v_cmss WHERE village_code = 3355;"
  expected: 333
  note: In Shillong Municipal Board. The ward with the most CMSS applications (364).

- user: "CMSS in the Garo Hills"
  resolve:
  - { text: "Garo Hills", type: region, canonical: Garo Hills, codes: [273, 656, 277, 663, 278] }
  sql: "SELECT COUNT(*) FILTER (WHERE is_disbursed) AS paid FROM curated.v_cmss WHERE district_lgd_code IN (273, 656, 277, 663, 278);"
  expected: 31066
  note: Name the five districts in the answer.

- user: "status of member R3M2KN"
  resolve:
  - { text: R3M2KN, type: person_identifier, status: refused }
  response: "That is a Meghalaya One member id. It is masked in this data and cannot be looked up - the portal or helpline 1971 can help with an individual application."

- user: "female beneficiaries in Ri Bhoi"
  resolve:
  - { text: female, type: gender, status: not_available, reason: "Removed from the file (CM-15)." }
  - { text: Ri Bhoi, type: district, canonical: Ri Bhoi, code: 276, matched_by: 1_exact }
  response: "Gender is not recorded in the CMSS data. In Ri Bhoi, 8,701 students were paid in all."

- user: "CMSS beneficiaries 2024-25"
  resolve:
  - { text: "2024-25", type: financial_year, status: not_available, reason: "Only 2025-26 is loaded." }
  response: "CMSS data is loaded for 2025-26 only. Shall I answer for 2025-26?"
  note: Never emit financial_year_short = '2024-25' - it would return 0 rows.

- user: "FY 2025-2026 disbursement in Ri Bhoi"
  resolve:
  - { text: "FY 2025-2026", type: financial_year, canonical: '2025-26', matched_by: 2_alias }
