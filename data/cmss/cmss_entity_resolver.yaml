# ===========================================================================
# v1.0 - 2026-11-04 - FIRST VERSION, WRITTEN AGAINST THE CURATED VIEW
#
# Target: curated.v_cmss over curated.fact_cmss_application.
#
# Source column -> stored column:
#   member_id                -> member_key          HMAC-SHA256, NEVER resolved, NEVER shown
#   amount_disbursed         -> amount_disbursed    6000 or NULL
#                            -> is_disbursed        TRUE / FALSE (NOT NULL)
#   financial_year           -> financial_year_short '2025-26' (only value)
#   mapped_district_lgd_code -> district_lgd_code   KEPT - authoritative
#   mapped_district_lgd_name -> lgd_district        from the ROSTER, STORED UPPERCASE
#   mapped_block_lgd_code    -> block_lgd_code      KEPT - authoritative; includes 11 towns
#   mapped_block_lgd_name    -> lgd_block           from the ROSTER, STORED UPPERCASE
#   mapped_village_lgd_code  -> village_code        (Unresolved placeholder when NULL)
#   mapped_village_lgd_name  -> lgd_village_name    villages AND wards
#   mapped_constituency_*    -> ac_number / ac_name from the ROSTER (raw strings on the fact)
#
# The catalogues for district, block, constituency and the village ambiguity
# registry were GENERATED from the CSV by a script, grouped by LGD CODE (as the
# database filters them), on 2026-11-04. All counts are source-file figures and
# have NOT been re-verified against megh_db.
# ===========================================================================

description: >
  Value-level entity resolution for the CMSS NLP-to-SQL bot. This file answers exactly
  one question: the user typed some text - which stored database value did they mean?
  It does NOT define column meanings or aggregation; that is the companion stage2
  semantic schema. Resolve entities with this file FIRST, then hand the resolved
  canonical values - for geography, the LGD CODE - to schema linking and SQL generation.

scheme:
  id: cmss
  display_name: CMSS
  full_name: Chief Minister's Scholarship Scheme
  state: Meghalaya
  department: Education Department, Government of Meghalaya
  implementing_agency: Directorate of Higher and Technical Education (DHTE), Shillong
  portal: Meghalaya One (meghalayaone.gov.in)
  aliases: [CMSS, "CM Scholarship", "CM Scholarship Scheme", "Chief Minister Scholarship",
            "Chief Minister's Scholarship", "Chief Minister's Scholarship Scheme",
            "Chief Minister Scholarship Scheme Meghalaya", "CMSS Meghalaya",
            "Meghalaya CM Scholarship", "Meghalaya CM Scholarship Scheme", "CM scholarship scheme 2025",
            "state scholarship", "post matric state scholarship", "Rs 6000 scholarship",
            "6000 scholarship", "chief minister scholarship scheme 2025"]
  alias_note: >
    NOT aliases: "Post-Matric Scholarship for ST Students" / "NSP scholarship" / "umbrella
    scholarship" (a separate central scheme on the National Scholarship Portal), "pre-matric
    scholarship" (Classes I-X), "PMSS" / "Prime Minister's Scholarship Scheme" (ex-servicemen
    and CAPF wards). Also never "CM Elevate" or "CM Assure" - different CM schemes. See
    cmss_classification_rules.yaml other_scholarship_scheme_requested.

tables:
  applications: curated.v_cmss                  # primary query surface, 19 columns
  fact: curated.fact_cmss_application           # underlying fact, 24 columns, lineage only
  place_lookup: curated.v_place_names           # name -> level lookup across the roster
  coverage: curated.v_data_coverage             # years present per scheme
  reconciliation: meta.v_reconciliation_cmss    # operator check, not readable by megh_readonly

dataset_shape:
  grain: one row per CMSS student application (paid or not), financial year 2025-26
  row_count: unverified_in_db
  row_count_note: The source file holds 104827 rows. The curated count is unmeasured from this machine.
  single_table: true
  years_present: ['2025-26']
  emits_no_joins: >
    curated.v_cmss already pre-joins dim_geography and dim_year, so the generator emits
    WHERE and GROUP BY only. See cmss_foreign_key_augmentation.yaml.

# ---------------------------------------------------------------------------
# HOW TO USE THIS FILE
# ---------------------------------------------------------------------------
how_to_use:
  step_1_classify: >
    Decide the entity type of each span of user text. Order matters because town, block,
    village and constituency names collide - see cross_dimension_collisions. Try:
    financial_year -> district -> town -> block -> constituency -> village / ward ->
    region -> payment_status -> absent_dimension -> identifier -> measure.
  step_2_normalise: Apply normalisation.fold to the user text and to candidate values.
  step_3_match: Walk matching_pipeline in order; stop at the first stage that hits.
  step_4_emit: Return an output_contract shape. Never put raw user text into SQL.
  step_5_predicate: Build WHERE using the dimension's sql_predicate template - a CODE.

  hard_rules:
  - "CODES, NOT NAMES, REACH THE SQL. Every geography resolves to district_lgd_code,
    block_lgd_code, ac_number or village_code. lgd_district and lgd_block are stored
    UPPERCASE and the town spellings are unverified, so a name literal is never emitted."
  - "TOWNS ARE BLOCKS (CM-08). 11 municipal boards and town committees sit in
    block_lgd_code. A bare 'Nongstoin', 'Mairang', 'Resubelpara', 'Baghmara' or
    'Mawkyrwat' hits a rural block AND a town - return ambiguous."
  - "TURA AND SHILLONG ARE NOT RURAL BLOCKS. Tura = Tura Municipal Board (249806) or the
    North / South Tura constituencies (50, 51). Shillong = Shillong Municipal Board
    (249814), which holds exactly the students of the four Shillong constituencies (16-19),
    or the district East Khasi Hills."
  - Villages are resolved by village_code, never by name alone. 231 village names are
    shared by two or more different villages.
  - "WARDS ARE VILLAGES (CM-13). 'Ward No. 3' exists in several towns - scope it by town."
  - "THE GEOGRAPHY IS THE STUDENT'S HOME (CM-20). 'Colleges in Shillong' resolves the
    place, and the gate states that it is where students live."
  - "member_key / member_id is NEVER resolved. A typed member id returns refused, not a
    lookup. Student names do not exist - a name returns not_available."
  - "GENDER AND INSTITUTION TYPE DO NOT EXIST (CM-03/04/05/15). A span that names them
    returns not_available with the reason - see absent_dimensions."
  - "ONE YEAR. '2025-26' and its forms resolve; any other financial year resolves to
    not_available ('not loaded'), never to an empty filter that returns 0."
  - If more than one candidate survives, return ambiguous and ask. Never pick the first row.
  - If nothing matches above the fuzzy floor, return not_found with suggestions. Never
    invent a district, block, town, village or constituency.

# ---------------------------------------------------------------------------
normalisation:
  fold:
  - trim and collapse internal whitespace to single spaces
  - uppercase
  - strip trailing qualifier words: BLOCK, C&RD BLOCK, CD BLOCK, DISTRICT, VILLAGE, CONSTITUENCY, AC, LAC
  - "map MB -> MUNICIPAL BOARD and TC -> TOWN COMMITTEE (only as a trailing token after a town name)"
  - "strip the source's duplicated suffix: '-MUNICIPAL BOARD' after 'MUNICIPAL BOARD', '-TOWN COMMITTEE' after 'TOWN COMMITTEE'"
  - map & to AND
  - treat - / ( ) and . as a single space, then re-collapse whitespace
  squash: remove every non-alphanumeric character from the folded form
  numeric_ids: >
    district_lgd_code (3 digits), block_lgd_code (4 digits rural, 6 digits towns),
    village_code (up to 7 digits) and ac_number (1-60) are integers. Cast user-typed codes
    with int() and strip any trailing .0 before comparing.
  number_disambiguation: >
    A bare 1-2 digit number in a constituency context is an ac_number; a 3-digit number is
    a district code; a 4-digit number is a rural block code; a 6-digit number is a town
    block code or a village code - check both catalogues and ask if both hit.
  member_id_pattern: >
    '^[A-Z][0-9][A-Z][0-9][A-Z]{2}$' (e.g. R3M2KN) is the shape of a Meghalaya One member
    id. A span with this shape returns refused - never searched.
  ward_fold: >
    'Ward 8', 'Ward No 8', 'Ward No. 8', 'W8' fold to 'WARD NO 8'. Keep the town qualifier
    ('Tura ward 8') - it is what makes the ward unique.

matching_pipeline:
- { stage: 1_exact,     test: folded user text == folded canonical, confidence: 1.0 }
- { stage: 2_alias,     test: folded user text in the value's aliases, confidence: 0.98 }
- { stage: 3_squash,    test: squashed user text == squashed canonical or alias, confidence: 0.95 }
- { stage: 4_acronym,   test: district acronym table only, confidence: 0.95,
    note: acronyms are defined for districts and the towns' MB / TC forms only - do not invent them for rural blocks }
- stage: 5_contains
  test: folded canonical is a whole-word substring of the user text or vice versa
  confidence: 0.85
- stage: 6_fuzzy
  test: RapidFuzz token_set_ratio over the dimension catalogue
  accept_at: ">= 90 and runner-up at least 5 points lower"
  ask_between: 80 - 89, or any score where the runner-up is within 5 points
  reject_below: 80
- stage: 7_embedding
  test: BGE-small nearest neighbour over the dimension catalogue
  use_when: fuzzy returned nothing at or above 80
  accept_at: cosine >= 0.88 AND unique within its dimension
- { stage: 8_fail, action: emit not_found with up to 5 suggestions }

blocked_matches:
  purpose: >
    Pairs fuzzy matching gets wrong. Never let stage 6 or 7 resolve the left value to the
    right one; require an exact or alias hit.
  pairs:
  - [Laskein, Thadlaskein]                       # two different West Jaintia Hills blocks
  - [Thadlaskein, Laskein]
  - [Mawkynrew, Mawkyrwat]                       # East Khasi Hills vs South West Khasi Hills
  - [Mawkyrwat, Mawkynrew]
  - [Mawsynram, Mawshynrut]                      # East Khasi Hills vs West Khasi Hills
  - [Mawshynrut, Mawsynram]
  - [Siju, Saipung]
  - [West Khasi Hills, Eastern West Khasi Hills] # two districts, 279 vs 740
  - [Eastern West Khasi Hills, West Khasi Hills]
  - [West Garo Hills, South West Garo Hills]     # 278 vs 663
  - [South West Garo Hills, West Garo Hills]
  - [West Khasi Hills, South West Khasi Hills]   # 279 vs 658
  - [Mawphlang, Mawpat]
  - [Mawlai, Mawhati]
  - [Rongram, Rongara]
  - [Dadenggiri, Dadenggre]                      # block 1963 vs constituency 49 - different areas
  - [North Tura, South Tura]                     # constituencies 50 vs 51 (2,218 vs 65 applications)
  - [Nongstoin, Nongstoin Town Committee]        # rural block 1980 vs town 249810
  - [Mairang, Mairang Town Committee]            # 1982 vs 249811
  - [Resubelpara, Resubelpara Municipal Board]   # 1970 vs 249807
  - [Baghmara, Baghmara Municipal Board]         # 1977 vs 249809
  - [Mawkyrwat, Mawkyrwat Town Committee]        # 1984 vs 282009
  - [Sohiong, Sohra]                             # constituencies 23 vs 28
  - [Paid, Unpaid]

output_contract:
  resolved:
    status: resolved
    entity_type: district | block | town | village | ward | constituency | region |
                 financial_year | payment_status | measure
    user_text: <verbatim span>
    canonical: <display value>
    code: <district_lgd_code / block_lgd_code / village_code / ac_number - geography only>
    sql_predicate: <the dimension's code predicate, filled>
    confidence: <0-1>
    matched_by: <pipeline stage>
  ambiguous:
    status: ambiguous
    entity_type: <type or [types]>
    user_text: <verbatim span>
    candidates: [ { canonical, entity_type, code, district, block, applications } ]
    question: <one short question naming the distinguishing attribute>
  not_found:
    status: not_found
    entity_type: <type or unknown>
    user_text: <verbatim span>
    suggestions: [ up to 5 nearest catalogue values ]
    message: state plainly that the value is not in the CMSS data.
  not_available:
    status: not_available
    entity_type: <absent dimension, or financial_year>
    user_text: <verbatim span>
    reason: <one line - removed by the department, never collected, or year not loaded>
    offer: <the nearest answerable dimension>
    note: >
      New, from CM Elevate. A span naming gender, institution, course, status, date or an
      unloaded year is recognised and refused with a reason - it must not degrade to
      not_found, which would invite a guess.
  refused:
    status: refused
    entity_type: person_identifier
    user_text: <verbatim span>
    reason: The Meghalaya One member id is personal data, masked at the department's request (CM-23).
    note: New, from Focus+. Never echo the id back.

# ---------------------------------------------------------------------------
overloaded_terms:
  why: >
    A handful of words map to more than one column, or to a column that does not exist.
    Getting these wrong produces a confidently wrong answer, so they are listed explicitly.

  beneficiaries:
    means: "COUNT(*) FILTER (WHERE is_disbursed) - students paid"
    default: cmss_default_rules.yaml beneficiary_term - with the application total stated.
    note: The file holds paid AND unpaid applications (CM-01). 98,751 paid vs 104,827 applications.

  students:
    readings:
    - { means: "COUNT(*) - students who applied", when: "applied, applicants, applications, registered" }
    - { means: "COUNT(*) FILTER (WHERE is_disbursed) - students paid", when: "got, received, paid, benefited" }
    - { means: "COUNT(DISTINCT member_key)", when: "unique, distinct, individual students" }
    default: show applied and paid (student_term_unqualified).

  amount:
    means: SUM(amount_disbursed)
    aliases_that_mean_the_same: [amount, money, disbursement, disbursed, paid out, released, sanctioned, scholarship amount, grant, assistance, DBT]
    note: >
      'Sanctioned' and 'released' have no separate column - only the amount disbursed
      exists. Every paid row is Rs 6,000.

  paid:
    readings:
    - { means: "is_disbursed", when: "paid, disbursed, received, credited, got the money" }
    - { means: "NOT is_disbursed", when: "not paid, unpaid, not disbursed, did not receive, no amount" }
    note: is_disbursed is NOT NULL, so NOT is_disbursed is the exact complement.

  rejected_pending_defective:
    means: nothing stored
    critical: true
    note: >
      'Rejected', 'pending', 'defective', 'under verification', 'cancelled' are NOT
      recorded states. They never resolve to NOT is_disbursed silently - the gate asks
      (unpaid_described_as_rejected, pending_term_ambiguous).

  year:
    readings:
    - { means: "financial_year_short = '2025-26'", when: "2025-26, FY 2025-26, 2025-2026, this year as the data year, latest" }
    - { means: "not_available - not loaded", when: "any other financial year" }
    - { means: "not_available - academic session", when: "academic year, session, admission cycle" }
    - { means: "gate - calendar_year_requested", when: "a bare 2025 or 2026" }
    critical: true

  block:
    readings:
    - { means: "a rural C&RD block", when: "block, C&RD, development block, CD block" }
    - { means: "a town reported as a block", when: "municipal board, MB, town committee, TC, town, municipality, urban" }
    note: Both live in block_lgd_code (CM-08). 'Rural' signals the gate rural_only_or_urban_only_unclear.

  village:
    readings:
    - { means: "entity_type = 'Village'", when: "village, gaon, locality" }
    - { means: "a ward", when: "ward, ward number, locality in a town" }
    note: Both are village_code values (CM-13); a 'village count' includes wards.

  scholarship:
    means: CMSS only
    note: >
      'Scholarship' alone is CMSS here. 'NSP', 'post-matric ST', 'pre-matric', 'PMSS' are
      other schemes and go to the gate.

  average:
    readings:
    - { means: "AVG(amount_disbursed) - Rs 6,000", when: "average per beneficiary / per paid student" }
    - { means: "SUM(amount_disbursed) / COUNT(*)", when: "average per application, per applicant, per head" }
    note: The first never varies. Show both (average_amount_unspecified).

  highest_lowest:
    readings:
    - { means: "ranking of AREAS by students paid", when: "which district / block / village / constituency" }
    - { means: "gate - highest_or_lowest_student_amount_requested", when: "which beneficiaries / students got the most" }

  coverage:
    readings:
    - { means: "paid share of applications", when: "coverage of applicants, success rate, approval rate" }
    - { means: "gate - coverage_or_saturation_rate_requested", when: "coverage of eligible students, saturation" }

# ---------------------------------------------------------------------------
cross_dimension_collisions:
  measured:
    block_names_that_are_also_village_names: 27
    block_names_that_are_also_constituency_names: 26
    constituency_names_that_are_also_village_names: 25
    town_names_that_are_also_rural_block_names: 5
    district_collisions: 0
  block_village_collisions: [Adokgre, Amlarem, Baghmara, Batabari, Demdema, Gambegre, Laskein,
    Lumshnong, Mawhati, Mawkynrew, Mawkyrwat, Mawlai, Mawpat, Mawryngkneng, Mawshynrut,
    Pynursla, Rambrai, Ranikor, Rerapara, Rongram, Saipung, Selsella, Songsak, Tikrikilla,
    Umling, Umsning, Zikzak]
  block_constituency_collisions: [Amlarem, Baghmara, Bajengdoba, Chokpot, Dalu, Gambegre, Jirang,
    Kharkutta, Mairang, Mawhati, Mawkynrew, Mawkyrwat, Mawlai, Mawphlang, Mawryngkneng,
    Mawshynrut, Mawsynram, Mawthadraishan, Mylliem, Nongstoin, Pynursla, Ranikor,
    Resubelpara, Selsella, Songsak, Umsning]
  block_constituency_collisions_via_alias:
    note: >
      Found by the alias cross-check, not by name: the source spells these constituencies
      differently from the block, but the curated canonical or a truncated form is the
      block's name. A bare name hits both - ask.
    pairs:
    - { name: Rambrai,    block: 7333, constituency: "33 Rambrai-Jyrngam (source '33 RAMBRAI')" }
    - { name: Rongara,    block: 1978, constituency: "58 Rongara-Siju (source '58 RONGARA')" }
    - { name: Sohiong,    block: 6542, constituency: "23 Sohiong (source 'Sohing')" }
    - { name: Tikrikilla, block: 1964, constituency: "45 Tikrikilla (source 'Tikrikila')" }
  town_rural_block_collisions: [Baghmara, Mairang, Mawkyrwat, Nongstoin, Resubelpara]
  town_constituency_collisions: [Jowai, Nongpoh, Khliehriat, William Nagar, Baghmara, Mairang,
    Mawkyrwat, Nongstoin, Resubelpara]
  names_that_are_only_towns_or_constituencies: [Tura, Shillong, Jowai, Nongpoh, Khliehriat, William Nagar]
  same_area_pairs:
    note: >
      Two pairs cover EXACTLY the same applications, so either reading gives the same number.
      State which was used, but there is no need to ask when the number is all the user wants.
    pairs:
    - { a: "Mawlai block (6540)", b: "15 Mawlai constituency", applications: 3161 }
    - { a: "Shillong Municipal Board (249814)", b: "constituencies 16-19 (East, North, West, South Shillong)", applications: 2495 }
  disambiguation_rules:
  - If the user said "block", "C&RD block" or "CD block", resolve as rural block.
  - If the user said "municipal board", "MB", "town committee", "TC", "town" or "municipality", resolve as town.
  - If the user said "constituency", "AC", "LAC", "MLA" or "assembly", resolve as constituency.
  - If the user said "village", "ward" or "locality", resolve as village / ward.
  - If the user said "district" after a town name ("Mairang district"), resolve the district alias.
  - "With no qualifier on a colliding name, return AMBIGUOUS - the gate asks
    (ambiguous_geography_level, town_and_rural_block_share_name). CMSS does not default to
    block, unlike NRLM: the town readings make a silent default wrong too often."
  - "Exception: a name that is only a town (Jowai, Nongpoh, Khliehriat, William Nagar) defaults
    to the town without asking (cmss_default_rules.yaml town_named_without_rural_namesake),
    and the constituency is offered as a follow-up."
  - Districts never collide with anything; resolve them with no qualifier needed.

# ---------------------------------------------------------------------------
# ABSENT DIMENSIONS - recognised, then refused with a reason (output: not_available)
# ---------------------------------------------------------------------------
absent_dimensions:
  note: >
    Users ask for these by name. They are recognised so the bot can say WHY they are not
    held, rather than failing to find them. None has a column in v_cmss.
  gender:
    triggers: [gender, male, female, men, women, boys, girls, sex, other gender, transgender]
    reason: Removed from the file by the department (CM-15).
    offer: district, block or constituency
  institution_type:
    triggers: [institution type, institution, private professional institution, government college,
               university, school, college type, deemed university, polytechnic, ITI, NAAC, autonomous college]
    reason: Removed from the file by the department (CM-03, CM-04, CM-05).
    offer: district, block or constituency of the student's home
  institution_location:
    triggers: [outside Meghalaya, inside Meghalaya, studying in, college in, institution location, other state]
    reason: Never in the file. The geography is the student's home (CM-20).
    offer: home district or block
  course_or_class:
    triggers: [class XI, class XII, class 11, class 12, higher secondary, diploma, UG, undergraduate, graduation,
               PG, postgraduate, M.Phil, PhD, doctorate, course, stream, level of study]
    reason: Not in the file - every level is paid the same Rs 6,000.
    offer: total
  marks:
    triggers: [marks, percentage, 35%, result, pass, fail, grade]
    reason: Not in the file.
    offer: paid and not-paid counts
  application_track:
    triggers: [fresh, renewal, new applicant, renewed, first time]
    reason: Not in the file, and only one year is loaded.
    offer: 2025-26 total
  application_status:
    triggers: [status, rejected, rejection reason, defective, defect, under verification, verified, approved,
               sanctioned list, cancelled, refund]
    reason: Only paid / not paid is recorded (CM-02, CM-22).
    offer: paid and not-paid counts
  payment_date:
    triggers: [date, month, quarter, when paid, credited on, payment date, last week]
    reason: No date is recorded (CM-22).
    offer: financial year 2025-26
  bank_or_dbt:
    triggers: [bank, account, IFSC, DBT status, failed transfer, bounced]
    reason: Not held.
    offer: amount disbursed
  social_category:
    triggers: [caste, tribe, ST, SC, OBC, community, income, BPL, religion]
    reason: CMSS has no income or community criterion, so none is recorded.
    offer: all students
  person:
    triggers: [name, student name, member id, Meghalaya One id, application number, roll number]
    reason: Names removed (CM-16); member_id masked (CM-23).
    offer: area totals
    output: refused for a member id shape, not_available otherwise

# ---------------------------------------------------------------------------
# DIMENSIONS
# ---------------------------------------------------------------------------
dimensions:

  district:
    name_column: lgd_district
    code_column: district_lgd_code
    stored_case: UPPERCASE in curated.dim_geography (lgd_district)
    distinct: 12
    complete: true            # all 12 Meghalaya districts present
    collisions: none
    sql_predicate: "district_lgd_code = <lgd_code>"
    display_column: lgd_district
    code_note: >
      CMSS carries the district LGD code on every row (the department's mapping) and it is
      AUTHORITATIVE over the name - 19 source rows carry a contradicting name. Always filter
      on the code; lgd_district is for display and grouping only.
    alias_provenance: >
      canonical, lgd_code and every count are read from the CSV, grouped by LGD CODE.
      Acronyms and spelling variants are the curated forms shared with the NRLM and PMAY
      resolvers.
    values:
    - canonical: "East Garo Hills"
      stored: "EAST GARO HILLS"
      lgd_code: 273
      acronym: EGH
      region: "Garo"
      applications: 5082
      paid: 4554
      amount_crore: 2.7324
      block_count: 4
      town_count: 1
      village_count: 432
      unresolved: 8
      aliases: ["EGH", "E.G.H.", "East Garo Hill", "East Garo", "E Garo Hills", "E Garo Hill", "E Garo", "EastGaroHills", "East Garo Hills District", "Williamnagar district"]
    - canonical: "East Jaintia Hills"
      stored: "EAST JAINTIA HILLS"
      lgd_code: 657
      acronym: EJH
      region: "Jaintia"
      applications: 5812
      paid: 5517
      amount_crore: 3.3102
      block_count: 4
      town_count: 1
      village_count: 176
      unresolved: 0
      aliases: ["EJH", "E.J.H.", "East Jaintia Hill", "East Jaintia", "E Jaintia Hills", "E Jaintia Hill", "E Jaintia", "EastJaintiaHills", "East Jaintia Hills District", "Khliehriat district"]
      note: >
