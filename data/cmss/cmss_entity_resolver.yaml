  village:
    name_column: lgd_village_name
    code_column: village_code
    stored_case: as the roster records it (mixed case), NOT uppercased
    distinct_names: 5592
    distinct_codes: 5902
    villages: 5782
    wards: 120
    unresolved_applications: 1218
    integrity: >
      Verified clean in the source: no village code carries more than one name, and no
      village code appears in more than one block. The code is a reliable key; the NAME is not.
    sql_predicate: "village_code = <lgd_code>"
    lookup_source: >
      Village names are not listed here in full (5,592 names). Look them up in
      curated.v_place_names (level = 'village') or dim_geography / dim_geography_alias, then
      apply this registry to decide whether to ask.
    counting_villages: >
      COUNT(DISTINCT village_code) FILTER (WHERE entity_type <> 'Unresolved'). Wards count as
      villages (CM-13).
    wards_note: >
      In towns the ward takes the place of the village (CM-13): 'Ward No. 8' (Tura),
      'Mawprem - Ward No.19' (Shillong), 'Nongstoin (TC) - Ward No.1'. 'Ward No. 3' alone is
      ambiguous across towns - always scope a ward by its town.
    unresolved_placeholder:
      critical: true
      text: >
        The 1,218 applications with no source village carry their BLOCK's synthetic Unresolved
        placeholder code. That code is not a village. Never return it as a village match, never
        list its label as a village name, never count it as a village.
    resolution_strategy:
    - 1. If the user gave a numeric code, resolve on village_code directly.
    - 2. Fold the name and look it up scoped by any district or block also given.
    - 3. If exactly one code survives, resolve and emit the CODE, not the name.
    - 4. If more than one survives, return ambiguous with candidate codes plus their district and block.
    - 5. If none survive, run fuzzy then embedding, then not_found with 5 suggestions.
    ambiguity:
      shared_names: 231
      resolve_by_district: 154
      resolve_by_block: 72      # every copy in ONE district - ask for the block
      resolve_by_code: 5       # two copies in the SAME block - ask with codes
