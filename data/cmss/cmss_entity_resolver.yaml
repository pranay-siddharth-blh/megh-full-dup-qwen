  schema_authority: SCHEMA_FOR_DEVELOPERS.md          # live database extract, 2026-11-03
  catalogue_generator: >
    District, block, constituency and village-registry sections were generated by a pandas
    script grouping the CSV by LGD code. Re-run it on a new extract rather than editing
    counts by hand. Town canonical names and aliases are curated in the script.
  row_counts_at_generation: { source_file: 104827, curated.v_cmss: unverified_in_db }
  data_span_in_source: { financial_years: ['2025-26'] }
  last_generated: '2026-11-04'

  open_verification_tasks:
    critical: true
    note: >
      v1.0 was written from structure and the source file. NOTHING below has been measured
      against megh_db. Each item is a query to run before any CMSS answer ships.
    tasks:
    - "Row count: SELECT COUNT(*) FROM curated.v_cmss - expect 104827."
    - "Town spellings: SELECT DISTINCT block_lgd_code, lgd_block FROM curated.v_cmss WHERE block_lgd_code > 200000 - fill every 'stored: unverified_in_db'."
    - "Constituency names: SELECT DISTINCT ac_number, ac_name FROM curated.v_cmss ORDER BY 1 - confirm 60 numbers and record the stored spellings."
    - "Conflict rows: on has_name_code_conflict, does block_lgd_code agree with lgd_block? Expect 35 rows; check the 16 Betasing / Demdema rows."
    - "Region: SELECT DISTINCT district_lgd_code, region FROM curated.v_cmss - Ri Bhoi's value."
    - "Wards: SELECT entity_type, COUNT(DISTINCT village_code) FROM curated.v_cmss GROUP BY 1 - are the 120 wards 'Ward' or 'Village'?"
    - "Unresolved: SELECT COUNT(*) FROM curated.v_cmss WHERE entity_type = 'Unresolved' - expect 1218."
    - "dim_scheme: read CMSS's money_unit and data_as_of."

  regeneration_rules:
