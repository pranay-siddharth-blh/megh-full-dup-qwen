- "datasets/CMSS/CMSS - 2026-10-23.csv"
- "datasets/CMSS/CMSS Dataset Answers.xlsx"
- "datasets/CMSS/CMSS_Use_Cases.xlsx"
- "datasets/CMSS/cmss_meghalaya_complete_scheme_reference (1).md"
- SCHEMA_FOR_DEVELOPERS.md (live database extract, 2026-11-03 13:12 UTC)
generated_on: '2026-11-04'
