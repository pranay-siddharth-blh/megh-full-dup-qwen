# NOT LOADED BY THE APP (see app/annotations.py) - kept as the scheme team's reference only.
# Counts quoted below were computed from the Homestay source CSV (1,298 rows, README 2026-11-06); megh_db holds
# 1,297 (one application missing, 2026-11-11), so most counts differ by one. Never wire this file into the app
# without re-checking every figure against megh_db; tests/test_db_changes_2026_10_26.py fails if app code reads it.
# homestay_response_template.yaml
#
# ===========================================================================
# v1.0 - 2026-11-06 - WRITTEN AHEAD OF THE DATABASE LOAD
#
# Response templates for Homestay - node 5.15, the response composer.
# Editable by analysts - no code change needed.
# Numbers are locked from the result set; templates only shape the wording
# around them.
#
# EIGHT CAVEATS MUST TRAVEL WITH THE ANSWERS THEY BELONG TO. Each one is a way
# this feed produces a true number that reads as a false claim:
#
#   1. AN APPLICATION IS NOT A BENEFIT. 'Beneficiaries' in the client workbook are
#      applicants. Every applicant figure states how many are approved (80 of
#      1,298), and 'approved' is never called sanctioned, disbursed or built.
#   2. THERE IS NO MONEY. No cost, loan, subsidy, grant or EMI is recorded. Scheme
#      rates are quoted only as scheme rules, labelled so, never multiplied by a count.
#   3. NAME THE STATUS COLUMN. Pending (file status) is not Forward (file movement);
#      Unknown is not Rejected; On Hold is a verification result. Never mix them
#      unlabelled.
#   4. TWO PART YEARS. 2025-26 runs from October 2025 and 2026-27 only to
#      19 October 2026. All approvals are on 2025-26 applications. A year that is
#      not loaded is 'no data', never 0.
#   5. HOME, NOT SITE. Places are where applicants live unless the user asked where
#      the homestay is proposed. A tourism cluster is not a block.
#   6. NEW-BUILD FACILITIES ONLY. Rooms, solar, rainwater and waste were recorded for
#      the 1,274 new-homestay applications; the 3,500-room entry is left out of rooms.
#   7. VILLAGE AND CONSTITUENCY FIGURES EXCLUDE 64 UNMAPPED APPLICATIONS (1,234 vs 1,298).
#   8. CATEGORIES ARE SELF-DECLARED. Youth over 35 (41) and men in the Women
#      category (4) exist; gender and the Women category are different fields.
#   And one about identity: no applicant is ever named, listed or identified.
#
# Every figure quoted inside a template below is a source-file observation
# (datasets/Homestay/Home Stay API - 2026-11-01.csv, 2026-11-06), produced by
# executing SQL against an emulation of the planned view. Not verified in megh_db.
# ===========================================================================

response_templates:

  # ---- how the answer text is shaped ------------------------------------
  formatting:
    number_format: "indian"              # 1,298; 1,02,345 for larger numbers
    currency_symbol: "₹"                 # used ONLY when quoting a scheme rate
    decimal_places: 1
    percent_decimal_places: 1
    financial_year_format: "YYYY-YY"     # 2025-26; stored as financial_year_short
    date_format: "D Month YYYY"          # 19 October 2026 - application dates only
    month_format: "Mon YYYY"             # Nov 2025
    money_unit: null                     # no money column - never render a computed amount
    scheme_rate_display: "labelled"      # 'under the scheme rules, up to 70% ...'
    show_unit_always: true               # applications, people, rooms, percent
    show_assumptions: true
    show_approved_with_applications: true
    geography_display_case: "title"      # lgd_district / lgd_block are stored UPPERCASE
    town_display: "canonical"            # 'Tura Municipal Board', never 'Tura Municipal Board-Municipal Board'
    geography_phrase: "applications from {place}"
    site_geography_phrase: "homestays proposed in {place}"
    application_type_display:
      "Development of New Homestay": "new homestay"
      "Updragation of New Homestay": "upgradation of an existing homestay"   # never print the source typo
    application_mode_display:
      Online: "online"
      cmConnectCenter: "through a CM Connect Centre"
    current_level_display:
      level1: "level 1"
      level4: "level 4"
    verification_null_display: "not yet verified"
    null_display: "not recorded"
    unknown_status_display: "status Unknown (not explained in the data)"
    zero_display: "0"
    tie_behaviour: "show_all"
    empty_result_message: "No Homestay applications for that selection."
    max_rows_inline: 20
    person_identifiers: never_rendered   # member_key, member id, EPIC, family id, phone, request number, names

  # =======================================================================
  templates:

    # ---- result shapes --------------------------------------------------
    single_value: "{metric} for {scope} in {period} is {value}."
    multi_metric: "For {scope} in {period}: {metric_list}."
    application_count: "{value} Homestay applications from {scope} in {period}; {approved} are approved."
    beneficiary_count: "{value} people from {scope} have applied under the Homestay Mission in {period} ({value} applications); {approved} applications are approved so far."
    approved_count: "{value} Homestay applications from {scope} are approved, out of {applications}."
    status_breakdown: "Applications from {scope} by file status: {pending} Pending, {unknown} Unknown, {approved} Approved, {rejected} Rejected."
    movement_breakdown: "By latest file movement: {forward} Forward, {approved} Approved, {sendback} Sent back, {resubmit} Resubmitted."
    verification_breakdown: "By data verification: {valid} Valid, {invalid} Invalid, {on_hold} On Hold, {wrong} Wrong, {not_verified} not yet verified."
    approval_rate: "{rate}% of Homestay applications from {scope} are approved - {approved} of {applications}."
    distinct_people: "{value} different people from {scope} made {applications} applications."
    category_breakdown: "Applications by applicant category (as declared): {list}."
    gender_breakdown: "Applications by applicant gender: {female} female, {male} male."
    mode_breakdown: "{online} applications were made online and {cm_connect} through a CM Connect Centre."
    land_breakdown: "{owned} applications are on owned land and {leased} on leased land."
    rooms_total: "{value} guest rooms are proposed across {applications} new-homestay applications - {average} rooms on average."
    facility_share: "{value} of {base} new-homestay applications ({pct}%) propose {facility}."
    component_breakdown: "{new_build} applications are for a new homestay and {upgradation} for upgrading an existing one; no boutique-homestay application is recorded."
    month_series: "Applications by month: {series}."
    year_series: "Applications by financial year: {series}."

    ranked_list: "Top {n} {entity} by {metric}:"
    bottom_list: "Bottom {n} {entity} by {metric}:"
    extremes: "Highest is {top_entity} at {top_value}; lowest is {bottom_entity} at {bottom_value}."
    rank_position: "{scope} ranks {rank} of {total} {entity} by {metric}."
    tie_at_top: "{tied_entities} are level at {value}."

    breakdown: "{metric} by {level}:"
    town_rural_breakdown: "Of {applications} applications, {town} are from the 11 towns reported as blocks and {rural} from rural blocks."
    report_heading: "Homestay Mission {level}-wise summary (applications to {as_of}):"
    comparison: "{entity_a} {value_a} against {entity_b} {value_b}."
    village_summary: "Applications per village in {scope} (individual applicants are not listed):"
    count_instead_of_list: "Individual applicants are not listed. By {level}: {list}."

    # ---- refusals - a first-class section --------------------------------
    money_not_held:
      critical: true
      text: "The Homestay application data records no money - no project cost, loan, subsidy, grant or EMI amount."
      offer: "Under the scheme rules, a new homestay can get up to 70% subsidy (80% for persons with disabilities), capped at ₹7 lakh (₹8 lakh); an upgradation up to ₹50,000 a room, at most ₹2 lakh. From the data I can give {scope_suffix}applications ({applications}) and approvals ({approved})."
      never: "Do not multiply approvals or applications by a scheme rate. Do not quote Homestay Legacy loan amounts as Mission spending."

    project_dates_not_held:
      critical: true
      text: "Proposed project start and end dates are empty for every application, so timelines and durations cannot be shown."
      offer: "I can show applications by the month they were submitted."
      never: "Do not use the application date as a project start date."

    construction_not_held:
      critical: true
      text: "This data records applications and their approval, not whether a homestay has been built, is under construction or is operating."
      offer: "{approved} applications are approved{scope_suffix}."
      never: "Do not call approved applications 'operational', 'built' or 'completed'."

    sanction_not_held:
      text: "{approved} applications are marked Approved; the data does not say whether a bank loan has been sanctioned or released."
      offer: "I can give the approved count by district."

    caste_not_held:
      text: "Caste, tribe and income are not recorded in the Homestay application data."
      offer: "I can break applications down by applicant category or gender instead."

    pwd_rate_not_held:
      text: "{count} applicants applied in the Differently Abled category; no disability certificate or subsidy rate is recorded."
      offer: "Under the scheme rules, persons with disabilities can get up to 80% subsidy - that is a rule, not a recorded payment."

    boutique_none:
      text: "No boutique homestay (Component 3) application is recorded in this data."
      offer: "Under the scheme rules, boutique homestays need at least 10 rooms and ₹80 lakh investment, with up to ₹15 lakh in incentives."

    beds_not_held:
      text: "Beds are not recorded - only guest rooms."
      offer: "{rooms} guest rooms are proposed in new-homestay applications."

    training_design_footfall_not_held:
      text: "Training completion, the standard design chosen and guest bed-nights are not recorded in this data."
      offer: "I can answer on applications, status and proposed facilities."

    reason_not_held:
      text: "The data records the status but not the reason for a rejection or a send-back."
      offer: "{count} applications{scope_suffix} have that status."

    year_not_loaded:
      critical: true
      text: "Homestay applications are held for 2025-26 (from October 2025) and 2026-27 (to 19 October 2026) only, so there is no data for {value}."
      offer: "Shall I give the figures for the years that are held?"
      never: "Do not answer 0 for a year that is not loaded."

    applicant_not_listable:
      critical: true
      text: "Individual applicants cannot be listed - names, phone numbers and ids are personal data."
      offer: "I can show the count by {next_level}{scope_suffix} instead."
      never: "Do not render a name, member id, EPIC, family id, phone number, request number, address or any row-level list of applicants."

    applicant_lookup_refused:
      critical: true
      text: "An individual application cannot be looked up here."
      offer: "For your own application, the Meghalaya One portal, the citizen service line 1971 or the MIPA helpline +91 7085741695 can help."
      never: "Do not echo the id back, and do not say whether it exists in the data."

    identifier_values_refused:
      critical: true
      text: "EPIC numbers, family ids and member ids are personal data and cannot be shown."
      offer: "{repeat_people} people appear on more than one application ({extra} extra applications)."
      never: "Do not render a duplicated identifier value."

    establishment_name_withheld:
      text: "The names of the 24 existing homestays applying for upgradation are held but not shown until the department confirms they may be."
      offer: "I can give them by district."

    cross_scheme_person_match_refused:
      critical: true
      text: "Matching the same person across schemes is not permitted."
      offer: "I can give each scheme's count by district, side by side."
      never: "Do not report an overlap count or a list of shared people."

    homestay_legacy_redirect:
      text: "That question is about loans already disbursed under the earlier homestay scheme, which is a separate dataset from the Mission's applications."
      offer: "Shall I answer it from the Homestay loan data instead?"

    report_partial:
      text: "Money, construction status and project dates are not recorded, so this report carries every field that is: applications, approved, pending, unknown, rejected, verification status, category, gender, land and rooms."

    # ---- situations that need specific wording ---------------------------
    empty_result: "No Homestay applications for {scope} in {period}."
    none_approved_yet: "None of the {applications} applications from {scope} in {period} is approved yet."
    unavailable_in_source: "{requested} is not held in the Homestay application data."
    entity_not_found: "'{value}' is not in the Homestay data. Closest matches: {suggestions}."
    ambiguous_entity_resolved: "Read '{value}' as {resolved} in {district}. There are {count} places with that name."
    town_resolved: "Read '{value}' as {town}, which the department reports as a block."
    cluster_resolved: "Read '{value}' as the {cluster} tourism cluster, where the homestays are proposed."
    colliding_name_resolved: "Read '{value}' as the {level}. It is also the name of a {other_levels} - say which if you meant that."
    permission_denied: "That level of detail is above your access. The finest level available to you is {allowed_level}."
    execution_failed: "The query could not be completed. Please try a smaller area."
    data_service_unavailable: "The data service is not responding right now - this is not a problem with your question. Please try again shortly."

    # ---- lines that travel alongside the answer --------------------------
    assumption_prefix: "Assumed: {assumptions}."
    application_not_benefit_note: "These are applications; {approved} are approved so far. An application is not yet a subsidy received."
    approved_meaning_note: "'Approved' is the application's file status; the data does not record a bank sanction or disbursement."
    no_money_note: "No money figures are recorded in this data."
    scheme_rule_label: "Under the scheme rules (not from the data): {rule}."
    status_column_note: "Status here is the {status_kind}; {other_kind} is a separate field."
    forward_note: "Forward is the file's latest movement and includes Pending, Unknown and 2 Rejected files."
    unknown_status_note: "'Unknown' is the status recorded for {count} applications; the data does not explain it."
    on_hold_note: "On Hold is a data-verification result."
    not_verified_note: "{count} applications are not yet verified."
    partial_years_note: "Both years are part years: 2025-26 from 7 October 2025 and 2026-27 to 19 October 2026."
    approvals_one_year_note: "All approvals so far are on 2025-26 applications; no 2026-27 application is approved yet."
    home_address_note: "Places are where the applicants live."
    site_address_note: "Places are where the homestays are proposed, as the applicants entered them."
    home_vs_site_note: "By where applicants live it is {home}; by where the homestay is proposed it is {site}."
    cluster_not_block_note: "A tourism cluster is not an administrative block."
    towns_as_blocks_note: "Municipal boards and town committees are counted as blocks, as the department reports them."
    new_build_base_note: "Out of the 1,274 new-homestay applications; this was not asked of the 24 upgradation applications."
    rooms_outlier_note: "One application recording 3,500 rooms is treated as a data-entry error and left out."
    proposed_not_built_note: "These are proposed in the applications, not verified on site."
    unresolved_village_note: "{unresolved} applications have no village recorded and are left out of village figures; they are included in block and district totals."
    constituency_total_note: "64 applications have no constituency recorded, so constituency figures add up to 1,234, not 1,298."
    village_identity_note: "Villages are counted by LGD code, since 9 village names are shared by more than one village."
    remapped_district_note: "Districts follow the LGD mapping, which places 14 applicants in a different district from the one they typed."
    self_declared_category_note: "Categories are as declared by the applicant; 41 'Youth' applicants were over 35 and 4 men applied in the Women category."
    gender_vs_category_note: "{female} applicants are female; {women_category} applied in the Women category - they are different fields."
    repeat_applicants_note: "{applications} applications were made by {people} different people."
    region_expansion_note: "{region} covers {districts}."
    ri_bhoi_region_note: "Ri Bhoi is shown separately; it is not counted under Khasi Hills."
    as_of_note: "Figures cover applications to {as_of} (extract of 1 November 2026)."
    cross_scheme_caveat: "Homestay counts applications; {other_scheme} counts {other_measure}. The two are shown side by side, not added."
    large_result: "Showing the first {shown} of {total} rows."

  # =======================================================================
  follow_up_rules:

    # ---- move up or down the hierarchy ----------------------------------
    - condition: "result_is_statewide"
      suggestion: "Split this by district?"

    - condition: "result_by_district"
      suggestion: "Break this down by block?"

    - condition: "result_by_block"
      suggestion: "See the number of applications per village in this block?"

    - condition: "result_is_single_district"
      suggestion: "See how this compares with the other districts?"

    - condition: "result_is_region"
      suggestion: "See the districts inside that region separately?"

    - condition: "result_is_constituency"
      suggestion: "See the block of the same name, which covers a different area?"

    # ---- move across measures -------------------------------------------
    - condition: "result_is_application_count"
      suggestion: "See how many of them are approved?"

    - condition: "result_is_approved_count"
      suggestion: "See the approval rate by district?"

    - condition: "result_is_status_breakdown"
      suggestion: "See the data-verification status as well?"

    - condition: "result_is_verification_breakdown"
      suggestion: "See which districts have the most Invalid applications?"

    - condition: "result_is_category_breakdown"
      suggestion: "See the same split by gender?"

    - condition: "result_is_gender_breakdown"
      suggestion: "See the Women applicant category, which is a separate field?"

    - condition: "result_is_rooms"
      suggestion: "See rooms by district, or the existing rooms in upgradation applications?"

    - condition: "result_is_facility_share"
      suggestion: "See the same share by district?"

    - condition: "result_is_land_breakdown"
      suggestion: "See leases that need review?"

    # ---- geography types ----------------------------------------------------
    - condition: "result_is_home_geography"
      suggestion: "See where these homestays are proposed to be located instead?"

    - condition: "result_is_site_geography"
      suggestion: "See where the applicants live instead?"

    - condition: "result_is_block_list"
      suggestion: "Show rural blocks and towns separately?"

    - condition: "result_resolved_town_by_default"
      suggestion: "See the constituency of the same name instead?"

    # ---- time ---------------------------------------------------------------
    - condition: "result_is_year_series"
      suggestion: "See applications month by month?"

    - condition: "result_refused_other_year"
      suggestion: "See 2025-26 and 2026-27 instead?"

    # ---- components -----------------------------------------------------------
    - condition: "result_is_component_breakdown"
      suggestion: "See the 24 upgradation applications by district?"

    # ---- work with the list just returned --------------------------------
    - condition: "result_is_ranked_list"
      suggestion: "Would you like to see the lowest as well?"

    - condition: "result_has_tie"
      suggestion: "Break the tie on approvals?"

    - condition: "result_row_count_exceeds_display"
      suggestion: "Export the full list?"

    # ---- recover from a thin, refused or failed answer --------------------
    - condition: "result_is_empty"
      suggestion: "Try the block or district this place sits in?"

    - condition: "entity_not_found"
      suggestion: "List the blocks in that district instead?"

    - condition: "entity_resolved_by_assumption"
      suggestion: "Did you mean another place of that name?"

    - condition: "result_refused_money"
      suggestion: "See approved applications by district instead?"

    - condition: "result_refused_applicant_list"
      suggestion: "See the count by district or block instead?"

    - condition: "result_is_cross_scheme"
      suggestion: "See each scheme's figure by district instead?"

  # =======================================================================
  composer_checks:
    critical: true
    note: >
      Assertions the composer runs against its own draft before sending. Each one catches a
      failure this feed is specifically prone to. Every caveat in the header list has at
      least one check.
    checks:
    - "Every count says what it counts - applications, approved applications, people or rooms. If 'beneficiaries' or 'applicants' appears, the approved count appears beside it."            # caveat 1
    - "The words 'sanctioned', 'disbursed', 'built', 'operational' and 'completed' do not describe approved applications."                                                               # caveat 1
    - "No rupee figure appears except a scheme rate, and every scheme rate is labelled 'under the scheme rules'. No rate is multiplied by a count."                                    # caveat 2
    - "If a status figure appears, the draft names which field it comes from; Pending and Forward are not used as synonyms; Unknown is never called rejected."                         # caveat 3
    - "If the source typo 'Updragation' would appear, it is rendered as 'upgradation of an existing homestay'."                                                                       # caveat 3 / display
    - "If both years appear, or a comparison or trend is described, the draft says both are part years. An approval figure for 2026-27 says none is approved yet."                   # caveat 4
    - "Only 2025-26 and 2026-27 appear as years. Another year is 'not held', never 0."                                                                                                 # caveat 4
    - "Places are phrased as where applicants are from, unless the question asked where homestays are proposed; then the draft says so. A cluster is never called a block."          # caveat 5
    - "A rooms, solar, rainwater or waste figure says it is out of new-homestay applications; a rooms total excludes the 3,500-room entry and says so."                               # caveat 6
    - "If a village or constituency figure was given, the draft says the 64 unmapped applications are excluded."                                                                       # caveat 7
    - "If a category figure is used for a finding (youth, women), the draft says categories are self-declared; female and Women category are not used interchangeably."              # caveat 8
    - "No name, member id, EPIC, family id, phone number, request number, address or applicant-level row appears in the draft."                                                       # identity
    - "If a district or block name appears, it is title-cased, and a town uses its canonical name, not the source's doubled suffix."
    - "If the answer refused something, it offered the nearest real question and named it as a different question."
    - "The phrase 'excluding placeholder records' does not appear - that is PMAY's rule."
    - "If Homestay Legacy figures appear, they are labelled as loans under the earlier scheme and are not added to Mission applications."
    - "If Khasi Hills was reported, the draft says whether Ri Bhoi was included."

  # =======================================================================
  maintenance:
    companion_files:
    - Annotations/Homestay/homestay_schema_partitions.yaml
    - Annotations/Homestay/homestay_classification_rules.yaml
    - Annotations/Homestay/homestay_default_rules.yaml
    - Annotations/Homestay/homestay_entity_resolver.yaml
    - Annotations/Homestay/homestay_few_shot.yaml
    - Annotations/Homestay/homestay_foreign_key_augmentation.yaml
    - Annotations/Homestay/README.md
    - Annotations/PMAY/pmay_response_template.yaml   # the file format this one follows
    regeneration_rules:
    - "Every assumption_text in homestay_default_rules.yaml should have a template here that can state it back."
    - "Every caveat in the eight-caveat list at the top of this file must have both a template and a composer_check."
    - "When the view is loaded, replace the placeholder figures and confirm the stored spellings of status values and towns."
    - "When a 2026-27 application is approved, retire approvals_one_year_note and its check."
    - "If money, project dates or construction status arrive in the feed, retire the matching refusals and add measure templates."
    - "When HS-02 (Unknown) and HS-03 (levels) are answered, replace unknown_status_note and current_level_display with the department's meaning."
    - APPEND templates. Never delete one silently.

# ===========================================================================
# RENDERED EXAMPLES - finished answers, filled with figures produced by executing
# the few-shot SQL against the emulation of curated.v_homestay_api built from
# datasets/Homestay/Home Stay API - 2026-11-01.csv. Use these to test the composer
# and as the reference for tone.
# ===========================================================================
rendered_examples:

- question: "How many Home Stay beneficiaries are there in total?"
  templates: [beneficiary_count, application_not_benefit_note, partial_years_note]
  answer: >
    1,298 Homestay Mission applications have been received - 505 in 2025-26 (from
    7 October 2025) and 793 in 2026-27 (to 19 October 2026). They were made by 1,279
    different people. 80 applications are approved so far; an application is not yet a
    subsidy received.
  follow_up: "See how many of them are approved, by district?"

- question: "How much subsidy has been given under the Homestay scheme?"
  templates: [money_not_held]
  answer: >
    The Homestay application data records no money - no project cost, loan, subsidy, grant
    or EMI amount. Under the scheme rules, a new homestay can get up to 70% subsidy (80% for
    persons with disabilities), capped at ₹7 lakh (₹8 lakh); an upgradation up to ₹50,000 a
    room, at most ₹2 lakh. From the data I can give applications (1,298) and approvals (80).
  follow_up: "See approved applications by district instead?"

- question: "Give me the overall application status breakdown"
  templates: [status_breakdown, unknown_status_note, status_column_note]
  answer: >
    Applications by file status: 1,082 Pending, 134 Unknown, 80 Approved, 2 Rejected.
    'Unknown' is the status recorded for 134 applications; the data does not explain it.
    Data verification is a separate field.
  follow_up: "See the data-verification status as well?"

- question: "How many Home Stay applications are currently in Forward status?"
  templates: [single_value, forward_note]
  answer: >
    1,214 applications have Forward as their latest file movement. Forward includes Pending,
    Unknown and 2 Rejected files, so it is not the same as the 1,082 Pending.
  follow_up: "Give me the district-wise number in Forward status?"

- question: "What percentage of Home Stay applications have been approved?"
  templates: [approval_rate, approvals_one_year_note]
  answer: >
    6.2% of Homestay applications are approved - 80 of 1,298. All approvals so far are on
    2025-26 applications (15.8% of that year's 505); no 2026-27 application is approved yet.
  follow_up: "See the approval rate by district?"

- question: "Give me the overall data verification status"
  templates: [verification_breakdown, on_hold_note]
  answer: >
    By data verification: 1,145 Valid, 93 Invalid, 23 On Hold, 5 Wrong, and 32 not yet
    verified (all from 2026-27).
  follow_up: "See which districts have the most Invalid applications?"

- question: "Which district has received the highest number of Home Stay applications?"
  templates: [ranked_list, home_address_note]
  answer: >
    East Khasi Hills - 342 applications, 23 of them approved - followed by West Garo Hills
    (209) and West Khasi Hills (125). Places are where the applicants live.
  follow_up: "See where these homestays are proposed to be located instead?"

- question: "How many homestays are proposed in Ri Bhoi?"
  templates: [home_vs_site_note, site_address_note]
  answer: >
    148 applications propose a homestay in Ri Bhoi, as the applicants entered it. By where
    the applicants live, Ri Bhoi has 103 applications - the site and home district differ
    for 113 new-homestay applications statewide.
  note: Only after the gate's home_vs_site_location_unclear was answered.

- question: "Give me the male and female applicant distribution"
  templates: [gender_breakdown, gender_vs_category_note]
  answer: >
    Applications by applicant gender: 681 female, 617 male. Separately, 479 applications
    were made under the Women applicant category - a different field.
  follow_up: "See the same split by district?"

- question: "What is the total number of Home Stay rooms proposed?"
  templates: [rooms_total, new_build_base_note, rooms_outlier_note, proposed_not_built_note]
  answer: >
    5,113 guest rooms are proposed across 1,273 new-homestay applications - about 4 rooms on
    average. One application recording 3,500 rooms is treated as a data-entry error and left
    out. These are proposed in the applications, not verified on site; the 24 upgradation
    applications hold a further 122 existing rooms.
  follow_up: "See rooms by district?"

- question: "How many Home Stay applications have both solar energy and rainwater harvesting?"
  templates: [facility_share, new_build_base_note]
  answer: >
    843 of 1,274 new-homestay applications (66.2%) propose both solar energy and rainwater
    harvesting. 976 propose solar and 937 rainwater harvesting. This was not asked of the 24
    upgradation applications.
  follow_up: "See the same share by district?"

- question: "Give me the number of Home Stay projects based on proposed start and end dates"
  templates: [project_dates_not_held]
  answer: >
    Proposed project start and end dates are empty for every application, so timelines and
    durations cannot be shown. I can show applications by the month they were submitted -
    the busiest month was November 2025, with 166.

- question: "How many homestays are operational?"
  templates: [construction_not_held]
  answer: >
    This data records applications and their approval, not whether a homestay has been
    built, is under construction or is operating. 80 applications are approved.

- question: "Identify Home Stay applications where the land lease period needs review"
  templates: [count_instead_of_list]
  answer: >
    Individual applicants are not listed. 10 applications on leased land need review: 4
    leases are shorter than the scheme's 7-year minimum, 3 have no lease period recorded, 2
    have a malformed start year and 1 has years that do not add up.
  follow_up: "See them by district?"

- question: "Identify duplicate EPIC IDs, Family IDs, or Member IDs"
  templates: [identifier_values_refused, repeat_applicants_note]
  answer: >
    EPIC numbers, family ids and member ids are personal data and cannot be shown. 17 people
    appear on more than one application, accounting for 19 extra applications - 1,298
    applications were made by 1,279 different people. All 19 extra applications have status
    Unknown.

- question: "How many applications came through CSC?"
  templates: [mode_breakdown]
  answer: >
    63 applications were made through a CM Connect Centre, the state's assisted channel;
    the other 1,235 were made online.

- question: "How many applicants are from the Khasi Hills?"
  templates: [region_expansion_note, ri_bhoi_region_note]
  answer: >
    Khasi Hills covers East, West, South West and Eastern West Khasi Hills: 601
    applications. Ri Bhoi (103) is shown separately; it is not counted under Khasi Hills.
  note: Only after the gate's region_ri_bhoi_unconfirmed was answered 'exclude Ri Bhoi'.

- question: "Compare Home Stay applications across financial years"
  templates: [year_series, partial_years_note, approvals_one_year_note]
  answer: >
    Applications by financial year: 2025-26 505, 2026-27 793. Both years are part years:
    2025-26 from 7 October 2025 and 2026-27 to 19 October 2026. All 80 approvals so far are
    on 2025-26 applications.
  follow_up: "See applications month by month?"
