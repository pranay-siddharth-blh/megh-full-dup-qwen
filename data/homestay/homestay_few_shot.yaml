- question: Identify Home Stay properties with more than 10 rooms.
  sql: |
    SELECT homestay_rooms AS rooms, COUNT(*) AS applications
    FROM curated.v_homestay_api
    WHERE homestay_rooms > 10
      AND NOT COALESCE(homestay_rooms > 100, FALSE)
    GROUP BY rooms
    ORDER BY rooms;
  tables:
  - curated.v_homestay_api
  note: Use case 36. Counts by room size - no applicant list. The 3,500 entry is reported separately.
  expected: [{rooms: 12, applications: 14}, {rooms: 14, applications: 4}, {rooms: 15, applications: 6}, {rooms: 20, applications: 8}, {rooms: 24, applications: 1}, {rooms: 25, applications: 1}]

- question: Give me the total proposed Home Stay room capacity district-wise.
  sql: |
    SELECT district_lgd_code, lgd_district,
           SUM(homestay_rooms) FILTER (WHERE NOT COALESCE(homestay_rooms > 100, FALSE)) AS proposed_rooms,
           COUNT(*)                                            AS new_build_applications
    FROM curated.v_homestay_api
    WHERE NOT is_upgradation
    GROUP BY district_lgd_code, lgd_district
    ORDER BY proposed_rooms DESC;
  tables:
  - curated.v_homestay_api
  note: Use case 37.
  expected: [{district_lgd_code: 274, lgd_district: "EAST KHASI HILLS", proposed_rooms: 1325, new_build_applications: 334}, {district_lgd_code: 278, lgd_district: "WEST GARO HILLS", proposed_rooms: 609, new_build_applications: 207}, {district_lgd_code: 279, lgd_district: "WEST KHASI HILLS", proposed_rooms: 570, new_build_applications: 123}, {district_lgd_code: 276, lgd_district: "RI BHOI", proposed_rooms: 489, new_build_applications: 101}, {district_lgd_code: 275, lgd_district: "WEST JAINTIA HILLS", proposed_rooms: 463, new_build_applications: 88}, {district_lgd_code: 277, lgd_district: "SOUTH GARO HILLS", proposed_rooms: 373, new_build_applications: 96}, {district_lgd_code: 740, lgd_district: "EASTERN WEST KHASI HILLS", proposed_rooms: 356, new_build_applications: 61}, {district_lgd_code: 658, lgd_district: "SOUTH WEST KHASI HILLS", proposed_rooms: 284, new_build_applications: 69}, {district_lgd_code: 657, lgd_district: "EAST JAINTIA HILLS", proposed_rooms: 262, new_build_applications: 62}, {district_lgd_code: 656, lgd_district: "NORTH GARO HILLS", proposed_rooms: 200, new_build_applications: 79}, {district_lgd_code: 273, lgd_district: "EAST GARO HILLS", proposed_rooms: 132, new_build_applications: 39}, {district_lgd_code: 663, lgd_district: "SOUTH WEST GARO HILLS", proposed_rooms: 50, new_build_applications: 15}]

- question: How many existing rooms are in the homestays applying for upgradation?
  sql: |
    SELECT (room_details -> 0 ->> 'type_of_room_available') AS upgradation_room_type,
           COUNT(*)               AS upgradation_applications,
           SUM(COALESCE(NULLIF(room_details -> 0 ->> 'total_number_single_room', '')::int, 0) + COALESCE(NULLIF(room_details -> 0 ->> 'total_number_double_bed_room', '')::int, 0)) AS existing_rooms
    FROM curated.v_homestay_api
    WHERE is_upgradation
    GROUP BY upgradation_room_type
    ORDER BY existing_rooms DESC;
  tables:
  - curated.v_homestay_api
  expected: [{upgradation_room_type: "Single", upgradation_applications: 6, existing_rooms: 46}, {upgradation_room_type: "Double", upgradation_applications: 11, existing_rooms: 42}, {upgradation_room_type: "Both", upgradation_applications: 7, existing_rooms: 34}]

