- question: Which districts have the highest adoption of solar energy and rainwater harvesting?
  sql: |
    SELECT district_lgd_code, lgd_district,
           COUNT(*) AS new_build_applications,
           ROUND(100.0 * COUNT(*) FILTER (WHERE solar_energy) / COUNT(*), 1)         AS solar_pct,
           ROUND(100.0 * COUNT(*) FILTER (WHERE rainwater_harvesting) / COUNT(*), 1) AS rainwater_pct
    FROM curated.v_homestay_api
    WHERE NOT is_upgradation
    GROUP BY district_lgd_code, lgd_district
    ORDER BY solar_pct DESC;
  tables:
  - curated.v_homestay_api
  note: Use case 41. Shares within each district's new-build applications.
  expected: [{district_lgd_code: 663, lgd_district: "SOUTH WEST GARO HILLS", new_build_applications: 15, solar_pct: 100, rainwater_pct: 93.3}, {district_lgd_code: 656, lgd_district: "NORTH GARO HILLS", new_build_applications: 79, solar_pct: 98.7, rainwater_pct: 98.7}, {district_lgd_code: 740, lgd_district: "EASTERN WEST KHASI HILLS", new_build_applications: 61, solar_pct: 90.2, rainwater_pct: 80.3}, {district_lgd_code: 273, lgd_district: "EAST GARO HILLS", new_build_applications: 39, solar_pct: 84.6, rainwater_pct: 79.5}, {district_lgd_code: 657, lgd_district: "EAST JAINTIA HILLS", new_build_applications: 62, solar_pct: 75.8, rainwater_pct: 82.3}, {district_lgd_code: 658, lgd_district: "SOUTH WEST KHASI HILLS", new_build_applications: 69, solar_pct: 75.4, rainwater_pct: 75.4}, {district_lgd_code: 276, lgd_district: "RI BHOI", new_build_applications: 101, solar_pct: 75.2, rainwater_pct: 59.4}, {district_lgd_code: 278, lgd_district: "WEST GARO HILLS", new_build_applications: 207, solar_pct: 74.9, rainwater_pct: 79.7}, {district_lgd_code: 279, lgd_district: "WEST KHASI HILLS", new_build_applications: 123, solar_pct: 74, rainwater_pct: 67.5}, {district_lgd_code: 274, lgd_district: "EAST KHASI HILLS", new_build_applications: 334, solar_pct: 72.8, rainwater_pct: 70.7}, {district_lgd_code: 275, lgd_district: "WEST JAINTIA HILLS", new_build_applications: 88, solar_pct: 72.7, rainwater_pct: 67}, {district_lgd_code: 277, lgd_district: "SOUTH GARO HILLS", new_build_applications: 96, solar_pct: 69.8, rainwater_pct: 61.5}]

