# homestay_few_shot.yaml
#
# Validated question-to-SQL pairs for Homestay - node 5.10.
#
# ===========================================================================
# v1.0 - 2026-11-06 - FIRST VERSION, WRITTEN AHEAD OF THE DATABASE LOAD
#
# Every example runs against curated.v_homestay_api (PLACEHOLDER, 52 columns, one row
# per application, new-build or upgradation, any status).
#
# House rules encoded in every example below:
#   FROM curated.v_homestay_api                 never the fact, never v_homestay_legacy
#   COUNT(*)                                is an APPLICATION count - any status, both components
#   COUNT(*) FILTER (WHERE (file_status = 'Approved'))     approved applications (80) - never 'sanctioned'
#   COUNT(DISTINCT member_key)              the ONLY permitted use of member_key (people)
#   file_status                             the default 'status'; 'Pending' lives here
#   current_file_status                     'Forward' / 'Sendback' / 'Resubmit'
#   data_verified                           'Valid' / 'Invalid' / 'On Hold' / 'Wrong'; NULL = not yet verified
#   is_upgradation                          components - never the misspelled stored text
#   NOT is_upgradation                      the base for rooms, solar, rainwater, waste
#   NOT COALESCE(homestay_rooms > 100, FALSE)               inside every room SUM / AVG / MAX
#   district_lgd_code / block_lgd_code /    CODES for home geography - never a name literal
#   ac_number / village_code
#   lower(proposed_cluster) = '<stored>'    site questions only
#   GROUP BY <code>, <name>                 never the display name alone
#   entity_type <> 'Unresolved'             on village and constituency questions ONLY
#   no money column                         money questions are refused in the gate
#
# Questions Homestay must refuse (money, project dates, construction / operational
# status, caste, applicant lists, identifier values, other years) have no SQL and
# are NOT in this file - they are in homestay_schema_partitions.yaml
# few_shot_examples with sql: null, and the gate catches them first.
#
# NOT ONE OF THESE QUERIES HAS BEEN EXECUTED against megh_db - the view does not
# exist yet. Every `expected` value was produced by executing the SQL against a
# SQLite emulation of the planned v_homestay built from
# datasets/Homestay/Home Stay API - 2026-11-01.csv. Counts and codes are exact;
# display names inside an expected value are the source's mapped spellings
# upper-cased. Results longer than 15 rows are shown as a row count + first 10.
# The 'Use case n' notes refer to the 'Homestay API' sheet of HomeStay_Use_Cases.xlsx.
# ===========================================================================

sql_generation_examples:

# ---- applications ----------------------------------------------------------
- question: How many Home Stay applications have been received in total?
  sql: |
    SELECT COUNT(*)                            AS applications,
           COUNT(*) FILTER (WHERE (file_status = 'Approved')) AS approved
    FROM curated.v_homestay_api;
  tables:
  - curated.v_homestay_api
  note: The approved count travels with the total.
  expected: {applications: 1298, approved: 80}

- question: How many Home Stay applications have been received in 2025-26?
  sql: |
    SELECT COUNT(*) AS applications
    FROM curated.v_homestay_api
    WHERE financial_year_short = '2025-26';
  tables:
  - curated.v_homestay_api
  note: Use case 1. 2025-26 starts in October 2025, when the scheme opened.
  expected: 505

- question: How many Home Stay applications have been received in 2026-27?
  sql: |
    SELECT COUNT(*) AS applications
    FROM curated.v_homestay_api
    WHERE financial_year_short = '2026-27';
  tables:
  - curated.v_homestay_api
  note: Use case 1. Partial year, to 19 Oct 2026.
  expected: 793

- question: Give me the number of Home Stay applications in each financial year.
  sql: |
    SELECT financial_year_short,
           MIN(application_date) AS first_application,
           MAX(application_date) AS last_application,
           COUNT(*)              AS applications
    FROM curated.v_homestay_api
    GROUP BY financial_year_short
    ORDER BY financial_year_short;
  tables:
  - curated.v_homestay_api
  note: The date range shows that both years are partial.
  expected: [{financial_year_short: "2025-26", first_application: "2025-10-07", last_application: "2026-03-31", applications: 505}, {financial_year_short: "2026-27", first_application: "2026-04-01", last_application: "2026-10-19", applications: 793}]

- question: How many unique people have applied for the Homestay scheme?
  sql: |
    SELECT COUNT(DISTINCT member_key) AS distinct_applicants,
           COUNT(*)                   AS applications
    FROM curated.v_homestay_api;
  tables:
  - curated.v_homestay_api
  expected: {distinct_applicants: 1279, applications: 1298}

- question: Give me the month-wise number of Home Stay applications.
  sql: |
    SELECT date_trunc('month', application_date) AS month,
           COUNT(*)                              AS applications
    FROM curated.v_homestay_api
    GROUP BY date_trunc('month', application_date)
    ORDER BY month;
  tables:
  - curated.v_homestay_api
  expected: [{month: "2025-10", applications: 44}, {month: "2025-11", applications: 166}, {month: "2025-12", applications: 72}, {month: "2026-01", applications: 43}, {month: "2026-02", applications: 70}, {month: "2026-03", applications: 110}, {month: "2026-04", applications: 134}, {month: "2026-05", applications: 104}, {month: "2026-06", applications: 108}, {month: "2026-07", applications: 95}, {month: "2026-08", applications: 140}, {month: "2026-09", applications: 147}, {month: "2026-10", applications: 65}]

- question: How many Home Stay applications were received in November 2025?
  sql: |
    SELECT COUNT(*) AS applications
    FROM curated.v_homestay_api
    WHERE application_date >= DATE '2025-11-01'
      AND application_date <  DATE '2025-12-01';
  tables:
  - curated.v_homestay_api
  expected: 166

