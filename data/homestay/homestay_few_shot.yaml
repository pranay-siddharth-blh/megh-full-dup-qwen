- question: Give me a financial-year-wise summary of applications and their current status.
  sql: |
    SELECT financial_year_short,
           COUNT(*)                                        AS applications,
           COUNT(*) FILTER (WHERE (file_status = 'Approved'))             AS approved,
           COUNT(*) FILTER (WHERE file_status = 'Pending') AS pending,
           COUNT(*) FILTER (WHERE file_status = 'Unknown') AS unknown,
           COUNT(*) FILTER (WHERE file_status = 'Rejected') AS rejected
    FROM curated.v_homestay_api
    GROUP BY financial_year_short
    ORDER BY financial_year_short;
  tables:
  - curated.v_homestay_api
  expected: [{financial_year_short: "2025-26", applications: 505, approved: 80, pending: 377, unknown: 48, rejected: 0}, {financial_year_short: "2026-27", applications: 793, approved: 0, pending: 705, unknown: 86, rejected: 2}]

- question: Give me a category-wise approval summary.
  sql: |
    SELECT applicant_category,
           COUNT(*)                                                     AS applications,
           COUNT(*) FILTER (WHERE (file_status = 'Approved'))                          AS approved,
           ROUND(100.0 * COUNT(*) FILTER (WHERE (file_status = 'Approved')) / COUNT(*), 1) AS approval_rate_pct
    FROM curated.v_homestay_api
    GROUP BY applicant_category
    ORDER BY applications DESC;
  tables:
  - curated.v_homestay_api
  expected: [{applicant_category: "Youth (18-35 yrs)", applications: 491, approved: 25, approval_rate_pct: 5.1}, {applicant_category: "Women", applications: 479, approved: 36, approval_rate_pct: 7.5}, {applicant_category: "First Generation Entrepreneur", applications: 214, approved: 12, approval_rate_pct: 5.6}, {applicant_category: "Other", applications: 107, approved: 5, approval_rate_pct: 4.7}, {applicant_category: "Differently Abled", applications: 7, approved: 2, approval_rate_pct: 28.6}]
