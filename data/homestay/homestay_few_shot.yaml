# ---- duplicates and data quality --------------------------------------------------
- question: Are there any duplicate Home Stay applications in the dataset?
  sql: |
    SELECT COUNT(*)                                                  AS applications,
           COUNT(DISTINCT member_key)                                AS distinct_applicants,
           COUNT(*) - COUNT(DISTINCT member_key)                     AS extra_applications,
           COUNT(DISTINCT member_key) FILTER (WHERE is_repeat_member) AS repeat_applicants
    FROM curated.v_homestay_api;
  tables:
  - curated.v_homestay_api
  note: Use case 45 (member id part). EPIC and family ids are not in the view - counts only.
  expected: {applications: 1298, distinct_applicants: 1279, extra_applications: 19, repeat_applicants: 17}

- question: What status do the repeat applications have?
  sql: |
    SELECT file_status, COUNT(*) AS applications
    FROM curated.v_homestay_api
    WHERE is_repeat_member
    GROUP BY file_status
    ORDER BY applications DESC;
  tables:
  - curated.v_homestay_api
  expected: [{file_status: "Unknown", applications: 19}, {file_status: "Pending", applications: 16}, {file_status: "Approved", applications: 1}]

- question: Which applicant categories have applicants outside the declared age range?
  sql: |
    SELECT applicant_category, COUNT(*) AS applications
    FROM curated.v_homestay_api
    WHERE (applicant_category = 'Youth (18-35 yrs)' AND applicant_age_years > 35)
       OR applicant_age_years < 18
    GROUP BY applicant_category;
  tables:
  - curated.v_homestay_api
  expected: [{applicant_category: "Women", applications: 1}, {applicant_category: "Youth (18-35 yrs)", applications: 41}]

# ---- summaries -----------------------------------------------------------------
- question: Give me a district-wise summary of total applications, approved, pending and invalid.
  sql: |
    SELECT district_lgd_code, lgd_district,
           COUNT(*)                                          AS applications,
           COUNT(*) FILTER (WHERE (file_status = 'Approved'))               AS approved,
           COUNT(*) FILTER (WHERE file_status = 'Pending')   AS pending,
           COUNT(*) FILTER (WHERE file_status = 'Unknown')   AS unknown,
           COUNT(*) FILTER (WHERE data_verified = 'Invalid') AS invalid
