# ---- components ----------------------------------------------------------------
- question: How many applications are for new homestays and how many for upgradation?
  sql: |
    SELECT CASE WHEN is_upgradation THEN 'Upgradation of existing homestay'
                ELSE 'Development of new homestay' END AS application_type,
           COUNT(*)                            AS applications,
           COUNT(*) FILTER (WHERE (file_status = 'Approved')) AS approved
    FROM curated.v_homestay_api
    GROUP BY 1
    ORDER BY applications DESC;
  tables:
  - curated.v_homestay_api
  note: The stored text 'Updragation' is never displayed or filtered.
  expected: [{application_type: "Development of new homestay", applications: 1274, approved: 80}, {application_type: "Upgradation of existing homestay", applications: 24, approved: 0}]

