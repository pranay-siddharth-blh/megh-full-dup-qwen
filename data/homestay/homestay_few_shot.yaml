- question: Identify Home Stay applications where the land lease period needs to be reviewed.
  sql: |
    SELECT CASE WHEN lease_years IS NULL                                THEN 'Leased, no lease years recorded'
                WHEN land_lease_year_start < 1990                            THEN 'Malformed lease start year'
                WHEN land_lease_year_end - land_lease_year_start <> lease_years  THEN 'Lease years do not add up'
                WHEN lease_years < 7                                    THEN 'Shorter than 7-year minimum'
           END AS review_reason,
           COUNT(*) AS applications
    FROM curated.v_homestay_api
    WHERE type_of_land_holding = 'Leased'
      AND (lease_years IS NULL OR lease_years < 7 OR land_lease_year_start < 1990
           OR land_lease_year_end - land_lease_year_start <> lease_years)
    GROUP BY 1
    ORDER BY applications DESC;
  tables:
  - curated.v_homestay_api
  note: Use case 33. Counts by reason - no applicant list.
  expected: [{review_reason: "Shorter than 7-year minimum", applications: 4}, {review_reason: "Leased, no lease years recorded", applications: 3}, {review_reason: "Malformed lease start year", applications: 2}, {review_reason: "Lease years do not add up", applications: 1}]

