  app/pipeline/common/c08_villages.py::_scheme_village_names: "_HOMESTAY_VILLAGE_NAMES = None\n\n\nasync def _homestay_village_names() -> \"dict[str, list[dict]]\":\n    \"\"\"UPPER(name) -> villages, for every village / ward in v_homestay_api (the applicants' HOME villages,\n    not the proposed homestay site). Loaded once per process. The Unresolved rows (64 applications, no\n    village) are left out.\"\"\"\n    global _HOMESTAY_VILLAGE_NAMES\n    if _HOMESTAY_VILLAGE_NAMES is None:\n        rows = await fetch_rows(\n            \"SELECT DISTINCT village_code, lgd_village_name, UPPER(lgd_block) AS block, \"\n            \"UPPER(lgd_district) AS district FROM curated.v_homestay_api \"\n            \"WHERE village_code IS NOT NULL AND entity_type <> 'Unresolved'\", [])\n        out: dict[str, list[dict]] = {}\n        for r in rows:\n            n = collapse_ws(str(r[\"lgd_village_name\"] or \"\"))\n            if n:\n                out.setdefault(n.upper(), []).append(\n               \
    \     {\"village_code\": r[\"village_code\"], \"name\": n, \"block\": r[\"block\"], \"district\": r[\"district\"]})\n        _HOMESTAY_VILLAGE_NAMES = out\n    return _HOMESTAY_VILLAGE_NAMES\n\n\nasync def _scheme_village_names(scheme: str) -> \"dict[str, list[dict]]\":\n    if scheme == \"CMSS\":\n        return await _cmss_village_names()\n    if scheme == \"Homestay\":\n        return await _homestay_village_names()\n    if scheme == \"CM Elevate\":\n        return await _cm_elevate_village_names()\n    if scheme == \"Focus Legacy\":\n        return await _focus_legacy_village_names()\n    if scheme == \"CM Elevate Legacy\":\n        return await _cm_legacy_village_names()\n    if scheme == \"PMAY-G\":\n        return await _pmay_village_names()\n    return await (_focusplus_village_names() if scheme == \"Focus Plus\" else _mgnrega_village_names())\n"
  app/pipeline/common/c13_compose_and_data_stages.py::_VILLAGE_CATALOGUES: '"Homestay": "_homestay_village_names"'
  app/cross_figures.py::_COUNT_NOTE: '"Homestay": "applications (a row is one application; no money is recorded)"'
  app/data_facts.py::_QUERIES: "\"homestay\": \"\"\"\n        SELECT COUNT(*) AS hs_rows,\n               COUNT(DISTINCT member_key) AS hs_applicants,\n               COUNT(*) FILTER (WHERE file_status = 'Approved') AS hs_approved,\n               COUNT(*) FILTER (WHERE is_upgradation) AS hs_upgradation,\n               COUNT(DISTINCT lgd_district) AS hs_districts,\n               COUNT(DISTINCT lgd_block) AS hs_blocks,\n               COUNT(DISTINCT village_code) FILTER (WHERE entity_type <> 'Unresolved') AS hs_villages,\n               COUNT(DISTINCT ac_name) AS hs_constituencies,\n               ARRAY_AGG(DISTINCT financial_year_short) FILTER (WHERE financial_year_short IS NOT NULL) AS hs_years\n        FROM curated.v_homestay_api\"\"\""
  app/edge.py::_OUT_OF_SCOPE_REPLY: '"I''m Megh One AI, the assistant for Meghalaya''s MGNREGA, PMAY-G, Focus Plus, CM Elevate, Focus Legacy (producer groups), CM Elevate Legacy (sanctions and disbursements), CMSS (Chief Minister''s Scholarship Scheme, a flat Rs 6,000 annual state scholarship for eligible students), and Homestay (the Chief Minister''s Meghalaya Homestay Mission applications). I can only answer questions about those schemes and their data in Meghalaya — not other topics, other states, or places outside Meghalaya."'
  app/edge.py::_RESPONSES: "\"Hello! I answer questions about Meghalaya's MGNREGA, PMAY-G, Focus Plus, \"\r\n        \"CM Elevate, Focus Legacy, CM Elevate Legacy, CMSS and Homestay data — person-days, expenditure, \"\r\n        \"houses sanctioned and completed, Focus Plus disbursements, CM Elevate applications \"\r\n        \"by scheme, Focus Legacy producer-group payments, CM Elevate Legacy subsidy and \"\r\n        \"loans disbursed, CMSS scholarship applications and payments, Homestay applications and approvals, district and block \"\r\n        \"breakdowns — and general questions about how the schemes work.\""
  app/edge.py::_SCHEME_STARTERS: "\"Homestay\": [\n        \"How many Homestay applications are there?\",\n        \"Homestay applications by district\",\n        \"How many Homestay applications were approved in 2025-26?\",\n        \"Which tourism cluster has the most proposed homestays?\",\n        \"Who is eligible for the Homestay scheme?\",\n    ]"
  app/guardrails.py::RESPONSES: '"I don''t share how the database is built — its tables, columns or internal names. What I can give you is the figures it holds: MGNREGA person-days, households and persons employed, job cards, wages and expenditure; PMAY-G houses sanctioned, completed and in progress, with the amounts sanctioned and released; Focus Plus payments, beneficiaries and amount disbursed; CM Elevate applications by scheme, status and district; Focus Legacy producer-group payments; CM Elevate Legacy sanctions and disbursements; CMSS applications and students paid, with the amount disbursed; and Homestay applications, applicants and approvals — by district, block, village, constituency or region. Ask for any of these by place and year."'
  app/pipeline/common/c01_followups.py::_SCHEME_HEADLINE_OFFERS: '"Homestay": [("Applications", "How many Homestay applications were received{scope}?"), ("Approved", "How many Homestay applications were approved{scope}?"), ("Applicants", "How many people applied under the Homestay scheme{scope}?")]'
  app/pipeline/common/c02_rephraser.py::_SCHEME_NAME_MATCHER: '"Homestay": _C01Quick(Alt(W("homestay", "homestays", "cmmhm"), Joined("home", "stay")), need=("homestay", "home stay", "home-stay", "cmmhm"))'
  app/pipeline/common/c11_sql_verify_repair.py::_VR_ROW_GRAIN_GROUPS: ("curated.v_homestay_api", "curated.fact_homestay_api_application")
  app/pipeline/schemes/cm_elevate.py::_{X}_ONLY_TERMS: "_HOMESTAY_ONLY_TERMS = Matcher(Alt(\n    # the Chief Minister's Meghalaya Homestay Mission: no other scheme mentions a homestay or a tourism cluster\n    W(\"homestay\", \"homestays\", \"cmmhm\"), Joined(\"home\", \"stay\"), Seq(W(\"tourism\"), W(\"cluster\", \"clusters\")),\n))"
  app/routers/stats.py::_SQL: '"homestay": """SELECT COUNT(*) AS applications, COUNT(DISTINCT member_key) AS applicants, COUNT(*) FILTER (WHERE file_status = ''Approved'') AS approved FROM curated.v_homestay_api"""'
  app/schema_context.py::_SHARED_RULES: "\"\"\"\r\n  * Count villages by village_code or geography_key, never by name (duplicate names exist).\r\n  * The ENTIRE dataset is Meghalaya state — every row is already in Meghalaya. \"in Meghalaya\",\r\n    \"across Meghalaya\", \"state-wide\", \"overall\", or naming no place at all means NO geographic\r\n    filter whatsoever. Never emit lgd_district / lgd_block / lgd_village_name = 'Meghalaya'\r\n    (or ILIKE '%meghalaya%'), and never add a dim_geography sub-select on entity_type = 'State'\r\n    or lgd_village_name = 'MEGHALAYA' — no fact row's lgd_district matches that, so the filter\r\n    silently returns 0 rows. Add a district/block filter ONLY when the question names a\r\n    specific district or block.\r\n  * NEVER put DISTINCT — or a nested aggregate — inside a window function\r\n    (COUNT(DISTINCT x) OVER (...), SUM(DISTINCT x) OVER (...)). PostgreSQL rejects it\r\n    (\"DISTINCT is not implemented for window functions\"). Do the distinct\
    \ count in its own\r\n    CTE first, then apply the window function to that.\r\n  * \"What share / % of <metric> is concentrated in the top N% (or top decile / quartile) of\r\n    <districts | blocks | villages>\" — a concentration / Pareto question. Aggregate per unit,\r\n    rank, then divide — do NOT try to do it in one windowed expression:\r\n      WITH per_unit AS (\r\n        SELECT <unit>, SUM(<metric>) AS m FROM <curated object> [WHERE ...] GROUP BY <unit>\r\n      ), ranked AS (\r\n        SELECT m, NTILE(<100 / N>) OVER (ORDER BY m DESC) AS bucket FROM per_unit\r\n      )\r\n      SELECT ROUND(100.0 * SUM(m) FILTER (WHERE bucket = 1) / NULLIF(SUM(m), 0), 1)\r\n             AS pct_in_top_slice\r\n      FROM ranked\r\n      LIMIT 1;\r\n    top 10% -> NTILE(10); top 25% / quartile -> NTILE(4); top 5% -> NTILE(20). For \"top N\r\n    <units>\" (a count, not a percentage) rank with ROW_NUMBER() OVER (ORDER BY m DESC) and\r\n    divide the sum of rows <= N by the grand total instead.\r\
    \n  * COUNTING PEOPLE / HOUSEHOLDS ACROSS YEARS (business definition — a wrong sum here\r\n    looks perfectly plausible). A count of distinct people or households for one year\r\n    CANNOT be added to another year's: the same person appears in both. So:\r\n      - A question with no year (\"how many beneficiaries\", \"in total\", \"all years\",\r\n        \"overall\", \"till date\") about PEOPLE: if the scheme has a person identifier, count\r\n        it ONCE over all rows — COUNT(DISTINCT <person id>) with no year GROUP BY. Never\r\n        GROUP BY year and then sum the rows (Focus Plus: [[fp_benef_2223]] + [[fp_benef_2526]] = [[fp_benef_yearsum]] is\r\n        WRONG; the true all-years figure is [[fp_benef]]).\r\n      - A per-year breakdown (\"by year\", \"year-wise\", \"each year\") returns one row per\r\n        year AND, when an all-years total is also wanted, the cross-year distinct count\r\n        in its own column — never a sum of the yearly rows.\r\n      - If the scheme\
    \ has NO person / household identifier (MGNREGA: households_employed\r\n        and persons_employed are per-year tallies), no all-years unique count exists.\r\n        \"All years\" is still answered as ONE combined figure (the user's standing\r\n        instruction), but a multi-year SUM is aliased household_years / person_years and\r\n        called \"household-years\" / \"person-years\" — never households, persons or\r\n        beneficiaries. Split by year only when a year-wise breakdown is asked for.\r\n      - Money (amounts, expenditure) and events (payments, houses, person-days) DO add up\r\n        across years — the rule is only for counts of distinct people / households.\r\n  * GENDER (business definition): use only the gender data a scheme actually records —\r\n    MGNREGA: women_employment_provided only (men = persons_employed -\r\n    women_employment_provided; MGNREGA rule 6); Focus Plus: gender, 12.5K cohort only;\r\n    Homestay: gender (the applicant's) on every application;\r\
    \n    PMAY-G, Focus Legacy, CM Elevate Legacy and CMSS record NO gender, and CM Elevate's\r\n    (scheme_specific ->> 'gender_id') is locked from the chatbot — answer \"not available\". Never label a total of all persons as \"men\" or \"women\".\r\n\"\"\""
  app/schema_context.py::_{X}_TABLES: "_HOMESTAY_TABLES = \"\"\"\nHOMESTAY TABLES\n  curated.v_homestay_api  -- THE query surface (Chief Minister's Meghalaya Homestay Mission, online application\n      feed). One row = one homestay APPLICATION (request_id unique); 1,297 rows from 7 Oct 2025.\n      Columns: homestay_api_fact_id, request_id, member_key, year_key, financial_year, financial_year_short,\n        application_date, geography_key, village_code, lgd_village_name, lgd_block, lgd_district, entity_type,\n        district_lgd_code, block_lgd_code, ac_number, ac_name, region, component, is_upgradation, file_status,\n        current_file_status, current_level, data_verified, application_mode, applicant_category, gender,\n        applicant_age_years, type_of_land_holding, lease_years, land_lease_year_start,\n        land_lease_year_end, homestay_rooms, solar_energy, rainwater_harvesting, waste_management,\n        proposed_district, proposed_cluster, proposed_village, room_details (JSON,\
    \ upgradation only),\n        room_booking_6months, fund_utilization, is_repeat_member, onhold, is_withdraw\n      dim_year and dim_geography are PRE-JOINED: no join is needed for any statewide, district, block,\n      village, constituency or region figure. There is NO money column. No scheme_key column.\n      Not recorded at all: any amount (cost, subsidy, loan, grant), project dates, construction or\n      operating status, rejection reasons — see HOMESTAY RULES.\n\"\"\".strip()"
  app/schema_context.py::_{X}_RULES: "_HOMESTAY_RULES = \"\"\"\nHOMESTAY RULES (breaking these produces a wrong number, not just an ugly query):\n  1. Query curated.v_homestay_api. It is pre-joined; emit no join for an ordinary question. NEVER join it\n     row-to-row to another scheme's fact or view (Homestay Legacy, v_homestay_legacy, is a different dataset\n     of older bank loans: never row-join or add the two), and never match people across schemes through\n     member_key. Aggregate each scheme SEPARATELY and combine the aggregates.\n  2. One row = one APPLICATION.\n       applications / requests / records          -> COUNT(*)\n       applicants / people / unique applicants    -> COUNT(DISTINCT member_key)   (1,278 people; 17 applied\n                                                     more than once)\n       approved / sanctioned applications        -> COUNT(*) FILTER (WHERE file_status = 'Approved')\n     member_key is masked: COUNT(DISTINCT member_key) is its ONLY permitted use\
    \ — never SELECT, GROUP BY,\n     ORDER BY or show it. No list of individual applicants is ever returned: answer a \"list the applicants\"\n     with counts by the next level down and say why. Never select pincode, establishment_manager_self or the\n     *_remarks columns (they can carry names and addresses).\n  3. NO MONEY: the data records no project cost, subsidy, loan, grant or disbursement. Any money question is\n     answered \"not recorded in the Homestay application data\" (the subsidy rates are scheme facts from the\n     reference documents, not data). Never SUM or AVG anything as rupees.\n  4. STATUS: a bare \"status\" = file_status (Approved / Pending / Rejected / Unknown). \"forwarded\", \"sent\n     back\", \"resubmitted\" -> current_file_status. \"verified\", \"valid\", \"invalid\", \"on hold\", \"wrong\" ->\n     data_verified (on hold is data_verified = 'On Hold'; onhold and is_withdraw are FALSE on every row).\n     Compare current_level with LOWER() (level1 / Level4).\
    \ All 80 approvals are in FY 2025-26.\n  5. TWO KINDS OF APPLICATION (component): 'Development of New Homestay' (is_upgradation = FALSE) and\n     'Updragation of New Homestay' (the typo is the source's; is_upgradation = TRUE, 24 rows). Rooms,\n     solar_energy, rainwater_harvesting, waste_management and the proposed_* columns are filled only\n     WHERE NOT is_upgradation: their shares are out of the new-homestay applications, and say so.\n  6. ROOMS: SUM / AVG / MAX of homestay_rooms always add FILTER (WHERE NOT COALESCE(homestay_rooms > 100,\n     FALSE)) — one application records 3,500 rooms (a data-entry error) — and say it was left out.\n     Rooms in the 24 upgradation homestays sit only in room_details:\n     COALESCE(NULLIF(room_details -> 0 ->> 'total_number_single_room', '')::int, 0)\n       + COALESCE(NULLIF(room_details -> 0 ->> 'total_number_double_bed_room', '')::int, 0).\n     Never add the two room counts without saying so. Beds are not recorded.\n  7. GEOGRAPHY is the\
    \ APPLICANT'S HOME address (district_lgd_code, block_lgd_code, village_code). Use the\n     proposed homestay site (proposed_district, proposed_cluster, proposed_village) ONLY when the question\n     says \"located in\", \"proposed in\", \"site\" or names a tourism cluster; proposed_cluster holds tourism\n     clusters, never LGD blocks. Filter on codes and group on code and name together. Municipal boards and\n     town committees are reported as blocks; wards take the place of villages in towns.\n  8. entity_type = 'Unresolved' marks 64 applications with no village and no constituency. INCLUDE them in\n     State, district and block counts; EXCLUDE them (entity_type <> 'Unresolved') from village counts,\n     lists and rankings and from constituency figures, and say so.\n  9. TIME: financial_year_short '2025-26' (from 7 Oct 2025, when the scheme launched) and '2026-27'\n     (PARTIAL, to 19 Oct 2026). No year -> every year, stated. A year comparison must say 2026-27 is\n     incomplete.\
    \ application_date is the application's date. Any earlier year -> \"no Homestay applications\n     are recorded for <year>\", never 0.\n 10. NOT HELD — money of any kind, project start / end dates, construction progress, operating status,\n     bed-nights or guests, the design chosen, bank or sanction letter, rejection reason, caste / ST subsidy\n     rate, Boutique (Component 3) homestays (none applied): answer \"not recorded in the Homestay data\".\n 11. RANKING: rank on counts; default top 5 for a plural \"top\", LIMIT 1 for \"highest / lowest\". Village and\n     constituency rankings exclude Unresolved rows. Show ties in full.\n\"\"\".strip()"
  app/schema_context.py::_{X}_VOCAB: "_HOMESTAY_VOCAB = \"\"\"\nHOMESTAY BUSINESS VOCABULARY (source: data/homestay/homestay_schema_partitions.yaml)\n    \"applications\" / \"requests\" / \"proposals\" -> COUNT(*)\n    \"applicants\" / \"people\" / \"unique applicants\" -> COUNT(DISTINCT member_key)\n    \"approved\" / \"sanctioned\" -> COUNT(*) FILTER (WHERE file_status = 'Approved')   \"approval rate\" -> ROUND(100.0 * that / COUNT(*), 1)\n    \"pending\" / \"rejected\" / \"unknown status\" -> file_status   \"forwarded\" / \"sent back\" / \"resubmitted\" -> current_file_status\n    \"verified\" / \"valid\" / \"invalid\" / \"on hold\" / \"wrong\" -> data_verified\n    \"new homestay\" / \"new build\" -> NOT is_upgradation   \"upgradation\" / \"upgrade\" / \"existing homestay\" -> is_upgradation\n    \"rooms\" -> SUM(homestay_rooms) FILTER (WHERE NOT COALESCE(homestay_rooms > 100, FALSE))   (new homestays)\n    \"solar\" -> solar_energy   \"rainwater harvesting\" -> rainwater_harvesting  \
    \ \"waste\" -> waste_management\n    \"women\" / \"youth\" / \"first generation\" / \"differently abled\" -> applicant_category   \"male\" / \"female\" -> gender\n    \"age\" -> applicant_age_years   \"owned\" / \"leased land\" -> type_of_land_holding   \"lease period\" -> lease_years\n    \"online\" / \"CM Connect\" -> application_mode   \"repeat applicants\" -> is_repeat_member\n    \"cluster\" / \"tourism cluster\" -> proposed_cluster   \"proposed site\" / \"located in\" -> proposed_district, proposed_village\n    \"villages\" -> COUNT(DISTINCT village_code) FILTER (WHERE entity_type <> 'Unresolved')   \"wards\" -> entity_type = 'Ward'\n    \"constituency\" / \"AC\" -> ac_number, ac_name (Unresolved rows excluded)   \"region\" -> region\n    \"year\" -> financial_year_short ('2025-26', '2026-27' partial)\n\"\"\".strip()"
