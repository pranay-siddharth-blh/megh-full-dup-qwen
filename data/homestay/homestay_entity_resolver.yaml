  sql: "SELECT COUNT(*) FILTER (WHERE (file_status = 'Approved')) AS approved, COUNT(*) AS applications FROM curated.v_homestay_api WHERE district_lgd_code = 663;"
  expected: {approved: 0, applications: 17}

