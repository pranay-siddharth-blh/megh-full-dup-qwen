  application_mode:
    column: application_mode
    values:
    - { stored: Online, applications: 1235, sql_predicate: "application_mode = 'Online'",
        aliases: [online, portal, self, applied online, web, internet, self-applied] }
    - { stored: cmConnectCenter, display: CM Connect Centre, applications: 63, sql_predicate: "application_mode = 'cmConnectCenter'",
        aliases: [CM Connect, CM Connect Centre, CM Connect Center, cmConnectCenter, CSC, common service centre,
                  kiosk, assisted, through centre, offline centre] }

  gender:
    column: gender
    values:
    - { stored: Female, applications: 681, sql_predicate: "gender = 'Female'",
        aliases: [female, women, woman, ladies, girls, F] }
    - { stored: Male, applications: 617, sql_predicate: "gender = 'Male'",
