worked_examples:

- user: "how many homestay applications in EKH"
  resolve:
  - { text: EKH, type: district, canonical: East Khasi Hills, code: 274, matched_by: 4_acronym }
  sql: "SELECT COUNT(*) AS applications FROM curated.v_homestay_api WHERE district_lgd_code = 274;"
  expected: 342

- user: "applications in west khasi"
  resolve:
  - { text: "west khasi", type: district, canonical: West Khasi Hills, code: 279, matched_by: 2_alias }
  sql: "SELECT COUNT(*) AS applications FROM curated.v_homestay_api WHERE district_lgd_code = 279;"
  expected: 125
  note: Must NOT fuzzy-match Eastern West Khasi Hills (blocked pair). Includes the 13 remapped applicants.

- user: "approved applications in SWGH"
  resolve:
  - { text: SWGH, type: district, canonical: South West Garo Hills, code: 663, matched_by: 4_acronym }
