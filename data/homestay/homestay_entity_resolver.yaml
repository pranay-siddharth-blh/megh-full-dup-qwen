    - { stored: level4, applications: 565, sql_predicate: "current_level = 'level4'",
        aliases: [level 4, level4, L4, fourth level, level four, final level] }
    absent: [level 2, level 3]
    absent_note: No application sits at level 2 or 3. Resolve to not_found with the two stored levels as suggestions.

  data_verified:
