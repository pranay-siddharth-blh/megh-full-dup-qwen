      'Sanctioned', 'disbursed', 'loan released' are NOT aliases of Approved - the gate states
      the difference (approved_described_as_sanctioned_or_disbursed). 'Not approved' alone is
      ambiguous (Pending + Unknown + Rejected = 1,218) - resolve to NOT (file_status = 'Approved') and list
      the three statuses in the answer.

  current_file_status:
    column: current_file_status
    nulls: 0
    values:
    - { stored: Forward, applications: 1214, sql_predicate: "current_file_status = 'Forward'",
        aliases: [forward, forwarded, in forward, moved forward, sent forward, forward status] }
    - { stored: Approved, applications: 80, sql_predicate: "current_file_status = 'Approved'",
        aliases: [approved movement] }
    - { stored: Sendback, applications: 3, sql_predicate: "current_file_status = 'Sendback'",
        aliases: [sendback, send back, sent back, returned, returned to applicant] }
    - { stored: Resubmit, applications: 1, sql_predicate: "current_file_status = 'Resubmit'",
        aliases: [resubmit, resubmitted, re-submitted, submitted again] }

  current_level:
    column: current_level
    stored_case: lower case in the view (source 'level1' / 'Level4')
    values:
