companion_schema: homestay_schema_partitions.yaml

# ===========================================================================
# v1.0 - 2026-11-06 - FIRST VERSION, WRITTEN AHEAD OF THE DATABASE LOAD
#
# Target: curated.v_homestay_api (PLACEHOLDER) over curated.fact_homestay_application.
#
# Source column -> expected view column:
#   member_id                -> member_key            hashed, NEVER resolved, NEVER shown
#   createddate              -> application_date
#   financial_year           -> financial_year_short  '2025-26' | '2026-27'
#   mapped_district_lgd_code -> district_lgd_code     authoritative (raw code differs on 14 rows)
#   mapped_district_lgd_name -> lgd_district          STORED UPPERCASE
#   mapped_block_lgd_code    -> block_lgd_code        authoritative; includes 11 towns
#   mapped_block_lgd_name    -> lgd_block             STORED UPPERCASE
#   mapped_village_lgd_code  -> village_code          (Unresolved placeholder when NULL - 64 rows)
#   mapped_constituency_*    -> ac_number / ac_name
#   response_type            -> application_type + is_upgradation
#   file_status / current_file_status / current_level / data_verified -> same names (level lower-cased)
#   gender_id                -> gender
#   applicant_category, application_mode -> same names
#   type_of_land_holding     -> type_of_land_holding
#   district_of_proposed_location / block_of_proposed_location -> proposed_district / proposed_cluster
#   homesaty_rooms           -> rooms
#   rainwater_harvesting / solar_energy -> rainwater_harvesting / solar_energy
#
# The catalogues for district, block, constituency, the village ambiguity registry,
# proposed_cluster and proposed_district were GENERATED from the CSV by a script,
# grouped by LGD code, on 2026-11-06. Every total reconciles to 1,298 (constituency
# 1,234 + 64 Unresolved; cluster 1,252 + 46 NULL; site district 1,274 + 24 NULL).
# None is measured in megh_db.
# ===========================================================================

description: >
  Value-level entity resolution for the Homestay NLP-to-SQL bot. This file answers exactly
  one question: the user typed some text - which stored database value did they mean?
  It does NOT define column meanings or aggregation; that is the companion stage2 semantic
  schema. Resolve entities with this file FIRST, then hand the resolved canonical values -
  for geography, the LGD CODE - to schema linking and SQL generation.

scheme:
  id: homestay
  display_name: Homestay
  full_name: Chief Minister's Meghalaya Homestay Mission (formerly Meghalaya Tourism Homestay Scheme)
  state: Meghalaya
  department: Tourism Department, Government of Meghalaya
  implementing_agency: Directorate of Tourism, with DCIC (Commerce and Industries), MIPA and partner banks
  portal: invest.meghalaya.gov.in / meghalayaone.gov.in (Homestay API)
  aliases: [Homestay, "Home Stay", "Home-stay", "homestay scheme", "homestay mission",
            "CM Homestay Mission", "Chief Minister's Meghalaya Homestay Mission", "CMMHM",
            "CM's Meghalaya Homestay Mission", "Meghalaya Tourism Homestay Scheme",
            "tourism homestay scheme", "homestay subsidy scheme", "homestay applications",
            "Homestay API", "new homestay scheme", "homestay upgradation scheme"]
  alias_note: >
    NOT aliases: "Homestay Legacy" / "homestay loans" / "old homestay scheme" / "MTDIPS
    homestay loans" (the separate disbursed-loan register, curated.v_homestay_legacy) - a
    loan-register cue sends the question to the gate (homestay_dataset_ambiguous). Also never
    "PMEGP" alone (a central scheme the subsidy converges with), "MTDC" (the tourism
    corporation), or "M-TIME" (the tourism portal).

tables:
  applications: curated.v_homestay_api                 # PLACEHOLDER - primary query surface, 52 columns
  fact: curated.fact_homestay_application          # PLACEHOLDER - underlying fact, lineage only
  place_lookup: curated.v_place_names              # name -> level lookup across the roster
  coverage: curated.v_data_coverage                # years present per scheme
  reconciliation: meta.v_reconciliation_homestay   # PLACEHOLDER - operator check

dataset_shape:
  grain: one row per Homestay Mission application (new-build or upgradation), any status
  row_count: unverified_in_db
  row_count_note: The source file holds 1,298 rows. The view is not loaded.
  single_table: true
  years_present: ['2025-26', '2026-27']
  emits_no_joins: >
    curated.v_homestay_api will pre-join dim_geography and dim_year, so the generator emits WHERE
    and GROUP BY only. See homestay_foreign_key_augmentation.yaml.

# ---------------------------------------------------------------------------
# HOW TO USE THIS FILE
# ---------------------------------------------------------------------------
how_to_use:
  step_1_classify: >
    Decide the entity type of each span. Order matters because town, block, village,
    constituency and tourism-cluster names collide - see cross_dimension_collisions. Try:
    financial_year -> district -> town -> block -> constituency -> village / ward ->
    proposed_cluster -> region -> application_type -> file_status -> current_file_status ->
    data_verified -> applicant_category -> application_mode -> gender -> land ->
    waste_management -> absent_dimension -> identifier -> measure.
  step_2_normalise: Apply normalisation.fold to the user text and to candidate values.
  step_3_match: Walk matching_pipeline in order; stop at the first stage that hits.
  step_4_emit: Return an output_contract shape. Never put raw user text into SQL.
  step_5_predicate: Build WHERE using the dimension's sql_predicate template.

  hard_rules:
  - "CODES, NOT NAMES, REACH THE SQL for home geography. Every district, block, village and
    constituency resolves to district_lgd_code, block_lgd_code, village_code or ac_number."
  - "SITE GEOGRAPHY IS TEXT. proposed_cluster and proposed_district are not LGD-coded; they
    resolve to the exact stored value, compared with lower(). They are used only when the
    user signals the proposed site ('located', 'proposed', 'site', 'cluster')."
  - "A CLUSTER IS NOT A BLOCK. 'Nongstoin' can be the Nongstoin Cluster (115 site
    applications), Nongstoin block (43), Nongstoin Town Committee (41) or Nongstoin
    constituency (80). With no qualifier, return ambiguous."
  - "TOWNS ARE BLOCKS. 11 municipal boards and town committees sit in block_lgd_code. A bare
    'Nongstoin', 'Mairang', 'Resubelpara', 'Baghmara' or 'Mawkyrwat' hits a rural block AND a
    town - return ambiguous."
  - "TURA, SHILLONG AND SOHRA ARE NOT RURAL BLOCKS. Tura = Tura MB (249806), North / South Tura
    constituencies (50, 51) or the Tura clusters. Shillong = Shillong MB (249814) or East Khasi
    Hills. Sohra = Sohra Cluster (site) or Sohra constituency (28)."
  - Villages are resolved by village_code, never by name alone. 9 village names repeat.
  - "STATUS WORDS ARE COLUMN-SPECIFIC. 'Pending' -> file_status; 'forward', 'sendback',
    'resubmit' -> current_file_status; 'valid', 'invalid', 'wrong', 'on hold' -> data_verified;
    'level 1', 'level 4' -> current_level. Never cross them."
  - "'UPDRAGATION' IS THE STORED SPELLING. 'Upgradation', 'upgrade', 'renovation', 'existing
    homestay' resolve to is_upgradation = TRUE - never to a corrected text literal."
  - "member_key / member_id, EPIC, family id, mobile, PDS id, M-TIME id, request id and
    names are NEVER resolved. A typed identifier returns refused; a typed name returns
    not_available."
  - "MONEY DOES NOT EXIST. 'Subsidy', 'loan', 'cost', 'grant', 'EMI' return not_available -
    see absent_dimensions."
  - "TWO YEARS. '2025-26' and '2026-27' and their forms resolve; any other financial year
    resolves to not_available ('not loaded'), never to an empty filter that returns 0."
  - If more than one candidate survives, return ambiguous and ask. Never pick the first row.
  - If nothing matches above the fuzzy floor, return not_found with suggestions.

# ---------------------------------------------------------------------------
normalisation:
  fold:
  - trim and collapse internal whitespace to single spaces
  - uppercase
  - "strip trailing qualifier words: BLOCK, C&RD BLOCK, C & RD BLOCK, CD BLOCK, DISTRICT, VILLAGE, CONSTITUENCY, AC, LAC"
  - "strip CLUSTER, TOURISM CLUSTER, CIRCUIT only when matching proposed_cluster"
  - "map MB -> MUNICIPAL BOARD and TC -> TOWN COMMITTEE (only as a trailing token after a town name)"
  - "strip the source's duplicated suffix: '-MUNICIPAL BOARD' after 'MUNICIPAL BOARD'"
  - map & to AND
  - treat - / ( ) and . as a single space, then re-collapse whitespace
  - "fold '(CT)' and '(M)' census-town / municipal markers away before village matching"
  squash: remove every non-alphanumeric character from the folded form
  numeric_ids: >
    district_lgd_code (3 digits), block_lgd_code (4 digits rural, 6 digits towns),
    village_code (up to 7 digits) and ac_number (1-60) are integers.
  number_disambiguation: >
    A bare 1-2 digit number in a constituency context is an ac_number; a 3-digit number is a
    district code; a 4-digit number is a rural block code; a 6-digit number is a town block
    code or a village code - check both catalogues and ask if both hit. A number followed by
    'rooms' is a room count, not a code.
  identifier_patterns:
    member_id: "'^[A-Z][0-9][A-Z][0-9][A-Z][0-9A-Z]$' (e.g. W0U1UK) -> refused"
    request_id: "'^REQ/[0-9]+/[0-9]+/[0-9]+/[0-9]+$' -> refused (refer to portal / 1971)"
    epic_id: "'^[A-Z]{3}[0-9]{7}$' -> refused"
    family_id: "'^FAM/[0-9]{6}/[0-9]{6}$' -> refused"
    mobile: "'^[6-9][0-9]{9}$' -> refused (also the shape of mtime_portal_id)"
  ward_fold: >
    'Ward 8', 'Ward No 8', 'Ward No. 8', 'W8' fold to 'WARD NO 8'. Keep the town qualifier
    ('Tura ward 8').

matching_pipeline:
- { stage: 1_exact,     test: folded user text == folded canonical, confidence: 1.0 }
- { stage: 2_alias,     test: folded user text in the value's aliases, confidence: 0.98 }
- { stage: 3_squash,    test: squashed user text == squashed canonical or alias, confidence: 0.95 }
- { stage: 4_acronym,   test: district acronym table only, confidence: 0.95,
    note: acronyms are defined for districts and the towns' MB / TC forms only }
- stage: 5_contains
  test: folded canonical is a whole-word substring of the user text or vice versa
  confidence: 0.85
- stage: 6_fuzzy
  test: RapidFuzz token_set_ratio over the dimension catalogue
  accept_at: ">= 90 and runner-up at least 5 points lower"
  ask_between: 80 - 89, or any score where the runner-up is within 5 points
  reject_below: 80
- stage: 7_embedding
  test: BGE-small nearest neighbour over the dimension catalogue
  use_when: fuzzy returned nothing at or above 80
  accept_at: cosine >= 0.88 AND unique within its dimension
- { stage: 8_fail, action: emit not_found with up to 5 suggestions }

blocked_matches:
  purpose: >
    Pairs fuzzy matching gets wrong. Never let stage 6 or 7 resolve the left value to the
    right one; require an exact or alias hit.
  pairs:
  - [West Khasi Hills, Eastern West Khasi Hills] # two districts, 279 vs 740
  - [Eastern West Khasi Hills, West Khasi Hills]
  - [West Garo Hills, South West Garo Hills]     # 278 vs 663
  - [South West Garo Hills, West Garo Hills]
  - [West Khasi Hills, South West Khasi Hills]   # 279 vs 658
  - [Mawkynrew, Mawkyrwat]                       # East Khasi Hills vs South West Khasi Hills
  - [Mawkyrwat, Mawkynrew]
  - [Mawsynram, Mawshynrut]
  - [Mawshynrut, Mawsynram]
  - [Laskein, Thadlaskein]
  - [Thadlaskein, Laskein]
  - [Mawphlang, Mawpat]
  - [Mawlai, Mawhati]
  - [Rongram, Rongara]
  - [Rongjeng, Rongram]                          # cluster vs block
  - [Siju, Saipung]
  - [North Tura, South Tura]                     # 50 vs 51 (138 vs 8 applications)
  - [Tura (Municipal), Tura (Non Municipal)]     # two clusters (103 vs 68)
  - [Nongstoin, Nongstoin Town Committee]        # 1980 vs 249810
  - [Mairang, Mairang Town Committee]            # 1982 vs 249811
  - [Resubelpara, Resubelpara Municipal Board]   # 1970 vs 249807
  - [Baghmara, Baghmara Municipal Board]         # 1977 vs 249809
  - [Mawkyrwat, Mawkyrwat Town Committee]        # 1984 vs 282009
  - [Sohiong, Sohra]                             # constituencies 23 vs 28
  - [Kheliriat, Khliehriat Town Committee]       # site cluster vs home town
  - [Umiam, Umling]                              # cluster vs block
  - [Invalid, Valid]
  - [Wrong, Rejected]
  - [Approved, Approved current_file_status]     # same rows, but resolve file_status by default
  - [Women, Female]                              # applicant_category vs gender
  - [Youth, Female]

output_contract:
  resolved:
    status: resolved
    entity_type: district | block | town | village | ward | constituency | proposed_cluster |
                 proposed_district | region | financial_year | application_type | file_status |
                 current_file_status | current_level | data_verified | applicant_category |
                 application_mode | gender | type_of_land_holding | waste_management | measure
    user_text: <verbatim span>
    canonical: <display value>
    code: <district_lgd_code / block_lgd_code / village_code / ac_number - home geography only>
    stored: <exact stored text - categorical and site columns>
    sql_predicate: <the dimension's predicate, filled>
    confidence: <0-1>
    matched_by: <pipeline stage>
  ambiguous:
    status: ambiguous
    entity_type: <type or [types]>
    user_text: <verbatim span>
    candidates: [ { canonical, entity_type, code_or_stored, district, applications } ]
    question: <one short question naming the distinguishing attribute>
  not_found:
    status: not_found
    entity_type: <type or unknown>
    user_text: <verbatim span>
    suggestions: [ up to 5 nearest catalogue values ]
    message: state plainly that the value is not in the Homestay data.
  not_available:
    status: not_available
    entity_type: <absent dimension, or financial_year>
    user_text: <verbatim span>
    reason: <one line>
    offer: <the nearest answerable dimension>
  refused:
    status: refused
    entity_type: person_identifier
    user_text: <never echoed>
    reason: Personal data - member id, EPIC, family id, phone, PDS id, M-TIME id, request number or name.

# ---------------------------------------------------------------------------
overloaded_terms:
  why: >
    A handful of words map to more than one column, or to a column that does not exist.
    Getting these wrong produces a confidently wrong answer, so they are listed explicitly.

  beneficiaries:
    means: "COUNT(*) - applications"
    default: homestay_default_rules.yaml beneficiary_term - with the approved count stated.
    note: The client workbook calls applicants beneficiaries. 1,298 applications, 80 approved.

  applicants:
    readings:
    - { means: "COUNT(*)", when: "applicants, applications, applied, received, submitted" }
    - { means: "COUNT(DISTINCT member_key)", when: "unique, distinct, individual, people, persons" }

  homestays:
    readings:
    - { means: "COUNT(*) - applications", when: "how many homestays (no site / operation cue)" }
    - { means: "COUNT(*) FILTER (WHERE (file_status = 'Approved'))", when: "homestays approved / sanctioned (gate states approved != sanctioned)" }
    - { means: "gate - construction_or_operational_status_requested", when: "operational, built, running, completed, under construction" }

  status:
    readings:
    - { means: "file_status", when: "status, application status, file status, approved, pending, rejected, unknown" }
    - { means: "current_file_status", when: "forward, forwarded, sent back, sendback, returned, resubmit, movement" }
    - { means: "current_level", when: "level, desk, stage" }
    - { means: "data_verified", when: "verification, verified, valid, invalid, wrong, on hold" }
    critical: true

  pending:
    means: "file_status = 'Pending' (1,082)"
    note: "Not 'Forward' (1,214). 'In process' / 'under process' with 'forward' goes to the gate."

  approved:
    means: "(file_status = 'Approved') (file_status = 'Approved', 80)"
    note: "Identical rows to current_file_status = 'Approved'. NOT 'sanctioned' or 'disbursed' - the gate states that."

  on_hold:
    means: "data_verified = 'On Hold' (23)"
    note: The source onhold column is FALSE on every row and is not in the view.

  rejected:
    means: "file_status = 'Rejected' (2)"
    note: "Never 'Unknown' (134), 'Invalid' (93) or 'Wrong' (5)."

  women:
    readings:
    - { means: "gender = 'Female' (681)", when: "female, women applicants, woman, ladies" }
    - { means: "applicant_category = 'Women' (479)", when: "women category, under the Women category, women entrepreneur scheme category" }
    note: Default to gender unless 'category' is said (homestay_default_rules.yaml gender_vs_women_category).

  youth:
    means: "applicant_category = 'Youth (18-35 yrs)' (491)"
    note: Declared category, not computed age. 'Young applicants' by age uses applicant_age_years bands.

  upgradation:
    means: "is_upgradation (24)"
    aliases_that_mean_the_same: [upgradation, upgrade, renovation, existing homestay, refurbishment, Component 2]

  new_homestay:
    means: "NOT is_upgradation (1,274)"
    aliases_that_mean_the_same: [new homestay, new build, new construction, development of new homestay, Component 1]

  rooms:
    readings:
    - { means: "SUM(homestay_rooms) FILTER (WHERE NOT COALESCE(homestay_rooms > 100, FALSE)) - proposed, new-build", when: "rooms, room capacity, guest rooms, proposed rooms" }
    - { means: "SUM(COALESCE(NULLIF(room_details -> 0 ->> 'total_number_single_room', '')::int, 0) + COALESCE(NULLIF(room_details -> 0 ->> 'total_number_double_bed_room', '')::int, 0)) - existing, upgradation", when: "existing rooms, rooms to be upgraded" }

  district:
    readings:
    - { means: "district_lgd_code (home)", when: "district, from, applicants in, resident of" }
    - { means: "proposed_district (site)", when: "located in, proposed in, site in, to be set up in, built in" }

  block:
    readings:
    - { means: "a rural C&RD block", when: "block, C&RD, development block, CD block" }
    - { means: "a town reported as a block", when: "municipal board, MB, town committee, TC, town, municipality" }
    - { means: "proposed_cluster", when: "cluster, tourism cluster, circuit, proposed block, site block" }

  year:
    readings:
    - { means: "financial_year_short = '2025-26'", when: "2025-26, FY 2025-26, 2025-2026, last year" }
    - { means: "financial_year_short = '2026-27'", when: "2026-27, FY 2026-27, this year, current year" }
    - { means: "not_available - not loaded", when: "any other financial year" }
    - { means: "gate - calendar_year_requested", when: "a bare 2025 or 2026" }
    critical: true

  amount:
    means: not_available
    note: "subsidy, loan, cost, grant, EMI, amount, money, funds, sanctioned amount - no column. Gate money_amount_requested."

  duplicate:
    readings:
    - { means: "COUNT(*) - COUNT(DISTINCT member_key) / is_repeat_member", when: "duplicate applications, applied twice, repeat applicants" }
    - { means: "refused", when: "show the duplicate EPIC / family id / member id values" }

# ---------------------------------------------------------------------------
cross_dimension_collisions:
  measured_note: Generated from the catalogues below (also_a fields), 2026-11-06.
  town_rural_block_collisions: [Baghmara, Mairang, Mawkyrwat, Nongstoin, Resubelpara]
  names_that_are_only_towns_or_constituencies: [Tura, Shillong, Jowai, Nongpoh, Khliehriat, William Nagar]
  cluster_collisions:
    note: >
      Tourism-cluster names that are also home-geography names. A bare name hits both; the
      cue word decides (cluster / located / site vs block / from / applicants in).
    with_block: [Nongstoin, Thadlaskein, Resubelpara, Mawkyrwat, Umsning, Nongpoh, Pynursla,
                 Mawthadraishan, Bhoirymbong, Mawpat, Mawsynram, Mawphlang, Mawkynrew, Siju,
                 Rerapara, Mairang, Ranikor, Mawlai, Kharkutta, Samanda, Bajengdoba, Adokgre, Tura,
                 Williamnagar (William Nagar Municipal Board)]
    with_constituency: [Nongstoin, Sohra, Resubelpara, Mawkyrwat, Umsning, Nongpoh, Pynursla,
                        Mawthadraishan, Mawsynram, Mawphlang, Mawkynrew, Mairang, Ranikor, Mawlai,
                        Kharkutta, Umroi, Bajengdoba, Rongjeng]
    cluster_only: [Wari Chora, Kheliriat, Babadam, Dawki, Mawdiangdiang, Umden, Kynshi, Umiam, Nokrek]
    cluster_only_note: >
      'Kheliriat' is the portal's spelling of Khliehriat, so 'Khliehriat' alone also hits
      Khliehriat Town Committee (home, 1 applicant) - resolve to the cluster only on a site cue.
  disambiguation_rules:
  - If the user said "block", "C&RD block" or "CD block", resolve as rural block.
  - If the user said "municipal board", "MB", "town committee", "TC", "town" or "municipality", resolve as town.
  - If the user said "constituency", "AC", "LAC", "MLA" or "assembly", resolve as constituency.
  - If the user said "village", "ward" or "locality", resolve as village / ward.
  - If the user said "cluster", "tourism cluster", "circuit", "proposed", "site" or "located", resolve as proposed_cluster / proposed_district.
  - If the user said "district" after a town name ("Mairang district"), resolve the district alias.
  - "With no qualifier on a colliding name, return AMBIGUOUS - the gate asks."
  - "A cluster_only name ('Wari Chora', 'Dawki', 'Umiam') resolves to the cluster without asking (homestay_default_rules.yaml cluster_named_without_block_namesake)."
  - "A name that is only a town (Jowai, Nongpoh, Khliehriat, William Nagar) defaults to the town without asking; Nongpoh is also a cluster - add the cluster figure as a follow-up."
  - Districts never collide with anything; resolve them with no qualifier needed.

# ---------------------------------------------------------------------------
# ABSENT DIMENSIONS - recognised, then refused with a reason (output: not_available)
# ---------------------------------------------------------------------------
absent_dimensions:
  note: >
    Users ask for these by name. They are recognised so the bot can say WHY they are not held,
    rather than failing to find them. None has a column in v_homestay.
  money:
    triggers: [subsidy, loan, loan amount, project cost, cost, grant, EMI, EMI support, margin money,
               PMEGP share, sanctioned amount, amount, money, funds, funds released, disbursed,
               disbursement, investment, budget, expenditure, Rs, lakh, crore]
    reason: The application feed records no money.
    offer: applications and approvals; scheme rates as a scheme fact
  project_dates:
    triggers: [project start, project end, start date, completion date, project duration, timeline,
               construction period, commissioning date]
    reason: project_start_date and project_end_date are empty on every row.
    offer: application date (month)
  construction_or_operation:
    triggers: [operational, functional, running, built, constructed, under construction, completed,
               commissioned, onboarded, launched, closed, cancelled, discontinued]
    reason: Not in this feed - it records applications and approvals only.
    offer: approved applications
  bank:
    triggers: [bank, branch, Meghalaya Rural Bank, MRB, SBI, sanction letter, credit appraisal]
    reason: Not in this feed.
    offer: approved applications
  social_category:
    triggers: [caste, tribe, ST, SC, OBC, community, income, BPL, religion]
    reason: Not collected.
    offer: applicant_category or gender
  disability_detail:
    triggers: [disability certificate, PwD subsidy, 80% subsidy, type of disability]
    reason: Only the 'Differently Abled' category is recorded.
    offer: applicant_category = 'Differently Abled' (7)
  training_design_footfall:
    triggers: [training, IHM, hospitality training, 33 designs, standard design, design chosen,
               bed-nights, footfall, guests, occupancy, tariff earned]
    reason: Not in this feed.
    offer: applications
  beds:
    triggers: [beds, bed capacity, bed count]
    reason: Only rooms are recorded.
    offer: rooms
  rejection_reason:
    triggers: [why rejected, reason for rejection, reason for sendback, why sent back]
    reason: Not recorded.
    offer: counts by status
  withdrawn:
    triggers: [withdrawn, withdrew, withdrawal]
    reason: No application is marked withdrawn (is_withdraw FALSE on every row; not exposed).
    offer: status breakdown
  person:
    triggers: [name, applicant name, owner, phone, mobile, email, address, pincode, EPIC, voter id,
               family id, member id, PDS, ration card, Aadhaar, date of birth, DOB, M-TIME id,
               request number, application number]
    reason: Personal data - never resolved.
    offer: area totals
    output: refused for an identifier shape, not_available otherwise
  boutique:
    triggers: [boutique, boutique homestay, Component 3, 10-room, National Games bonus]
    reason: No boutique application exists in this feed.
    offer: new homestay and upgradation counts; scheme facts

