  village:
    name_column: lgd_village_name
    code_column: village_code
    stored_case: as the roster records it (mixed case), NOT uppercased
    distinct_names: 657
    distinct_codes: 667
    unresolved_applications: 64
    sql_predicate: "village_code = <lgd_code>"
    lookup_source: >
      Village names are not listed in full. Look them up in curated.v_place_names (level =
      village) or dim_geography, then apply this registry to decide whether to ask.
    counting_villages: "COUNT(DISTINCT village_code) FILTER (WHERE entity_type <> 'Unresolved'). Wards count as villages."
    wards_note: >
      Tura wards are stored as 'Ward No. 8' with no town in the name; Resubelpara wards as
      'Resubelpara - Ward No.11'. 'Ward No. 8' alone is ambiguous across towns - scope it by town.
    unresolved_placeholder:
      critical: true
      text: >
        The 64 applications with no mapped village carry their block's Unresolved placeholder
        code. 37 of them are applicants from Cherrapunjee (census town, Shella Bholaganj block)
        and 25 from Rongram block. Never return the placeholder as a village match.
    cherrapunjee_note: >
      'Cherrapunjee' / 'Sohra town' as a HOME village is not in the mapped catalogue: those 37
      applicants are Unresolved rows of Shella Bholaganj (1994). Resolve to block 1994 with
      entity_type = 'Unresolved' and say so, or offer the Sohra Cluster (site) reading.
    resolution_strategy:
    - 1. If the user gave a numeric code, resolve on village_code directly.
    - 2. Fold the name and look it up scoped by any district or block also given.
    - 3. If exactly one code survives, resolve and emit the CODE.
    - 4. If more than one survives, return ambiguous with codes, districts and blocks.
    - 5. If none survive, run fuzzy then embedding, then not_found with 5 suggestions.
