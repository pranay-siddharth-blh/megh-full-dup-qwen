resolver_version: '1.0'
resolver_name: homestay_entity_resolver
display_name: Homestay (CM's Meghalaya Homestay Mission - API application feed) Entity Resolver (Meghalaya)
generated_from:
- "datasets/Homestay/Home Stay API - 2026-11-01.csv"
- "datasets/Homestay/HomeStay_Use_Cases.xlsx (sheet 'Homestay API')"
- "datasets/Homestay/meghalaya_homestay_scheme_complete_scheme_reference.md"
- "datasets/Homestay/meghalaya_homestay_scheme_general_faq.md"
- SCHEMA_FOR_DEVELOPERS.md (live database extract, 2026-11-03 - Homestay API not yet loaded)
