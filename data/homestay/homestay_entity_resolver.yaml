  identifiers:
    member_key:
      column: member_key
      pii: true
      resolvable: false
      rule: NEVER resolved, shown or filtered. Permitted only inside COUNT(DISTINCT member_key).
    homestay_api_fact_id:
      column: homestay_api_fact_id
      role: surrogate primary key
      rule: identifier only - never SUM or AVG; never quoted back.
    request_id:
      column: fact_homestay_application.source_request_id
      resolvable: false
      rule: Not in the view. Refer the applicant to the portal or helpline 1971.
    epic_family_mobile_pds_mtime:
      resolvable: false
      rule: Not in the view. Refused - personal data.

measure_vocabulary:
  applications:
    aggregate: COUNT(*)
    aliases: [applications, applicants, beneficiaries, records, how many applied, total applications,
              applications received, number of homestays (no site cue)]
    unit: applications
  approved:
    aggregate: COUNT(*) FILTER (WHERE (file_status = 'Approved'))
    aliases: [approved, approvals, approved applications, approved homestays]
    unit: applications
  distinct_applicants:
    aggregate: COUNT(DISTINCT member_key)
    aliases: [unique applicants, distinct applicants, individual applicants, people, persons]
    unit: people
  approval_rate:
    aggregate: "ROUND(100.0 * COUNT(*) FILTER (WHERE (file_status = 'Approved')) / COUNT(*), 1)"
    aliases: [approval rate, approval percentage, success rate, share approved]
    unit: percent
  proposed_rooms:
    aggregate: "SUM(homestay_rooms) FILTER (WHERE NOT COALESCE(homestay_rooms > 100, FALSE))"
    aliases: [rooms, total rooms, room capacity, guest rooms, proposed rooms, capacity]
    unit: rooms
    base: new-build applications
  average_rooms:
    aggregate: "ROUND(AVG(homestay_rooms) FILTER (WHERE NOT COALESCE(homestay_rooms > 100, FALSE)), 1)"
    aliases: [average rooms, rooms per homestay, mean rooms]
    unit: rooms
  existing_rooms:
    aggregate: SUM(COALESCE(NULLIF(room_details -> 0 ->> 'total_number_single_room', '')::int, 0) + COALESCE(NULLIF(room_details -> 0 ->> 'total_number_double_bed_room', '')::int, 0))
    aliases: [existing rooms, rooms to upgrade]
    unit: rooms
    base: upgradation applications
  solar_share:
    aggregate: "ROUND(100.0 * COUNT(*) FILTER (WHERE solar_energy) / COUNT(*) FILTER (WHERE NOT is_upgradation), 1)"
    aliases: [solar adoption, share with solar]
    unit: percent
  rainwater_share:
    aggregate: "ROUND(100.0 * COUNT(*) FILTER (WHERE rainwater_harvesting) / COUNT(*) FILTER (WHERE NOT is_upgradation), 1)"
    aliases: [rainwater adoption, share with rainwater harvesting]
    unit: percent
  villages_covered:
    aggregate: "COUNT(DISTINCT village_code) FILTER (WHERE entity_type <> 'Unresolved')"
    aliases: [villages, villages covered, number of villages]
    unit: villages
  not_held:
  - money of any kind (subsidy, loan, cost, grant, EMI)
  - project start / end dates and duration
  - construction or operational status
  - bank, branch, sanction letter
  - caste / tribe / income / disability certificate
  - training, standard design, bed-nights, beds
  - rejection or sendback reason

region_groupings:
  note: >
    Users group districts by hill range. Expand into an IN list by district_lgd_code and state
    which districts were included. Counts are generated by LGD code.
  groups:
    "Garo Hills":
      districts: [East Garo Hills, North Garo Hills, South Garo Hills, South West Garo Hills, West Garo Hills]
      district_codes: [273, 656, 277, 663, 278]
      stored_region: Garo
      applications: 443
      aliases: [Garo, Garo region, Garo Hills region, GH]
    "Khasi Hills":
      # 2026-11-12 (onboarding): Ri Bhoi added. megh_db curated.v_homestay_api stores region = 'Khasi' for
      # RI BHOI (103 applications), as the ingestion team's LGD master does for every scheme (answer 2,
      # 2026-10-26; tests/test_db_changes_2026_10_26.py). Live total 703 (the CSV's 704 has one row megh_db lacks).
      districts: [East Khasi Hills, Eastern West Khasi Hills, South West Khasi Hills, West Khasi Hills, Ri Bhoi]
      district_codes: [274, 740, 658, 279, 276]
      stored_region: Khasi
      applications: 703
      aliases: [Khasi, Khasi region, Khasi Hills region, KH]
      note: Ri Bhoi included (region = 'Khasi' in megh_db, verified 2026-11-12). SME - please confirm.
    "Jaintia Hills":
      districts: [East Jaintia Hills, West Jaintia Hills]
      district_codes: [657, 275]
      stored_region: Jaintia
      applications: 151
      aliases: [Jaintia, Jaintia region, Jaintia Hills region, JH, Pnar region]
    "Ri Bhoi":
      districts: [Ri Bhoi]
      district_codes: [276]
      stored_region: unverified_in_db
      applications: 103
      aliases: [Ri Bhoi region, Bhoi]
  urban_rural:
    towns: { block_codes: [249806, 249807, 249808, 249809, 249810, 249811, 249812, 249814, 249820, 279714, 282009],
             applications: 278, aliases: [urban, towns, municipal areas, ULBs, urban local bodies] }
    rural: { rule: "block_lgd_code NOT IN (<the 11 town codes>)", applications: 1020,
             aliases: [rural, rural blocks, C&RD blocks, villages only] }
  whole_state:
    aliases: [Meghalaya, state, statewide, whole state, all districts, overall]
    behaviour: no district filter at all.
    applications: 1298

