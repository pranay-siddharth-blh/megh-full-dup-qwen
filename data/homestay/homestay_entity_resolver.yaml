    - { stored: On Hold, applications: 23, sql_predicate: "data_verified = 'On Hold'",
        aliases: [on hold, onhold, hold, held, kept on hold, put on hold] }
    - { stored: Wrong, applications: 5, sql_predicate: "data_verified = 'Wrong'",
        aliases: [wrong, wrong data, wrong records, incorrect data, wrong entry] }
    - { stored: null, label: Not yet verified, applications: 32, sql_predicate: "data_verified IS NULL",
        aliases: [not verified, not yet verified, unverified, verification pending, awaiting verification] }

  applicant_category:
    column: applicant_category
    values:
    - { stored: "Youth (18-35 yrs)", applications: 491, sql_predicate: "applicant_category = 'Youth (18-35 yrs)'",
        aliases: [youth, young, youth category, young entrepreneurs, 18-35, youth applicants] }
    - { stored: Women, applications: 479, sql_predicate: "applicant_category = 'Women'",
        aliases: [women category, women entrepreneur category, under the women category, mahila category] }
    - { stored: First Generation Entrepreneur, applications: 214, sql_predicate: "applicant_category = 'First Generation Entrepreneur'",
        aliases: [first generation entrepreneur, first-generation entrepreneurs, FGE, first gen, new entrepreneurs] }
    - { stored: Other, applications: 107, sql_predicate: "applicant_category = 'Other'",
        aliases: [other, others, other category, general category (stated as 'Other')] }
    - { stored: Differently Abled, applications: 7, sql_predicate: "applicant_category = 'Differently Abled'",
        aliases: [differently abled, PwD, persons with disabilities, disabled, divyang, specially abled, handicapped] }
    note: >
      'Women' without 'category' resolves to gender (overloaded_terms.women). 'General
