maintenance:
  regenerate_when: a new extract arrives, or the view is loaded and its column names differ from the placeholders.
  steps:
  - Rebuild the emulation from the new CSV and re-run gen_catalogue (district, block, constituency, village registry, proposed_cluster, proposed_district).
  - Re-check that every catalogue total reconciles to the row count.
  - Diff the categorical vocabularies (file_status, current_file_status, current_level, data_verified, application_type, applicant_category, application_mode) - a new stored value needs aliases.
  - Re-run the worked examples and update expected.
  - Append, never delete, aliases (house rule 13).
  - Log the change in Annotations/Homestay/README.md section 13.
  owner: SME (Tourism Department data) with the annotation team.
