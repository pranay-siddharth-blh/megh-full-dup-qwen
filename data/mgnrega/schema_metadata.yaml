# schema_metadata.yaml — MGNREGA
#
# Source: condensed from app/sql/schema_context.py's hand-curated MGNREGA blocks
# (_MGNREGA_TABLES, _MGNREGA_RULES, _MGNREGA_VOCAB) — this file does not
# invent new facts, it re-expresses the same SME-reviewed knowledge as
# embeddable prose for the schema-retrieval node (see openspec/changes/
# phase-3-schema-retrieval-join-discovery/proposal.md section 2), same
# pattern as data/cm_elevate/schema_metadata.yaml and
# data/focus_plus/schema_metadata.yaml.
#
# Read by app/knowledge/schema_metadata_ingest.py.

scheme:
  id: MGNREGA
  content: |
    MGNREGA is the rural employment guarantee scheme. Data is village-year
    grain across two separate fact tables — employment (person-days,
    households/persons employed, job cards) and expenditure (wage and
    material spend, LAKH RUPEES) — that must never be joined to each other
    directly; curated.v_district_year_summary is the sanctioned way to
    combine both KPIs at district-year grain. Common phrasings: "MGNREGA
    person-days", "work days", "man-days", "job cards issued", "wage
    expenditure", "100-day completion", "households employed".

tables:
  - ref: curated.v_employment
    content: |
      curated.v_employment is fact_mgnrega_employment pre-joined to
      year and geography — the query surface for person-days,
      households/persons employed, 100-day completions, and job cards.
      Still source-row grain: always SUM(...) GROUP BY, never read a row
      raw. job_cards_issued_total is a cumulative STOCK, not a per-period
      flow — report exactly one year_key, never sum it across years; for a
      statewide "how many job cards" with no year named, use
      WHERE year_key = (SELECT MAX(year_key) FROM curated.v_employment).
      women_employment_provided may be reported as a raw count but never as
      a computed percentage/share/ratio — its exact denominator is
      unconfirmed. There is no "dues" / "pending liabilities" / "unpaid
      amount" column anywhere in this partition, and no "pending" /
      "unpaid" / "awaiting" count for beneficiaries, households, persons or
      job cards — say plainly that a pending/backlog figure is not tracked
      here rather than fabricating a zero.

  - ref: curated.v_expenditure
    content: |
      curated.v_expenditure is fact_mgnrega_expenditure pre-joined to
      year and geography — unskilled_wage_exp, semi_skilled_wage_exp,
      material_exp, total_exp, all in LAKH RUPEES (never mix with PMAY-G's
      rupees or Focus Plus's unverified unit). Source-row grain — always
      SUM(...) GROUP BY. cost_per_person_day_rupees, if computed inline, is
      SUM(total_exp) * 100000 / NULLIF(SUM(person_days), 0) — never divide
      the lakh figure directly by person_days, which rounds to 0 for every
      row. The statutory "60:40 ratio" / wage-compliance figure is
      unskilled_wage_exp / total_exp, not (unskilled + semi-skilled) /
      total.

  - ref: curated.v_district_year_summary
    content: |
      curated.v_district_year_summary is THE way to answer any question
      that needs both MGNREGA facts together (employment and expenditure
      KPIs at the same district-year grain) — fact_mgnrega_employment and
      fact_mgnrega_expenditure must never be joined to each other directly,
      since they share no common grain. Also carries a precomputed
      cost_per_person_day_rupees column, preferred over computing it inline.

  - ref: curated.fact_mgnrega_employment
    content: |
      curated.fact_mgnrega_employment is the underlying fact behind
      curated.v_employment (year_key, geography_key, person_days,
      households_employed, persons_employed, households_completed_100_days,
      job_cards_issued_total). Prefer the view — it carries the same
      columns already joined to geography and year.

  - ref: curated.fact_mgnrega_expenditure
    content: |
      curated.fact_mgnrega_expenditure is the underlying fact behind
      curated.v_expenditure (year_key, geography_key, unskilled_wage_exp,
      semi_skilled_wage_exp, material_exp, total_exp — LAKH RUPEES). Prefer
      the view — it carries the same columns already joined to geography
      and year.

columns:
  - ref: curated.v_employment.job_cards_issued_total
    content: |
      job_cards_issued_total is a cumulative STOCK, not a flow — pin a
      single year_key and SUM across geographies, never sum across years.
      A bare SELECT job_cards_issued_total ... LIMIT 1 with no SUM/GROUP BY
      is always wrong: it returns one village's number as if it were the
      statewide total.

  - ref: curated.v_employment.women_employment_provided
    content: |
      women_employment_provided may be reported as a raw count only — never
      publish a computed percentage, share, or ratio from it. Which
      denominator it would be a share of is unconfirmed in the source data,
      so a computed ratio risks a confidently wrong number. Offer the raw
      count instead when a percentage is asked for.

  - ref: curated.v_expenditure.total_exp
    content: |
      total_exp (and unskilled_wage_exp, semi_skilled_wage_exp,
      material_exp alongside it) is in LAKH RUPEES. Always state the unit,
      and never combine or compare it directly against a PMAY-G rupee
      figure or a Focus Plus amount_disbursed value without converting —
      each scheme uses a different money unit.
