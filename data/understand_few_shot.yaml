# Few-shot examples for the Understand node (app/nlu/understand.py).
#
# Messy real-world input -> the QueryFrame it should produce. Each example is
# built from a tests/eval case (`from:` = its case id), so the agreement
# report (tests/eval/frame_agreement.py) lists these cases separately — they
# are "seen" by the prompt and would otherwise inflate the score.
#
# Frame conventions the examples teach (keep them consistent when editing):
#   - geo_mentions[].text is copied EXACTLY as typed ("westgaro hils", "wgh");
#     level is set only when the user said the level word ("district", "block").
#     "Meghalaya" is recorded with level "state".
#   - schemes only when named, aliased, or implied by scheme-only vocabulary
#     (person-days -> MGNREGA, houses -> PMAY-G, tranche -> Focus Plus,
#     applications -> CM Elevate). A generic word ("expenditure",
#     "beneficiaries", "disbursement") implies nothing: leave schemes empty.
#   - answers_pending=true means the message only answers the pending
#     clarification: fill just the slot(s) it supplies; rewritten_question is
#     the paused question with the answer merged in.
#   - a follow-up (is_followup=true) carries over what the conversation makes
#     certain (the scheme and metric of the previous turn).
examples:
  - from: messy-mgnrega-K1-01-01
    message: "total manrega expenditur in meghalaya"
    frame:
      rewritten_question: "What is the total MGNREGA expenditure in Meghalaya?"
      intent: DATA
      schemes: [MGNREGA]
      metric: total expenditure
      geo_mentions: [{text: meghalaya, level: state}]
      query_type: value

  - from: messy-mgnrega-K1-09-06
    message: "westgaro hils mgnrega spending"
    frame:
      rewritten_question: "What is the total MGNREGA expenditure in westgaro hils?"
      intent: DATA
      schemes: [MGNREGA]
      metric: total expenditure
      geo_mentions: [{text: westgaro hils, level: null}]
      query_type: value

  - from: messy-mgnrega-K2-04-12
    message: "persondays trend all years"
    frame:
      rewritten_question: "What is the year-wise trend of MGNREGA person-days across all years?"
      intent: DATA
      schemes: [MGNREGA]
      metric: person-days
      year_text: all years
      query_type: trend
      group_by: year

  - from: messy-pmay-K2-02-07
    message: "how many houses completed"
    frame:
      rewritten_question: "How many PMAY-G houses have been completed?"
      intent: DATA
      schemes: [PMAY-G]
      metric: houses completed
      query_type: value

  - from: messy-pmay-K1-01-03
    message: "awas yojana me kitne ghar sanction hue"
    frame:
      rewritten_question: "How many houses have been sanctioned under PMAY-G?"
      intent: DATA
      schemes: [PMAY-G]
      metric: houses sanctioned
      query_type: value

  - from: messy-focus-F1-04-07
    message: "top 5 district focus+ disbursment"
    frame:
      rewritten_question: "What are the top 5 districts by Focus Plus disbursement?"
      intent: DATA
      schemes: [Focus Plus]
      metric: disbursement
      query_type: ranking
      group_by: district
      top_n: 5

  - from: messy-focus-F1-02-05
    message: "disbursement by tranche"
    frame:
      rewritten_question: "What is the Focus Plus disbursement broken down by tranche?"
      intent: DATA
      schemes: [Focus Plus]
      metric: disbursement
      query_type: distribution
      group_by: tranche

  - from: mgnrega-K2-06
    message: "Top 5 districts by MGNREGA households employed."
    frame:
      rewritten_question: "What are the top 5 districts by MGNREGA households employed?"
      intent: DATA
      schemes: [MGNREGA]
      metric: households employed
      query_type: ranking
      group_by: district
      top_n: 5

  - from: cmelevate-C1-06
    message: "Are any applicants submitting duplicate applications?"
    frame:
      rewritten_question: "How many CM Elevate applicants have submitted duplicate applications?"
      intent: DATA
      schemes: [CM Elevate]
      metric: duplicate applications
      query_type: value

  # Superlatives. Deliberately SYNTHETIC (not tests/eval cases): added after the
  # step-10 eval showed "worst" / "best and worst" questions getting a top-5
  # default; examples copied from those very cases would inflate their score.
  - from: synthetic-singular-superlative
    message: "which block had the fewest persondays"
    frame:
      rewritten_question: "Which block had the fewest MGNREGA person-days?"
      intent: DATA
      schemes: [MGNREGA]
      metric: person-days
      query_type: ranking
      group_by: block
      top_n: 1

  - from: synthetic-both-ends
    message: "highest and lowest districts for focus plus disbursement"
    frame:
      rewritten_question: "Which districts have the highest and the lowest Focus Plus disbursement?"
      intent: DATA
      schemes: [Focus Plus]
      metric: disbursement
      query_type: comparison
      group_by: district

  - from: audit-conv-11   # its first turn
    message: "total expenditure?"
    frame:
      rewritten_question: "What is the total expenditure?"
      intent: DATA
      schemes: []
      metric: total expenditure
      query_type: value
      unclear: "scheme not stated; 'expenditure' is not specific to one scheme"

  - from: audit-conv-11
    context:
      pending_question: "total expenditure for PMAY-G"
      pending_options: [FY 2022-23, FY 2023-24, All financial years combined]
    message: "wgh,2017"
    frame:
      rewritten_question: "What is the total PMAY-G expenditure in wgh for 2017?"
      intent: DATA
      answers_pending: true
      geo_mentions: [{text: wgh, level: null}]
      year_text: "2017"

  - from: audit-conv-01
    context:
      recent_turns:
        - {user: "how many financial years in focus+", schemes: [Focus Plus]}
        - {user: "in mgnrega?", standalone: "How many financial years of data are there for MGNREGA?", schemes: [MGNREGA]}
    message: "what about pmay-g?"
    frame:
      rewritten_question: "How many financial years of data are there for PMAY-G?"
      intent: DATA
      is_followup: true
      schemes: [PMAY-G]
      metric: number of financial years of data
      query_type: value

  - from: audit-018
    message: "What documents are required?"
    frame:
      rewritten_question: "What documents are required to apply?"
      intent: KNOWLEDGE
      schemes: []
      unclear: "scheme not stated"

  - from: audit-060
    message: "who is pm?"
    frame:
      rewritten_question: "who is pm?"
      intent: EDGE
      schemes: []
      unclear: "not about a covered scheme"
