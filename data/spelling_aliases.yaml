# Hand-kept spelling aliases (spelling-fix brief, 2026-10-29; read by app/spelling.py).
#
# Add an alias here, no code change: restart the app (or call spelling.reload()).
# Every alias is matched as whole words, case-insensitively; "+" counts as the word
# "plus". A multi-word alias also matches when each of its words of 4+ letters is
# misspelt a little (rapidfuzz ratio >= 80, same first letter): "fokus legasy" is
# "focus legacy". Words of 1-3 letters ("cm", "g") must be typed exactly.
#
# District names and their usual aliases (EKH, "West Garo", "Ribhoi", "Tura district")
# come from the entity-resolver catalogue (data/<scheme>/*_entity_resolver.yaml) and
# are not repeated here. Put a district alias here only when the catalogue lacks it.
#
# A typed -> chosen pair from a "Did you mean" pick is logged as a candidate alias
# ("spelling: candidate alias"); a person reviews it and adds it here.

