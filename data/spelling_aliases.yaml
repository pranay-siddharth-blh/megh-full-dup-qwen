# Other NAMES of a scheme, always written as the scheme's name even though the pipeline's
# own matcher reads them: the 4B guardrail model does not, and refused "who is eligible
# for awas yojana" as out of scope (live 2026-10-29, G8). Each must also be listed above.
rename:
  - awas yojana
  - awaas yojana
  - pradhan mantri awas yojana gramin
  - awas
  - awaas
  - old focus
  - original focus
  - c m elevate

# A bare misspelt "focus" ("fokus", "focas") becomes "Focus": the existing
# which-Focus rule then decides (Focus Plus vs Focus Legacy; CLAUDE.md §4: a bare
# "Focus" is never guessed).
bare_focus:
  - fokus
  - focas
  - facus
  - focuss
  - foccus

# Ordinary domain words a typo is corrected TO (closed list, brief §3.1 step 3). A
# typed word is corrected only when it is not itself a known word, a place or a
# village name, starts with the same letter and is 1 edit away (2 for 6-10 letters,
# 3 above) from exactly one word here: "mony" -> money, "houshold" -> household,
# "crd" -> card. The 9B rephraser fixes the rest; this list exists because its
# rewrite is checked against the original, and "mony" (too short for that check's
# own typo reader) made the check reject "money" (T10, 2026-10-29).
