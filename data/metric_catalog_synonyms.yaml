# Approved officer wordings for the metric catalogue (B1, RAG plan; user decision 2026-10-27).
#
# Each entry is an EXACT synonym added to that measure's catalogue phrases at startup
# (app/metric_catalog.py SYNONYMS_FILE), the same as the data team's own synonyms in
# semantic.metric_definitions. A wording here answers through the catalogue query only
# for the (measure, query type) pairs data/metric_catalog_verified.yaml lists.
#
# How a wording gets here: the app logs every data question whose wording names no
# catalogue measure, with its nearest measure by meaning (logs/metric_meaning_shadow.jsonl).
#   .venv/Scripts/python.exe -X utf8 tests/metric_meaning/review.py
# lists them. A PERSON checks each one: does the wording mean exactly that measure,
# with no qualifier that changes it ("administrative expenditure" is NOT total
# expenditure; "wage rate" is NOT the wage share)? Only then add it below, restart the
# app, and send the same wording to the ingestion team for semantic.metric_definitions.
#
# Format:
#   mgnrega_employment_generated:
#     - labour days
# 2026-11-14: wordings the accuracy gold bank asks that named no measure (found in a run with the model server down:
# each then went to model-written SQL). Each was checked against the bank's independent truth SQL for that measure.
focus_legacy_pg_count:
  - pgs
  - pg
  - producer groups
  - producer groups paid
  - pgs paid
focus_legacy_total_disbursed:
  - amount
  - money
  - pay out
  - paid out
  - amount remitted
  - total remitted
cm_elevate_disb_total_disbursed:
  - disbursement
  - total disbursement
  - disbursement amount
  - total disbursement amount
  - amount disbursed
  - total disbursed
  - total amount disbursed
  - money disbursed
focus_plus_payments:
  - disbursements
  - disbursements made
focus_legacy_members_paid_for:
  - pg members
  - members
  - memberships   # 2026-11-14: CARD-fl-mem truth SUM(no_of_pg_members) = 102,021, the measure's own figure
pmay_houses_sanctioned:
  - houses
  # 2026-11-14 (follow-up rules, FU-05 "only PMAY-G" after a beneficiaries comparison): curated.v_pmay is one row per
  # beneficiary, so COUNT(*) IS the beneficiary count (the SQL prompt's PMAY-G rule; cross_figures counts PMAY-G
  # beneficiaries the same way). Every PMAY(-G) beneficiaries question in the gold bank has COUNT(*) as its truth.
  - beneficiaries
  - beneficiary
mgnrega_employment_generated:
  - persondays
mgnrega_households_employed:
  # 2026-11-14 (follow-up rules; the voice shaper's "what about the households instead"): a bare "households" in
  # MGNREGA is the households given work, as the bank reads it ("In Dalu block, how many MGNREGA households ... are
  # there?" -> SUM(households_employed)) and as cross_figures counts MGNREGA beneficiaries. The longer phrases still
  # win where they are said ("registered households" = job cards, "households completing 100 days").
  - households
  - household
  - households received employment
  - households provided employment
  - households got work
  - households employed
cm_elevate_disb_subsidy_disbursed:
  # 2026-11-14 (W2-CH-14 "and CM Elevate Legacy subsidy there?"): the view holds one subsidy figure only,
  # total_subsidy_disbursement (no sanctioned subsidy column); the bank's truth is SUM(total_subsidy_disbursement).
  # "subsidy sanctioned" still names two measures (subsidy + sanctioned) and is left to the model path.
  - subsidy
focus_plus_amount_disbursed:
  - paid out
  - money disbursed
  - money
