# Metric catalogue — which measures may answer through the catalogue query (D-071).
#
# app/metric_catalog.py loads semantic.metric_definitions (the data team's 62
# measures). A measure answers a question through its catalogue query ONLY when
# it is listed below for that query type; every other measure is matched and
# logged in shadow mode while the model path answers as before.
#
# A measure is listed after tests/metric_catalog_eval.py (live, VPN) showed its
# catalogue figure equal to the figure the current pipeline gives for the same
# question, at the state, a district, a block and a year. The evidence column
# says what was compared and when. A measure that disagreed stays off this list
# and is explained in new_docs/Metric_Catalogue_Report_2026-10-26.md.
#
# Edit this file only with fresh evidence; it is read once at startup.

# Per-year tallies: adding financial years overstates them (the catalogue's own
# filters_required notes). They are only built for exactly one year, or per year.
single_year:
  - mgnrega_job_card_stock
  - mgnrega_households_employed
  - mgnrega_households_100_days
  - mgnrega_persons_employed

# Schemes whose blocks are not on lgd_block: no block-level catalogue query.
# Focus Plus maps its blocks on block_name_raw (lgd_block is NULL on 15% of its
# rows, hiding Rs 18 crore — tests/test_focusplus_block_columns.py).
no_block_level:
  - Focus Plus

