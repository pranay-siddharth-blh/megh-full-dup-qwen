# Bitbucket Pipelines — Megh One AI (Meghalaya NL assistant)
#
# Python 3.11 to match the Dockerfile (`FROM python:3.11-slim`); production
# runs 3.11, so CI tests 3.11.
#
# Tests (docs/TESTING.md §2). There are no tests/unit or tests/integration
# folders; every suite is a flat tests/test_*.py, in two kinds:
#   1) pytest-style: any file with a `def test_` (34 today). Run in ONE pytest
#      call over that list, never `pytest tests` (crashes on the scripts, KI-018).
#   2) plain scripts: every other tests/test_*.py (14 today). Each prints its
#      results and exits 0/1, so each is run with `python`.
# Both lists are found by grep, so a new test file is picked up automatically.
# Not run: tests/live_context_validation.py and tests/smoke_*.py (the glob
# does not match them) — they need the office VPN, the real gateway and megh_db.
#
# The cloud runner has no .env, no database and no model gateway. The
# LangGraph checkpointer uses memory (tests/conftest.py pins it for pytest; the
# env var below covers the scripts), and the guardrail model check is off (its
# rules layer still runs; tests/test_guardrails.py fakes the model).
#
# LangGraph is the only orchestrator (D-036): there are no behaviour flags to
# sweep, so the old second "graph + followup + RLS on" run is gone.

image: python:3.11

definitions:
  caches:
    # fastembed downloads BAAI/bge-small-en-v1.5 on first use; cache it or
    # every run re-downloads the ONNX model.
    fastembed: fastembed_cache
    npm: frontend/node_modules

  steps:
    - step: &syntax-gate
        name: Syntax gate
        caches:
          - pip
        script:
          - python --version
          # Fail fast on a syntax error before spending time on deps.
          - python -m compileall -q app tests

    - step: &tests
        name: Tests (pytest suites + script suites)
        caches:
          - pip
          - fastembed
        script:
          - pip install --upgrade pip
          - pip install -r requirements.txt pytest pytest-asyncio
          - export PYTHONPATH=.
          - export PYTHONIOENCODING=utf-8
          - export PIPELINE_GRAPH_CHECKPOINTER_DSN=memory
          - export GUARDRAIL_MODEL_ENABLED=false
          - PYTEST_FILES=$(grep -lE '^\s*(async )?def test_' tests/test_*.py)
          - SCRIPT_FILES=$(grep -LE '^\s*(async )?def test_' tests/test_*.py || true)
          - echo "pytest files:" $(echo "$PYTEST_FILES" | wc -w) " script files:" $(echo "$SCRIPT_FILES" | wc -w)
          - python -m pytest -q -p no:cacheprovider $PYTEST_FILES
          - |
            fail=0
            for t in $SCRIPT_FILES; do
              echo "=== $t"
              if python "$t"; then
                echo "PASS $t"
              else
                echo "FAIL $t"
                fail=1
              fi
            done
            exit $fail

    - step: &frontend-build
        name: Frontend builds
        image: node:20
        caches:
          - npm
        script:
          - cd frontend
          - npm ci
          # Builds into ../web/app, the bundle FastAPI serves at /megh-chat.
          - npm run build

    - step: &docker-build
        name: Docker image builds
        services:
          - docker
        caches:
          - docker
        script:
          # Proves the Dockerfile is still valid and deps resolve for 3.11-slim.
          # Does not push anywhere — see the deploy note at the bottom of this file.
          - docker build -t megh-nlp-service:$BITBUCKET_COMMIT .
          - docker image ls megh-nlp-service

    - step: &dependency-audit
        name: Dependency audit
        caches:
          - pip
        script:
          - pip install --upgrade pip pip-audit
          # Advisory only: a new CVE in a pinned dep should surface, not block
          # an unrelated merge. Flip `|| true` off once the backlog is clean.
          - pip-audit -r requirements.txt || true

pipelines:
  # Any branch without a more specific rule.
  default:
    - step: *syntax-gate
    - parallel:
        - step: *tests
        - step: *frontend-build

  pull-requests:
    '**':
      - step: *syntax-gate
      - parallel:
          - step: *tests
          - step: *frontend-build
      - step: *docker-build

  # Merge queue (Repository settings → Workflow → Merge queues). Bitbucket will
  # not enable a queue until the TARGET branch's copy of this file holds a
  # pipeline under this key, and the key must match the queue's name in the UI
  # character for character ("We couldn't enable the merge queue", 2026-10-21).
  # It runs on a temporary bitbucket-merge-queue-* branch that already carries
  # every PR queued ahead of this one, so it is the PR checks plus the image
  # build; the audit and the manual deploy stay on the Main run after the merge.
  merge-queues:
    mergequeue-main:
      - step: *syntax-gate
      - parallel:
          - step: *tests
          - step: *frontend-build
      - step: *docker-build

  branches:
    # Glob, not a plain `main`, on purpose: Bitbucket branch matching is
    # CASE-SENSITIVE and this repo's default branch is `Main` (capital M),
    # while the local clone's branch is lowercase `main`. Matching both means
    # the pipeline runs whichever of the two the commit lands on.
    '{main,Main}':
      - step: *syntax-gate
      - parallel:
          - step: *tests
          - step: *frontend-build
      - step: *docker-build
      - step: *dependency-audit
      - step:
          name: Deploy to application VMs
          deployment: production
          trigger: manual
          script:
            - echo "Deploy is intentionally manual and not implemented here."
            - echo "The target VMs sit behind the ESDS vFirewall on a private"
            - echo "network (10.48.242.x). Bitbucket's cloud runners cannot"
            - echo "reach them, so this step needs a self-hosted runner inside"
            - echo "that network before it can do anything real."
            - echo "See deploy/DEPLOYMENT.md for the current manual procedure."
            - exit 1
